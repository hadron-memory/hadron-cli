# hadron-server#1447 — draft spec corpora and minting (cli#777).
#
# A spec corpus is created in DRAFT (createMemory draftCorpus: true) or is
# MINTED. In a draft, citations are not yet permanent: a citation can be
# reserved as a placeholder, a spec renumbered (its URN references rewritten),
# and what refers to a spec read back. Minting is one step for the whole
# corpus, one-way, and refuses while a blocker remains.

# The corpus state of one memory — `spec describe` reads it.
query SpecCorpusState($ref: ID!) {
  memory(ref: $ref) {
    id
    urn
    corpusState
    corpusMintedAt
  }
}

# #1450 — reserve a citation as a placeholder spec. name is optional: the
# server names an unnamed placeholder itself.
mutation ReserveSpecCitation(
  $memoryRef: ID!
  $loc: String!
  # @genqlient(omitempty: true)
  $name: String
) {
  reserveSpecCitation(memoryRef: $memoryRef, loc: $loc, name: $name) {
    id
    loc
    name
    role
    isPlaceholder
  }
}

# #1449 — what refers to the spec at loc: node URNs in the corpus text
# (inside URLs too) plus real edges from corpus nodes. Exact citation only.
query SpecBacklinks($memoryRef: ID!, $loc: String!) {
  specBacklinks(memoryRef: $memoryRef, loc: $loc) {
    kind
    field
    sourceLoc
    sourceNodeId
    targetLoc
    text
  }
}

# #1449 — references that do not reach a written spec. Minting refuses while
# any remain.
query SpecUnresolvedReferences($memoryRef: ID!) {
  specUnresolvedReferences(memoryRef: $memoryRef) {
    kind
    field
    reason
    sourceLoc
    sourceNodeId
    targetLoc
    text
  }
}

# #1449 — renumber a spec (and its subtree) and rewrite the URN references to
# it. dryRun returns the plan and writes nothing.
mutation RenumberSpec(
  $memoryRef: ID!
  $fromLoc: String!
  $toLoc: String!
  $dryRun: Boolean!
) {
  renumberSpec(memoryRef: $memoryRef, fromLoc: $fromLoc, toLoc: $toLoc, dryRun: $dryRun) {
    dryRun
    moved {
      fromLoc
      toLoc
    }
    rewrites {
      nodeId
      loc
      status
      fields
      count
      error
    }
    textCitations {
      sourceNodeId
      sourceLoc
      field
      citation
      excerpt
    }
  }
}

# #1448 — mint the corpus. dryRun returns the full report without minting; a
# real run refuses SPEC_CORPUS_MINT_BLOCKED while a blocker remains.
mutation MintSpecCorpus($memoryRef: ID!, $dryRun: Boolean!) {
  mintSpecCorpus(memoryRef: $memoryRef, dryRun: $dryRun) {
    memoryId
    dryRun
    minted
    staleAbstractsBlock
    blockers {
      kind
      rule
      loc
      targetLoc
      message
    }
    staleAbstracts {
      kind
      rule
      loc
      targetLoc
      message
    }
    openQuestions {
      decider
      questions {
        loc
        question
      }
    }
  }
}

mutation MintMemoryNodes($memoryRef: ID!, $dryRun: Boolean!) {
  mintMemoryNodes(memoryRef: $memoryRef, dryRun: $dryRun) {
    memoryId
    dryRun
    minted
    mintedCount
    mintLocs
    staleAbstractsBlock
    blockers { kind rule loc targetLoc message }
    staleAbstracts { kind rule loc targetLoc message }
    openQuestions { decider questions { loc question } }
  }
}

# #1450 — which specs in a DRAFT corpus are placeholders. A separate, minimal
# scan run only for a draft, so the shared node projections don't select
# isPlaceholder: an older server would reject every spec read over it.
# Keep NodeFilter omission semantics even when genqlient discovers this
# operation before FindNodes during generation.
# @genqlient(for: "NodeFilter.memoryIds", omitempty: true)
# @genqlient(for: "NodeFilter.approvalState", omitempty: true)
# @genqlient(for: "NodeFilter.minted", omitempty: true)
# @genqlient(for: "NodeFilter.memoryClasses", omitempty: true)
# @genqlient(for: "NodeFilter.nodeType", omitempty: true)
# @genqlient(for: "NodeFilter.objectType", omitempty: true)
# @genqlient(for: "NodeFilter.tags", omitempty: true)
# @genqlient(for: "NodeFilter.isRunnable", omitempty: true)
# @genqlient(for: "NodeFilter.locPrefix", omitempty: true)
# @genqlient(for: "NodeFilter.createdBy", omitempty: true)
# @genqlient(for: "NodeFilter.updatedAfter", omitempty: true)
# @genqlient(for: "NodeFilter.updatedBefore", omitempty: true)
# @genqlient(for: "NodeFilter.includeDeleted", omitempty: true)
# @genqlient(for: "NodeFilter.where", omitempty: true)
# @genqlient(for: "NodeFilter.role", omitempty: true)
# @genqlient(for: "NodeFilter.contentScope", omitempty: true)
query SpecPlaceholderScan(
  $filter: NodeFilter!
  $sort: NodeSort!
  $limit: Int!
  $offset: Int!
) {
  findNodes(filter: $filter, sort: $sort, limit: $limit, offset: $offset) {
    hits {
      node {
        loc
        isPlaceholder
      }
    }
  }
}

# #1294/#1459 — draft-only governed spec replacement. The server binds apply
# to the exact dry-run plan and reports protected selections explicitly.
# @genqlient(for: "SpecSearchReplaceInput.expectedPlan", omitempty: true)
# @genqlient(for: "SpecSearchReplaceInput.maxNodesChanged", omitempty: true)
# @genqlient(for: "SpecSearchReplaceInput.reason", omitempty: true)
mutation SearchReplaceInSpecNodes(
  $input: SpecSearchReplaceInput!
) {
  searchReplaceInSpecNodes(input: $input) {
    nodesSelected
    nodesScanned
    nodesSkipped
    nodesChanged
    totalReplacements
    dryRun
    plan
    skips {
      nodeId
      loc
      reason
      governedKinds
    }
    results {
      nodeId
      loc
      memoryId
      replacements
      fields {
        field
        matches
      }
    }
  }
}
