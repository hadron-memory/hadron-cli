# Worker-own grant read, scoped by the bound person-driven session.
query TeamGrant($ref: ID!) {
  grant(ref: $ref) { id action values holderKind holderId startsAt expiresAt maxUses useCount reason createdAt activatedAt revokedAt allows }
}

# One explicit page of the bound worker's grants; zero limit counts only.
query TeamGrants($limit: Int!, $offset: Int!) {
  grants(limit: $limit, offset: $offset) {
    total
    items { id action values holderKind holderId startsAt expiresAt maxUses useCount reason createdAt activatedAt revokedAt allows }
  }
}

# cli#1868: the bound worker asks for a grant (pending until a person signs it).
# Optional input fields are omitted when unset: omitted preserves the server
# default, an explicit null would be read as a value.
# @genqlient(for: "CreateGrantInput.startsAt", omitempty: true)
# @genqlient(for: "CreateGrantInput.expiresAt", omitempty: true)
# @genqlient(for: "CreateGrantInput.maxUses", omitempty: true)
# @genqlient(for: "CreateGrantInput.appRef", omitempty: true)
mutation TeamCreateGrant(
  $input: CreateGrantInput!
) {
  createGrant(input: $input) { id action values holderKind holderId startsAt expiresAt maxUses useCount reason createdAt activatedAt revokedAt allows }
}

fragment TeamGrantSigningRequestFields on GrantSigningRequest {
  id grantId version termsHash payloadVersion state
  requestedBy { userId appId workerId sessionId }
  createdAt expiresAt endedAt ceremonyUrl
}

mutation TeamRequestGrantSignature($grantRef: ID!) {
  requestGrantSignature(grantRef: $grantRef) { ...TeamGrantSigningRequestFields }
}

mutation TeamWithdrawGrantSigningRequest($id: ID!) {
  withdrawGrantSigningRequest(id: $id) { ...TeamGrantSigningRequestFields }
}

query TeamGrantSigningRequest($id: ID!) {
  grantSigningRequest(id: $id) { ...TeamGrantSigningRequestFields }
}
