# PR protocol commands (#1664 over server #3448). Minimal committed receipt;
# no task-property mirror is read or interpreted by the CLI.
fragment PRProtocolReceipt on PrProtocolResult {
  task { id handle status }
  action { code state taskLoc taskUrn }
}
mutation PRSchedule($taskRef: ID!, $slots: [String!]!) {
  setReviewSchedule(taskRef: $taskRef, slots: $slots) { ...PRProtocolReceipt }
}
mutation PRFreeze($taskRef: ID!, $head: String!) {
  freezePullRequestHead(taskRef: $taskRef, head: $head) { ...PRProtocolReceipt }
}
mutation PRSeat($taskRef: ID!, $slot: String!, $head: String!,
  # @genqlient(omitempty: true)
  $supersedes: ID) {
  assignReviewSeat(taskRef: $taskRef, slot: $slot, head: $head, supersedes: $supersedes) { ...PRProtocolReceipt }
}
mutation PRVerdict($taskRef: ID!, $head: String!, $verdict: ReviewVerdict!,
  # @genqlient(omitempty: true)
  $node: String,
  # @genqlient(omitempty: true)
  $receipt: String) {
  recordReviewVerdict(taskRef: $taskRef, head: $head, verdict: $verdict, node: $node, receipt: $receipt) { ...PRProtocolReceipt }
}
# cli#3006 (hadron-server#4869, #4441): withdraw a finished seat's negative verdict at the same head. $receipt
# is omitted when unset. This document never carries an instruction: PRWithdrawInstructed (cli#3013) does.
mutation PRWithdraw($taskRef: ID!, $head: String!,
  # @genqlient(omitempty: true)
  $receipt: String) {
  withdrawReviewVerdict(taskRef: $taskRef, head: $head, receipt: $receipt) { ...PRProtocolReceipt }
}
# cli#3013: the same withdraw carrying a holder's instruction claim (cor:dmo:050:12), for a worker on the
# App-manager arm. Its own document, so a no-flag request is exactly PRWithdraw.
mutation PRWithdrawInstructed($taskRef: ID!, $head: String!,
  # @genqlient(omitempty: true)
  $receipt: String,
  $instruction: ActInstructionInput!) {
  withdrawReviewVerdict(taskRef: $taskRef, head: $head, receipt: $receipt, instruction: $instruction) { ...PRProtocolReceipt }
}
mutation PRReady($taskRef: ID!, $head: String!) {
  recordReadyCall(taskRef: $taskRef, head: $head) { ...PRProtocolReceipt }
}
query PRReadiness($taskRef: ID!, $head: String!) {
  pullRequestReadiness(taskRef: $taskRef, head: $head) {
    ready head slots { slot currentTaskId state verdict head counts }
  }
}

# hadron-cli#2189 (S12b, hadron-server#4280; Proposed cor:agt:130:05): record
# that a defect found after a PR merged traces back to that PR's build task.
# Backs `team task link-defect`. $introducedAtHead is omitted when unset; this
# slice never sends an instruction. The bound session rides the
# X-Hadron-Session header, so a worker is the actor when one is bound.
mutation TaskLinkDefect(
  $prTaskRef: ID!
  $defectRef: String!
  # @genqlient(omitempty: true)
  $introducedAtHead: String
) {
  linkDefectToPullRequest(prTaskRef: $prTaskRef, defectRef: $defectRef, introducedAtHead: $introducedAtHead) {
    taskId
    defect
    introducedAtHead
    eventId
    linkedAt
    created
  }
}
