# Page-monitor watches (hadron-server #1562; cli#1920). Org ADMIN/OWNER, gated
# server-side by the org role and the tool.web_poll policy: the CLI adds no
# check of its own (cor:web:030:00).

# One page of an org's watches (server#4123 / #4193): default 20, clamp 1-100,
# `after` an opaque cursor the CLI passes back verbatim and never builds. The
# page's `total` is deliberately not selected (cli#2032): the command claims
# only the rows it was sent.
fragment WebPollFields on WebPoll {
  jobId
  appId
  sourceRunId
  url
  status
  consecutiveFailures
  triggerCount
  createdAt
  expiresAt
  lastCheckedAt
  lastTriggeredAt
  nextRunAt
}

query WebPollsPage(
  $orgRef: ID!
  # @genqlient(omitempty: true)
  $first: Int
  # @genqlient(omitempty: true)
  $after: String
) {
  webPollsPage(orgRef: $orgRef, first: $first, after: $after) {
    items {
      ...WebPollFields
    }
    hasMore
    nextCursor
  }
}

# A job id from another org and an unknown one both answer NOT_FOUND.
# alreadyCancelled is true when the watch had been stopped before this call.
mutation CancelWebPoll($orgRef: ID!, $jobId: ID!) {
  cancelWebPoll(orgRef: $orgRef, jobId: $jobId) {
    jobId
    cancelled
    alreadyCancelled
  }
}
