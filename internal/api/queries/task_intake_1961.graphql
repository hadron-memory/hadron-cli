# cli#1961 (hadron-server#4084, cor:agt:120:02): the reads and writes the
# intake adapter flow makes in Hadron. Needs a server with #4084 (the batch
# external-id read and AgentTask.portalUrl).

# Which of these outside items does a task of the App already hold? Hadron's
# check is authoritative (cor:agt:120): an item is dropped only because a task
# holds it. 1 to 100 ids; each is compared exactly as written, in any state.
query IntakeTasksByExternalIds($appRef: ID!, $externalIds: [String!]!) {
  agentTasks(appRef: $appRef, externalIds: $externalIds) {
    id
    externalId
  }
}

# The claim: an ordinary root create naming the external id. The create IS the
# claim (TASK_EXTERNAL_ID_TAKEN means another caller won). portalUrl is the
# server's, printed for the adapter's mark; null when the server prints none.
# The same omit-vs-null directives as AgentTaskCreate (agenttasks.graphql): both
# documents bind CreateAgentTaskInput, and genqlient resolves a shared input's
# per-field omitempty from whichever documents name it, so a document without
# them makes the generated tags flip between runs.
# @genqlient(for: "CreateAgentTaskInput.project", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.finishBy", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.priority", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.blockedBy", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.properties", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.externalId", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.minTier", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.match", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.roles", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.team", omitempty: true)
# @genqlient(for: "AgentTaskReferenceInput.label", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.modelGroupIn", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.modelGroupNotIn", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.role", omitempty: true, bind: "encoding/json.RawMessage")
mutation IntakeClaimTask(
  $input: CreateAgentTaskInput!
) {
  createAgentTask(input: $input) {
    id
    handle
    title
    status
    externalId
    portalUrl
    assignee {
      id
      kind
      name
      urn
    }
  }
}

# The claimant starts a task it assigned to itself (assignee-only).
mutation IntakeStartTask($taskId: ID!) {
  startAgentTask(taskId: $taskId) {
    id
    status
  }
}
