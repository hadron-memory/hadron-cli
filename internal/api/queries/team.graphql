# `hadron team` — workers and sessions (Worker model, #428 / hadron-server#974).
#
# A persona is pure DRESSING on an Agent (personaRole + a {{name}}-templated
# personaPrompt — metadata, edited via `agent update`). The named identity
# ("Iris") is the WORKER: the casting of an installed Agent into an App
# (cor:dmo:050:11, cor:agt:020:01). A worker IS addressable — hrn:worker:<root>:<app-slug>:<slug>
# (#991) — but the URN keys on a DERIVED, permanent slug, never on the name:
# two names may legally slugify to one token ("Mary Jane"/"Mary-Jane"), so a
# name-keyed URN would not resolve to exactly one casting (cor:agt:020:02,
# still durable law).
#
# What a workerRef ACCEPTS varies by operation, so read each one: worker(ref:)
# takes an id or a URN, while SessionInput.workerRef additionally takes an
# App-scoped NAME (#990). The CLI resolves session names to ids client-side
# anyway — `session start` needs the row for the boot briefing and the
# retired-worker refusal — but that is this client's choice, not the surface's
# contract.

fragment WorkerFields on Worker {
  id
  # The address (#991): derived from the App's URN plus the permanent slug,
  # computed rather than stored. Null only when the App's URN predates the
  # flat grammar-v2 shape this arity needs — so never render it unguarded.
  urn
  # The portal link that opens this worker (hadron-server#1026, cor:api:230:01).
  # SERVER-BUILT, and a client never composes one: the canonical spelling, the
  # resolver route and the deployment origin are all the platform's, so a guess
  # produces a URL that looks right and resolves to nothing.
  #
  # Nullable for two unrelated reasons — the deployment has no usable web
  # origin, or the App's URN predates the arity a worker URN needs — and BOTH
  # render as nothing. Absence is a defined answer, never an error, and never a
  # cue to fall back to composing one. `urn` beside it is unaffected: losing the
  # link must not cost the caller the reference.
  portalUrl
  slug
  appId
  agentId
  name
  role
  # The resolved boot briefing: the agent's personaPrompt template with
  # {{name}}/{{role}} bound, then promptOverride appended. Printed on cast and
  # surfaced by `worker get` — it is what a session driver adopts.
  prompt
  promptOverride
  # #1024 — the repo affinity of this worker's ROLE, resolved server-side so a
  # caller already holding the worker needs no second trip to teamRoles.
  #
  # EMPTY MEANS "NEVER WARN", and it is the answer to every uncertainty rather
  # than one case among several: no role, a role with no definition, an
  # unreadable system memory, and a DENIED read all return []. So there is no
  # unconfigured-vs-spans-everything distinction for a client to draw — which
  # is deliberate, since both mean do-not-warn and telling them apart would
  # make an unconfigured team look misconfigured.
  repos
  memoryId
  # The HOLD (hadron-server#1050, cor:agt:020:09): whose name this is, and
  # since when. A name is held by a PERSON and only an explicit release frees
  # one — no session end, idle window, expiry or reap does.
  #
  # Both are MASKED TO NULL ON DENY, like prompt/promptOverride/memoryId. So a
  # bare null means "unheld OR not visible to you" and must never be rendered
  # as "free" on its own. `hasLiveSession` below is what tells the two apart —
  # see the note there, and note that `worker release` still hedges, because
  # collapsing its classification is a separate change from rendering a column
  # (hadron-cli PR #504 retracted two designs in that area).
  heldByUserId
  heldAt
  # hadron-server#1086 (hadron-cli#487) — is a session OPEN on this name right
  # now, and when was the name last DRIVEN.
  #
  # Three things about these that decide every render, all of them the server
  # engineer's (issue #487, 2026-08-25) rather than inferred here:
  #
  # 1. `hasLiveSession` IS NOT AVAILABILITY. Availability is the HOLD above
  #    (cor:agt:020:09). Since hadron-server#1114 liveness is DERIVED at read
  #    time — not ended AND driven inside the session type's idle window — so
  #    it is no longer "a session row is open": an abandoned session stays open
  #    indefinitely and stops reading as live. It is still not presence, since
  #    the window is generous and a worker session outlives the chat session
  #    that started it. Conflating liveness with availability IS #487; a column
  #    that lets liveness read as availability would re-file the issue it
  #    closes.
  # 2. `lastActiveAt: null` ON A PERMITTED READ MEANS NEVER DRIVEN. That is the
  #    state the whole issue is about: a casting nobody picked up currently
  #    renders identically to one worked yesterday, so a coordinator dispatches
  #    into a channel no one reads and gets no signal at all.
  # 3. The instant DELIBERATELY UNDER-REPORTS on a reaped session. The reaper
  #    ends an idle session with an updateMany and Prisma's @updatedAt moves to
  #    the reaping instant, so that heartbeat is overwritten and unrecoverable;
  #    the derivation drops it and falls back to startedAt, and caps everything
  #    at endedAt. An age that looks older than expected is this, and it is the
  #    safe direction — abandoned reads as MORE idle, never less.
  #
  # NOTE (3) is read from `src/lib/sessionActivityAt.ts` and the server
  # engineer's own comment on #487, NOT from the SDL description of
  # `lastActiveAt`, which omits both guards and closes with a clause that is
  # wrong on exactly the reaped case ("agrees with the idle window the reaper
  # acts on"). hadron-docs found that first (@Tove, team chat seq 273) and it is
  # hadron-server's to fix; the snapshot in schema/ carries the stale text
  # because it is generated. Do not write help text from it.
  #
  # `hasLiveSession` IS ALSO THE VISIBILITY SIGNAL for every working-state field
  # on this type, which is what makes (2) renderable at all. Its resolver masks
  # to null on deny and otherwise coalesces to `false` — a worker with no
  # sessions answers false, never null — so the ONLY null path is the read gate,
  # and it is the same `maySeeWorkerInternals(appId)` predicate that masks
  # heldByUserId/heldAt/memoryId/promptOverride, memoized per request per App.
  # Therefore, on a row where `hasLiveSession != null`, every other null here is
  # a genuine absence rather than a mask. Verified against
  # resolvers.worker.ts on hadron-server main @ e5c6ff2, and NOT yet stated as a
  # contract anywhere — asked of hadron-server rather than assumed permanent.
  hasLiveSession
  lastActiveAt
  retiredAt
  retiredBy
  createdAt
  createdBy
}

# Casting is ONE platform call (cor:agt:020:01/:02): the server resolves the
# agent (agentRef, or role → the single installed agent whose personaRole
# matches — WORKER_AGENT_NOT_FOUND / _AMBIGUOUS, never a guess), takes the
# name, composes Worker.prompt, and provisions the worker-scoped memory. The
# CLI passes values through and retries nothing.
#
# The NAME IS REQUIRED (hadron-server#1050): there is no register to walk, and
# a name is permanent within the App (cor:agt:020:02), so it is chosen and
# never derived — the server will not invent a permanent identifier nobody
# picked. A cast without one refuses WORKER_NAME_REQUIRED.
#
# teamAgentRef is gone from both operations too: casting no longer reads any
# system memory, so it had become accepted-and-ignored.
mutation CastWorker(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $agentRef: ID
  # @genqlient(omitempty: true)
  $role: String
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $promptOverride: String
) {
  castWorker(
    appRef: $appRef
    agentRef: $agentRef
    role: $role
    name: $name
    promptOverride: $promptOverride
  ) {
    ...WorkerFields
  }
}

# Release the HOLD on a name (hadron-server#1050, cor:agt:020:09) — the ONLY
# thing that frees one. Two principals, and the SERVER gates both: the HOLDER
# releasing their own, owing nobody notice; or an App/org ADMIN force-releasing
# somebody else's, which POSTS TO THE TEAM CHAT, because the incident this
# model answers is one where notice was owed and there was no way to give it.
#
# The CLI does not reimplement that gate — a client-side authority check would
# be a second, drifting copy of an access rule. It reads the hold only to say
# WHICH act the caller is about to perform.
#
# Idempotent: releasing an unheld worker returns it unchanged. The CLI reports
# that as "no hold was visible to you" rather than "not held" — heldByUserId is
# masked to null on DENY, so a nil hold READ ON ITS OWN does not distinguish an
# unheld name from one the caller may not see, and claiming the name is free is
# what sends a reader into WORKER_HELD at the next session start.
#
# That hedge is now a CHOICE, not a limit, and the distinction matters to
# whoever edits this next. Since #487 this operation selects hasLiveSession
# (via WorkerFields), which IS a sound visibility signal — sound for the exact
# reason #504's retracted probe was not, since that one read fields that are
# legitimately nullable while this one is never legitimately null on a
# permitted read. Release still does not consult it: a rendered cell and a
# refusal-shaped classification are different risks, and #504 retracted two
# designs in this spot. Adopting it is hadron-cli#522.
# The PRECONDITION (hadron-server#1084, hadron-cli#522) replaces the re-read
# this command used to do. State the hold you classified against and the server
# refuses WORKER_HOLD_STALE if it is not that — enforced BY THE GUARDED WRITE,
# which takes the asserted value, so there is no check-then-write window left
# for a client to narrow. The re-read only ever shrank the race to one round
# trip; this closes it.
#
# Exactly one of the two is ever sent. Both together is BAD_USER_INPUT, and
# neither is the old unconditional behaviour — which is why both carry
# omitempty: a nil that went as an explicit `null` would be PRESENT, and
# `expectUnheld: null` is a different request from omitting it. That is
# findings:optional-arg-meets-presence-semantics, and the server engineer chose
# two arguments over one nullable id precisely because presence semantics are a
# live hazard in this codebase.
mutation ReleaseWorker(
  $workerRef: ID!
  # @genqlient(omitempty: true)
  $expectedHolderUserId: ID
  # @genqlient(omitempty: true)
  $expectUnheld: Boolean
) {
  releaseWorker(
    workerRef: $workerRef
    expectedHolderUserId: $expectedHolderUserId
    expectUnheld: $expectUnheld
  ) {
    ...WorkerFields
  }
}

# Idempotent; the name stays reserved forever (cor:agt:020:02 — PR trailers
# and chat archives reference it). The retired worker stops authoring and
# takes no new sessions.
mutation RetireWorker($workerRef: ID!) {
  retireWorker(workerRef: $workerRef) {
    ...WorkerFields
  }
}

# The one removal escape (cor:dmo:050:11): hard-delete a NEVER-USED miscast.
# Refused WORKER_IN_USE when any session was ever bound or the working memory
# holds content — anything with history retires instead.
mutation DeleteWorker($workerRef: ID!) {
  deleteWorker(workerRef: $workerRef)
}

# One worker by ref — its id, or its URN (#991); both resolve here, which is
# what lets a caller address a worker without holding its id.
query GetWorker($ref: ID!) {
  worker(ref: $ref) {
    ...WorkerFields
  }
}

# The ROSTER projection (#459): WorkerFields minus `prompt`.
#
# `prompt` is the resolved boot briefing — multi-KB per worker. It is a detail
# of ONE worker, not something you scan a roster for, and the primary consumer
# of `worker list --json` is an agent piping the output into context. Seven
# workers meant seven briefings to answer "who is on staff".
#
# This mirrors TeamSessionFields, which already refuses ...WorkerFields for the
# same reason and says so in its own comment. `worker get` remains the prompt
# surface, which is what the shipped task nodes already tell readers.
#
# Deliberately KEEPS promptOverride: it is the short per-worker individuality
# (#1010), not the composed briefing, and dropping it would widen the contract
# break for no stated benefit.
fragment WorkerRosterFields on Worker {
  id
  urn
  # Carried here too, unlike `prompt`: the trim this projection exists for was
  # about a multi-KB briefing per row, and a link is one short string. Keeping
  # it means `--json` answers the same shape on `worker list` as on
  # `worker get` — a key that appears on one surface and not the other for the
  # same entity is the kind of thing an agent has to special-case.
  portalUrl
  slug
  appId
  agentId
  name
  role
  promptOverride
  # Carried on the roster too, so the mismatch warning can name the worker the
  # caller probably meant without a third query. Same [] semantics as above.
  repos
  memoryId
  # hadron-cli#487 — the roster is the surface that answers "who is on this
  # team and is anyone actually driving them", so these four belong here and
  # not only on the single read. An earlier revision of the WorkerFields
  # comment said the opposite ("NOT added to WorkerRosterFields ... a column
  # added in passing would pre-empt #487's design question"); that caveat was a
  # promise to come back and delete it when #487 landed, and this is that.
  #
  # All four carry the semantics documented on WorkerFields — in particular
  # `hasLiveSession` is the visibility signal that makes a null in the other
  # three a genuine absence rather than a mask. Do not read one without it.
  heldByUserId
  heldAt
  hasLiveSession
  lastActiveAt
  retiredAt
  retiredBy
  createdAt
  createdBy
}

# The roster read used by `worker list`. Same arguments and paging as Workers;
# only the projection differs. Workers itself stays prompt-bearing because
# resolveWorker rides it — `session start`'s boot briefing, `worker get <name>`,
# retire and rm all resolve through that scan and legitimately need the prompt.
query WorkersRoster(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $includeRetired: Boolean
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  workers(appRef: $appRef, includeRetired: $includeRetired, limit: $limit, offset: $offset) {
    total
    items {
      ...WorkerRosterFields
    }
  }
}

# The STAFF read (cor:agt:020:01 — Workers are the staff; the AppAgent join is
# the install roster, `app agent list`). Retired castings are hidden unless
# includeRetired.
query Workers(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $includeRetired: Boolean
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  workers(appRef: $appRef, includeRetired: $includeRetired, limit: $limit, offset: $offset) {
    total
    items {
      ...WorkerFields
    }
  }
}

# `hadron team chat` (#369 slice 2) — the team group chat as a PLATFORM
# operation (hadron-server#939/#941, Worker envelope since #974, spec
# cor:agt:020:04): the server owns placement (chats:team in the Team Agent's
# shared app memory, bootstrapped on first post), atomic seq allocation,
# author derivation (sessionRef → the session's bound worker), and write-time
# mention extraction. The CLI composes no node and parses no mentions.

fragment TeamChatMessageFields on TeamChatMessage {
  nodeId
  seq
  body
  at
  authorUserId
  authorWorkerId
  authorName
  sessionId
  replyToSeq
  mentions
}

mutation CreateTeamChatMessage(
  $appRef: ID!
  $body: String!
  # @genqlient(omitempty: true)
  $replyToSeq: Int
  # @genqlient(omitempty: true)
  $sessionRef: ID
) {
  createTeamChatMessage(appRef: $appRef, body: $body, replyToSeq: $replyToSeq, sessionRef: $sessionRef) {
    ...TeamChatMessageFields
  }
}

query TeamChatMessages(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $sinceSeq: Int
  # @genqlient(omitempty: true)
  $mentionsRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  teamChatMessages(appRef: $appRef, sinceSeq: $sinceSeq, mentionsRef: $mentionsRef, limit: $limit, offset: $offset) {
    total
    items {
      ...TeamChatMessageFields
    }
  }
}

# The binding records the team MEMORY (`session start -m`), while the chat
# operations address the APP — this resolves one to the other (the team
# memory is the App's shared app-class memory, so its appId IS the team App).
query TeamMemoryApp($ref: ID!) {
  memory(ref: $ref) {
    id
    appId
  }
}

# #458: the READABLE identity of a team App. The ambient App resolution hands
# back whatever ref answered — often the binding's raw AppID — so a human read
# that names its App has only a UUID to print. Deliberately three scalars: this
# runs to decorate a render, never to gate one, so the call site treats a
# failure as "no readable name" and falls back to the raw ref.
query TeamAppIdentity($appRef: ID!) {
  app(ref: $appRef) {
    id
    urn
    name
  }
}

fragment TeamSessionFields on Session {
  id
  agentId
  workerId
  # The nested Worker (#980 / hadron-cli#432): the session-list name join
  # without a per-row worker(ref:) round trip — resolves for retired workers
  # too, and never widens what the session read admits. Deliberately NOT
  # ...WorkerFields: that would drag each worker's full resolved prompt into
  # every session row.
  worker {
    id
    name
    role
  }
  userId
  type
  repo
  branch
  prNumber
  startedAt
  endedAt
  host
  tool
  transcriptPath
  llmModel
}

# All SessionInput fields except id are optional; omitempty keeps an unset
# flag off the wire entirely (the create treats null and omitted alike, but
# the omitted form is the repo-wide convention — see CLAUDE.md).
# @genqlient(for: "SessionInput.agentRef", omitempty: true)
# appRef (#943) arrived with a schema refresh, and a refreshed input field does
# NOT inherit the surrounding omitempty — without this line every session start
# would newly put `"appRef": null` on the wire.
# @genqlient(for: "SessionInput.appRef", omitempty: true)
# @genqlient(for: "SessionInput.branch", omitempty: true)
# @genqlient(for: "SessionInput.customerId", omitempty: true)
# @genqlient(for: "SessionInput.host", omitempty: true)
# @genqlient(for: "SessionInput.language", omitempty: true)
# @genqlient(for: "SessionInput.llmModel", omitempty: true)
# @genqlient(for: "SessionInput.parentSessionId", omitempty: true)
# @genqlient(for: "SessionInput.prNumber", omitempty: true)
# @genqlient(for: "SessionInput.prevSessionId", omitempty: true)
# @genqlient(for: "SessionInput.repo", omitempty: true)
# @genqlient(for: "SessionInput.tool", omitempty: true)
# @genqlient(for: "SessionInput.transcriptPath", omitempty: true)
# @genqlient(for: "SessionInput.type", omitempty: true)
# workerRef (#974 / cor:agt:020:03) binds the session to the Worker by ID —
# Session.agentId is stamped server-side from the casting, so the CLI no
# longer resolves an agent. Same refresh rule as appRef above.
# @genqlient(for: "SessionInput.workerRef", omitempty: true)
# force (#940 / hadron-cli#432) is the informed-takeover override: a worker
# with an ACTIVE session refuses WORKER_TAKEN atomically unless force rides
# along. Sent only on --force, so the override stays explicit.
# @genqlient(for: "SessionInput.force", omitempty: true)
# plan (#934) arrived in the same refresh; the CLI does not drive it yet, but
# the refreshed field still needs its omitempty line (the #139 trap).
# @genqlient(for: "SessionInput.plan", omitempty: true)
mutation StartTeamSession(
  $input: SessionInput!
) {
  startSession(input: $input) {
    ...TeamSessionFields
  }
}

# #931/#932: set a live session's mutable provenance fields mid-session.
# `session log --pr` denormalizes the PR number here; any authorized update
# also bumps updatedAt, one of the three inputs the server derives liveness
# from (hadron-server#1114 retired the inactivity reaper; liveness is computed
# at read time now, and nothing ends a developer session but an explicit end).
mutation UpdateTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $prNumber: Int
  # @genqlient(omitempty: true)
  $branch: String
) {
  updateSession(id: $id, prNumber: $prNumber, branch: $branch) {
    ...TeamSessionFields
  }
}

# `handoff` is the #1029 CONTINUITY RECORD, and the reason this mutation is not
# just a state flip: agent-composed prose about what landed, what is open, what
# is blocked, and what the next driver should not repeat. The server owns where
# it goes (the worker's working memory, under `handoffs`, at a lexically-ordered
# loc), so the CLI composes no node and derives no convention.
#
# It is written BEFORE the session ends, and a failed write REFUSES the end
# (HANDOFF_WRITE_FAILED) rather than ending anyway — a still-bound worker is
# recoverable, an ended session whose handoff evaporated is not, because the
# context that composed it is gone. Passing it on a session with no worker is
# refused rather than dropped: there is no sequence to write it to.
#
# `summary` is a DIFFERENT field and the next driver never sees it (#1029 — it
# is the write-only field that feature was filed to fix). Both are kept because
# collapsing them is a decision about #1029's shape, not about this operation.
mutation EndTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $summary: String
  # @genqlient(omitempty: true)
  $handoff: String
) {
  endSession(id: $id, summary: $summary, handoff: $handoff) {
    ...TeamSessionFields
  }
}

# One session by id — the provenance query resolves worklog sessionIds
# through this (sessions have no URN; id-only is the cor:api:140 genuine-PK
# case). Null when not found or not visible.
query GetTeamSession($id: ID!) {
  session(id: $id) {
    ...TeamSessionFields
  }
}

# workerRef (#974) is the server-side narrowing the taken/last-driven-by check
# reads: only sessions bound to that Worker (by id), newest first — so the
# presence check no longer scans the whole list. The plain listing still pages
# to exhaustion for --active (no active filter server-side).
query TeamSessions(
  # @genqlient(omitempty: true)
  $repo: String
  # @genqlient(omitempty: true)
  $workerRef: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  sessions(repo: $repo, workerRef: $workerRef, limit: $limit, offset: $offset) {
    ...TeamSessionFields
  }
}

# ── Worklog (#947) — the dedicated operations. The CLI previously composed
# worklog records itself and wrote them through the generic object surface,
# which put the record shape in two places; the server owns it (hadron-cli#396).
# Since #974 the record attributes through the Worker: workerName is the
# denormalized display name (pre-#974 rows surface their stored personaName
# here), workerId the casting behind it when the session was worker-bound.
fragment TeamWorkItemFields on TeamWorkItem {
  nodeId
  sessionId
  workerId
  workerName
  tool
  kind
  ref
  action
  at
  detail
}

mutation RecordTeamWork(
  $appRef: ID!
  $sessionRef: ID!
  $tool: String!
  $kind: String!
  $ref: String!
  $action: String!
  # @genqlient(omitempty: true)
  $detail: JSON
) {
  recordTeamWork(
    appRef: $appRef
    sessionRef: $sessionRef
    tool: $tool
    kind: $kind
    ref: $ref
    action: $action
    detail: $detail
  ) {
    ...TeamWorkItemFields
  }
}

query TeamWorkItems(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $sessionRef: ID
  # @genqlient(omitempty: true)
  $ref: String
  # @genqlient(omitempty: true)
  $kind: String
  # @genqlient(omitempty: true)
  $tool: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  teamWorkItems(
    appRef: $appRef
    sessionRef: $sessionRef
    ref: $ref
    kind: $kind
    tool: $tool
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      ...TeamWorkItemFields
    }
  }
}

# hadron-cli#401: the worklog collection SCHEMA is the server's (it declares it
# when provisioning, and converges a drifted declaration here) — the CLI used to
# ship its own copy as a Go constant, which had already drifted from the server's
# `kind` enum.
mutation UpdateTeamCollections($appRef: ID!) {
  updateTeamCollections(appRef: $appRef) {
    memoryId
    collections
    changed
  }
}

# ── Role definitions (#403 / hadron-server#960) — the pre-cast read.
#
# The register projection this fragment was built around (register / freeCount
# / exhausted / nameRange / nameConvention) is GONE — hadron-server#1050
# removed the worker name register outright, and cor:agt:020:07 is withdrawn
# rather than superseded. What remains is the role's identity, its description,
# and the agent a role-mode cast would resolve.
fragment TeamRoleFields on TeamRole {
  role
  loc
  nodeId
  description
  # The single installed agent a role-mode cast would use (null when zero or
  # ambiguous; masks to null on read-deny — the #552 posture). Under the
  # Worker model the prompt TEMPLATE lives here, not on the role node.
  roleAgent {
    id
    urn
    name
    personaRole
  }
  hasNamePlaceholder
}

query TeamRoles(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $teamAgentRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  teamRoles(appRef: $appRef, teamAgentRef: $teamAgentRef, limit: $limit, offset: $offset) {
    total
    items {
      ...TeamRoleFields
    }
  }
}

# ── Cast preview (#404 / hadron-server#964) — dry-run the irreversible cast.
# A QUERY, deliberately: previewing must not need mutation permissions or a
# fake Worker row. It runs the cast's exact resolution — same arguments, same
# typed refusals, same mint gate — up to but not including the writes. THE
# PREVIEW RESERVES NOTHING (no lease by law, cor:agt:020:03): a previewed
# name may be gone at cast time; the cast's uniqueness constraint stays the
# only allocation primitive.
query CastWorkerPreview(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $agentRef: ID
  # @genqlient(omitempty: true)
  $role: String
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $promptOverride: String
) {
  castWorkerPreview(
    appRef: $appRef
    agentRef: $agentRef
    role: $role
    name: $name
    promptOverride: $promptOverride
  ) {
    name
    role
    agentId
    agentName
    prompt
    hasNamePlaceholder
  }
}

# ── Role writes. Once the register went (hadron-server#1050), a role
# definition carries a role, a description, and nothing else that a client can
# set — so create and update are the same two fields, and the CAS, the
# range/convention keys and the whole `names` sugar went with the register.
mutation CreateTeamRole(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $teamAgentRef: ID
  $role: String!
  # @genqlient(omitempty: true)
  $description: String
) {
  createTeamRole(
    appRef: $appRef
    teamAgentRef: $teamAgentRef
    role: $role
    description: $description
  ) {
    ...TeamRoleFields
  }
}

# `role update` now sets exactly one field. description keeps its omitempty
# (omitted is "preserve" on this server, CLAUDE.md), so an update that names
# nothing is a no-op rather than a clear.
mutation UpdateTeamRoleMeta(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $teamAgentRef: ID
  $role: String!
  # @genqlient(omitempty: true)
  $description: String
) {
  updateTeamRole(
    appRef: $appRef
    teamAgentRef: $teamAgentRef
    role: $role
    description: $description
  ) {
    ...TeamRoleFields
  }
}

# The retirement (`role rm`, #441 / hadron-server#1002). Now UNCONDITIONAL:
# the minted-name gate and the register hand-off (transferTo) both went with
# the register itself (hadron-server#1050), so there is no state a successor
# could inherit and nothing for a bare delete to refuse over.
mutation DeleteTeamRole(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $teamAgentRef: ID
  $role: String!
) {
  deleteTeamRole(appRef: $appRef, teamAgentRef: $teamAgentRef, role: $role) {
    role
    nodesDeleted
  }
}
