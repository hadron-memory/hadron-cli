# `hadron team` — workers and sessions (Worker model, #428 / hadron-server#974).
#
# A persona is pure DRESSING on an Agent (personaRole + a {{name}}-templated
# personaPrompt — metadata, edited via `agent update`). The named identity
# ("Iris") is the WORKER: the casting of an installed Agent into an App
# (cor:dmo:050:11, cor:agt:020:01). Workers have no URN — names never enter
# URNs (cor:agt:020:02) — so every workerRef on this surface is the worker's id.

fragment WorkerFields on Worker {
  id
  appId
  agentId
  name
  role
  # The resolved boot briefing: the agent's personaPrompt template with
  # {{name}}/{{role}} bound, then promptOverride appended. Printed on cast and
  # surfaced by `worker get` — it is what a session driver adopts.
  prompt
  promptOverride
  memoryId
  retiredAt
  retiredBy
  createdAt
  createdBy
}

# Casting is ONE platform call (cor:agt:020:01/:02): the server resolves the
# agent (agentRef, or role → the single installed agent whose personaRole
# matches — WORKER_AGENT_NOT_FOUND / _AMBIGUOUS, never a guess), allocates the
# name (explicit name: one attempt, WORKER_NAME_TAKEN is the answer; otherwise
# the Team Agent's cast-list register is walked server-side past taken names —
# WORKER_REGISTER_EXHAUSTED when none is free), composes Worker.prompt, and
# provisions the worker-scoped memory. The CLI passes values through and
# retries nothing — the retry loops the persona model needed are gone.
mutation CastWorker(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $agentRef: ID
  # @genqlient(omitempty: true)
  $role: String
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $teamAgentRef: ID
  # @genqlient(omitempty: true)
  $promptOverride: String
) {
  castWorker(
    appRef: $appRef
    agentRef: $agentRef
    role: $role
    name: $name
    teamAgentRef: $teamAgentRef
    promptOverride: $promptOverride
  ) {
    ...WorkerFields
  }
}

# Idempotent; the name stays reserved forever (cor:agt:020:02 — PR trailers
# and chat archives reference it). The retired worker stops authoring and
# takes no new sessions.
mutation RetireWorker($workerRef: ID!) {
  retireWorker(workerRef: $workerRef) {
    ...WorkerFields
  }
}

# The one removal escape (cor:dmo:050:11): hard-delete a NEVER-USED miscast.
# Refused WORKER_IN_USE when any session was ever bound or the working memory
# holds content — anything with history retires instead.
mutation DeleteWorker($workerRef: ID!) {
  deleteWorker(workerRef: $workerRef)
}

# One worker by id (workers have no URN, so ref is the PK only).
query GetWorker($ref: ID!) {
  worker(ref: $ref) {
    ...WorkerFields
  }
}

# The STAFF read (cor:agt:020:01 — Workers are the staff; the AppAgent join is
# the install roster, `app agent list`). Retired castings are hidden unless
# includeRetired.
query Workers(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $includeRetired: Boolean
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  workers(appRef: $appRef, includeRetired: $includeRetired, limit: $limit, offset: $offset) {
    total
    items {
      ...WorkerFields
    }
  }
}

# `hadron team chat` (#369 slice 2) — the team group chat as a PLATFORM
# operation (hadron-server#939/#941, Worker envelope since #974, spec
# cor:agt:020:04): the server owns placement (chats:team in the Team Agent's
# shared app memory, bootstrapped on first post), atomic seq allocation,
# author derivation (sessionRef → the session's bound worker), and write-time
# mention extraction. The CLI composes no node and parses no mentions.

fragment TeamChatMessageFields on TeamChatMessage {
  nodeId
  seq
  body
  at
  authorUserId
  authorWorkerId
  authorName
  sessionId
  replyToSeq
  mentions
}

mutation CreateTeamChatMessage(
  $appRef: ID!
  $body: String!
  # @genqlient(omitempty: true)
  $replyToSeq: Int
  # @genqlient(omitempty: true)
  $sessionRef: ID
) {
  createTeamChatMessage(appRef: $appRef, body: $body, replyToSeq: $replyToSeq, sessionRef: $sessionRef) {
    ...TeamChatMessageFields
  }
}

query TeamChatMessages(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $sinceSeq: Int
  # @genqlient(omitempty: true)
  $mentionsRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  teamChatMessages(appRef: $appRef, sinceSeq: $sinceSeq, mentionsRef: $mentionsRef, limit: $limit, offset: $offset) {
    total
    items {
      ...TeamChatMessageFields
    }
  }
}

# The binding records the team MEMORY (`session start -m`), while the chat
# operations address the APP — this resolves one to the other (the team
# memory is the App's shared app-class memory, so its appId IS the team App).
query TeamMemoryApp($ref: ID!) {
  memory(ref: $ref) {
    id
    appId
  }
}

fragment TeamSessionFields on Session {
  id
  agentId
  workerId
  userId
  type
  repo
  branch
  prNumber
  startedAt
  endedAt
  host
  tool
  transcriptPath
  llmModel
}

# All SessionInput fields except id are optional; omitempty keeps an unset
# flag off the wire entirely (the create treats null and omitted alike, but
# the omitted form is the repo-wide convention — see CLAUDE.md).
# @genqlient(for: "SessionInput.agentRef", omitempty: true)
# appRef (#943) arrived with a schema refresh, and a refreshed input field does
# NOT inherit the surrounding omitempty — without this line every session start
# would newly put `"appRef": null` on the wire.
# @genqlient(for: "SessionInput.appRef", omitempty: true)
# @genqlient(for: "SessionInput.branch", omitempty: true)
# @genqlient(for: "SessionInput.customerId", omitempty: true)
# @genqlient(for: "SessionInput.host", omitempty: true)
# @genqlient(for: "SessionInput.language", omitempty: true)
# @genqlient(for: "SessionInput.llmModel", omitempty: true)
# @genqlient(for: "SessionInput.parentSessionId", omitempty: true)
# @genqlient(for: "SessionInput.prNumber", omitempty: true)
# @genqlient(for: "SessionInput.prevSessionId", omitempty: true)
# @genqlient(for: "SessionInput.repo", omitempty: true)
# @genqlient(for: "SessionInput.tool", omitempty: true)
# @genqlient(for: "SessionInput.transcriptPath", omitempty: true)
# @genqlient(for: "SessionInput.type", omitempty: true)
# workerRef (#974 / cor:agt:020:03) binds the session to the Worker by ID —
# Session.agentId is stamped server-side from the casting, so the CLI no
# longer resolves an agent. Same refresh rule as appRef above.
# @genqlient(for: "SessionInput.workerRef", omitempty: true)
# force (#940) is the informed-takeover override: a worker with an ACTIVE
# session refuses WORKER_TAKEN unless force is true. Sent only on --force.
# @genqlient(for: "SessionInput.force", omitempty: true)
mutation StartTeamSession(
  $input: SessionInput!
) {
  startSession(input: $input) {
    ...TeamSessionFields
  }
}

# #931/#932: set a live session's mutable provenance fields mid-session.
# `session log --pr` denormalizes the PR number here; any authorized update
# also bumps updatedAt, which the #930 inactivity reaper counts as liveness.
mutation UpdateTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $prNumber: Int
  # @genqlient(omitempty: true)
  $branch: String
) {
  updateSession(id: $id, prNumber: $prNumber, branch: $branch) {
    ...TeamSessionFields
  }
}

mutation EndTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $summary: String
) {
  endSession(id: $id, summary: $summary) {
    ...TeamSessionFields
  }
}

# One session by id — the provenance query resolves worklog sessionIds
# through this (sessions have no URN; id-only is the cor:api:140 genuine-PK
# case). Null when not found or not visible.
query GetTeamSession($id: ID!) {
  session(id: $id) {
    ...TeamSessionFields
  }
}

# workerRef (#974) is the server-side narrowing the taken/last-driven-by check
# reads: only sessions bound to that Worker (by id), newest first — so the
# presence check no longer scans the whole list. The plain listing still pages
# to exhaustion for --active (no active filter server-side).
query TeamSessions(
  # @genqlient(omitempty: true)
  $repo: String
  # @genqlient(omitempty: true)
  $workerRef: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  sessions(repo: $repo, workerRef: $workerRef, limit: $limit, offset: $offset) {
    ...TeamSessionFields
  }
}

# ── Worklog (#947) — the dedicated operations. The CLI previously composed
# worklog records itself and wrote them through the generic object surface,
# which put the record shape in two places; the server owns it (hadron-cli#396).
# Since #974 the record attributes through the Worker: workerName is the
# denormalized display name (pre-#974 rows surface their stored personaName
# here), workerId the casting behind it when the session was worker-bound.
fragment TeamWorkItemFields on TeamWorkItem {
  nodeId
  sessionId
  workerId
  workerName
  tool
  kind
  ref
  action
  at
  detail
}

mutation RecordTeamWork(
  $appRef: ID!
  $sessionRef: ID!
  $tool: String!
  $kind: String!
  $ref: String!
  $action: String!
  # @genqlient(omitempty: true)
  $detail: JSON
) {
  recordTeamWork(
    appRef: $appRef
    sessionRef: $sessionRef
    tool: $tool
    kind: $kind
    ref: $ref
    action: $action
    detail: $detail
  ) {
    ...TeamWorkItemFields
  }
}

query TeamWorkItems(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $sessionRef: ID
  # @genqlient(omitempty: true)
  $ref: String
  # @genqlient(omitempty: true)
  $kind: String
  # @genqlient(omitempty: true)
  $tool: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  teamWorkItems(
    appRef: $appRef
    sessionRef: $sessionRef
    ref: $ref
    kind: $kind
    tool: $tool
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      ...TeamWorkItemFields
    }
  }
}

# hadron-cli#401: the worklog collection SCHEMA is the server's (it declares it
# when provisioning, and converges a drifted declaration here) — the CLI used to
# ship its own copy as a Go constant, which had already drifted from the server's
# `kind` enum.
mutation UpdateTeamCollections($appRef: ID!) {
  updateTeamCollections(appRef: $appRef) {
    memoryId
    collections
    changed
  }
}
