# `hadron team` (#369 slice 1) — personas and sessions.
#
# A persona IS an Agent (server #928/#929): personaName/personaRole/
# personaPrompt are pure metadata columns, so persona CRUD rides the
# ordinary agent surface — these operations only widen the selection to
# the persona fields (agent.graphql's AgentFields predates them, and the
# team commands don't need the AI-config fields it carries). Retire is
# the existing DeleteAgent mutation: the persona uniqueness indexes
# deliberately ignore deleted_at, so a soft-deleted agent keeps its name
# bound forever (D-2026-08-11-006).

fragment PersonaAgentFields on Agent {
  id
  urn
  name
  description
  organizationId
  personaName
  personaRole
  personaPrompt
  createdAt
}

query GetPersonaAgent($ref: ID!) {
  agent(ref: $ref) {
    ...PersonaAgentFields
  }
}

# The roster read. AgentFilter has no persona clause, so callers page this
# to exhaustion and keep the personaName != null rows client-side. The
# unfiltered list is the caller's MEMBER-ORG scope only; the caller's own
# user-owned (org-less) agents need a second pass with
# filter.ownedByMe: true (#782) — scanPersonaAgents merges both.
#
# Deliberately NO `for: "AgentFilter.*"` omitempty directives: agent.graphql
# uses the same shared input without them, and genqlient resolves per-field
# omitempty on a shared type non-deterministically when operations disagree
# (the generated tags flip between runs and red the codegen-freshness gate —
# the NodeWhereInput saga, see genqlient.yaml). Null filter fields are fine
# on this read path; the null-clears hazard is mutation-only.
query PersonaAgents(
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $filter: AgentFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  agents(orgId: $orgId, filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...PersonaAgentFields
    }
  }
}

# Persona instantiation is a PLATFORM operation (#935/PR #936, spec
# cor:agt:020:01, the thin-CLI directive): the server locates the Team Agent,
# reads the role node (roles:<role> in its system memory — template in
# content, register in data.names), allocates a free name server-side (the
# loop advances past BOTH uniques a name can collide on), composes the
# prompt, creates AND installs. The CLI passes four values through and
# retries nothing.
mutation CreateTeamPersona(
  $appRef: ID!
  $role: String!
  # @genqlient(omitempty: true)
  $teamAgentRef: ID
  # @genqlient(omitempty: true)
  $name: String
) {
  createTeamPersona(appRef: $appRef, role: $role, teamAgentRef: $teamAgentRef, name: $name) {
    ...PersonaAgentFields
  }
}

# Post-mint persona refinement (#385). `createTeamPersona` composes the prompt
# from the ROLE TEMPLATE, so a fresh persona is generic by construction —
# everything that distinguishes this persona from the next one of the same role
# is written afterwards. A persona IS an Agent, so this rides the ordinary
# `updateAgent` mutation and only widens the selection to the persona columns.
#
# personaName is deliberately NOT wired: cor:agt:020:02 makes a persona name
# permanent (the uniqueness indexes ignore deleted_at precisely so a name is
# never re-minted), and a rename would free the old name for someone else while
# merged PR trailers and chat history still reference it.
#
# omitempty: an unset flag is OMITTED, which the server reads as "preserve" —
# an explicit null would CLEAR the column (CLAUDE.md wire-semantics gotcha), and
# clearing a persona's identity prompt by forgetting a flag is exactly the
# failure this command exists to avoid.
mutation UpdateTeamPersona(
  $ref: ID!
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $personaPrompt: String
) {
  updateAgent(ref: $ref, personaRole: $personaRole, personaPrompt: $personaPrompt) {
    ...PersonaAgentFields
  }
}

# THE roster read (#383). Under cor:agt:020:01 the roster IS the AppAgent
# join, and until now only raw GraphQL exposed it: `persona list` / `agent list`
# narrow the caller's whole readable agent set client-side, so they answer
# "every persona I can read", not "who is on this team" — and `--app` (the
# persistent App-CONTEXT flag) doesn't change that, which made them report
# another App's persona as being on this team.
#
# App.agents is the 023-app-shape convenience over App.appAgents, so this needs
# no paging: an App's installed set is small and bounded, unlike agents().
query TeamRoster($appRef: ID!) {
  app(ref: $appRef) {
    id
    urn
    name
    agents {
      ...PersonaAgentFields
    }
  }
}

# `hadron team chat` (#369 slice 2) — the team group chat as a PLATFORM
# operation (hadron-server#939/#941, spec cor:agt:020:04): the server owns
# placement (chats:team in the Team Agent's shared app memory, bootstrapped
# on first post), atomic seq allocation, author derivation (sessionRef →
# the session's bound persona), and write-time mention extraction. The CLI
# composes no node and parses no mentions.

fragment TeamChatMessageFields on TeamChatMessage {
  nodeId
  seq
  body
  at
  authorUserId
  authorAgentId
  authorName
  sessionId
  replyToSeq
  mentions
}

mutation CreateTeamChatMessage(
  $appRef: ID!
  $body: String!
  # @genqlient(omitempty: true)
  $replyToSeq: Int
  # @genqlient(omitempty: true)
  $sessionRef: ID
) {
  createTeamChatMessage(appRef: $appRef, body: $body, replyToSeq: $replyToSeq, sessionRef: $sessionRef) {
    ...TeamChatMessageFields
  }
}

query TeamChatMessages(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $sinceSeq: Int
  # @genqlient(omitempty: true)
  $mentionsRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  teamChatMessages(appRef: $appRef, sinceSeq: $sinceSeq, mentionsRef: $mentionsRef, limit: $limit, offset: $offset) {
    total
    items {
      ...TeamChatMessageFields
    }
  }
}

# The binding records the team MEMORY (`session start -m`), while the chat
# operations address the APP — this resolves one to the other (the team
# memory is the App's shared app-class memory, so its appId IS the team App).
query TeamMemoryApp($ref: ID!) {
  memory(ref: $ref) {
    id
    appId
  }
}

fragment TeamSessionFields on Session {
  id
  agentId
  userId
  type
  repo
  branch
  prNumber
  startedAt
  endedAt
  host
  tool
  transcriptPath
  llmModel
}

# All SessionInput fields except id are optional; omitempty keeps an unset
# flag off the wire entirely (the create treats null and omitted alike, but
# the omitted form is the repo-wide convention — see CLAUDE.md).
# @genqlient(for: "SessionInput.agentRef", omitempty: true)
# @genqlient(for: "SessionInput.branch", omitempty: true)
# @genqlient(for: "SessionInput.customerId", omitempty: true)
# @genqlient(for: "SessionInput.host", omitempty: true)
# @genqlient(for: "SessionInput.language", omitempty: true)
# @genqlient(for: "SessionInput.llmModel", omitempty: true)
# @genqlient(for: "SessionInput.parentSessionId", omitempty: true)
# @genqlient(for: "SessionInput.prNumber", omitempty: true)
# @genqlient(for: "SessionInput.prevSessionId", omitempty: true)
# @genqlient(for: "SessionInput.repo", omitempty: true)
# @genqlient(for: "SessionInput.tool", omitempty: true)
# @genqlient(for: "SessionInput.transcriptPath", omitempty: true)
# @genqlient(for: "SessionInput.type", omitempty: true)
mutation StartTeamSession(
  $input: SessionInput!
) {
  startSession(input: $input) {
    ...TeamSessionFields
  }
}

# #931/#932: set a live session's mutable provenance fields mid-session.
# `session log --pr` denormalizes the PR number here; any authorized update
# also bumps updatedAt, which the #930 inactivity reaper counts as liveness.
mutation UpdateTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $prNumber: Int
  # @genqlient(omitempty: true)
  $branch: String
) {
  updateSession(id: $id, prNumber: $prNumber, branch: $branch) {
    ...TeamSessionFields
  }
}

mutation EndTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $summary: String
) {
  endSession(id: $id, summary: $summary) {
    ...TeamSessionFields
  }
}

# One session by id — the provenance query resolves worklog sessionIds
# through this (sessions have no URN; id-only is the cor:api:140 genuine-PK
# case). Null when not found or not visible.
query GetTeamSession($id: ID!) {
  session(id: $id) {
    ...TeamSessionFields
  }
}

# The sessions list has no agent/active filter server-side, so the presence
# and takeover checks page this to exhaustion (ordered startedAt desc) and
# filter client-side.
query TeamSessions(
  # @genqlient(omitempty: true)
  $repo: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  sessions(repo: $repo, limit: $limit, offset: $offset) {
    ...TeamSessionFields
  }
}
