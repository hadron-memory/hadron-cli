# `hadron team` (#369 slice 1) — personas and sessions.
#
# A persona IS an Agent (server #928/#929): personaName/personaRole/
# personaPrompt are pure metadata columns, so persona CRUD rides the
# ordinary agent surface — these operations only widen the selection to
# the persona fields (agent.graphql's AgentFields predates them, and the
# team commands don't need the AI-config fields it carries). Retire is
# the existing DeleteAgent mutation: the persona uniqueness indexes
# deliberately ignore deleted_at, so a soft-deleted agent keeps its name
# bound forever (D-2026-08-11-006).

fragment PersonaAgentFields on Agent {
  id
  urn
  name
  description
  organizationId
  personaName
  personaRole
  personaPrompt
  createdAt
}

query GetPersonaAgent($ref: ID!) {
  agent(ref: $ref) {
    ...PersonaAgentFields
  }
}

# The roster read. AgentFilter has no persona clause, so callers page this
# to exhaustion and keep the personaName != null rows client-side. The
# unfiltered list is the caller's MEMBER-ORG scope only; the caller's own
# user-owned (org-less) agents need a second pass with
# filter.ownedByMe: true (#782) — scanPersonaAgents merges both.
#
# Deliberately NO `for: "AgentFilter.*"` omitempty directives: agent.graphql
# uses the same shared input without them, and genqlient resolves per-field
# omitempty on a shared type non-deterministically when operations disagree
# (the generated tags flip between runs and red the codegen-freshness gate —
# the NodeWhereInput saga, see genqlient.yaml). Null filter fields are fine
# on this read path; the null-clears hazard is mutation-only.
query PersonaAgents(
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $filter: AgentFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  agents(orgId: $orgId, filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...PersonaAgentFields
    }
  }
}

mutation CreatePersonaAgent(
  $name: String!
  $personaName: String!
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $personaPrompt: String
) {
  createAgent(
    name: $name
    orgId: $orgId
    description: $description
    personaName: $personaName
    personaRole: $personaRole
    personaPrompt: $personaPrompt
  ) {
    ...PersonaAgentFields
  }
}

fragment TeamSessionFields on Session {
  id
  agentId
  userId
  type
  repo
  branch
  prNumber
  startedAt
  endedAt
  host
  tool
  transcriptPath
  llmModel
}

# All SessionInput fields except id are optional; omitempty keeps an unset
# flag off the wire entirely (the create treats null and omitted alike, but
# the omitted form is the repo-wide convention — see CLAUDE.md).
# @genqlient(for: "SessionInput.agentRef", omitempty: true)
# @genqlient(for: "SessionInput.branch", omitempty: true)
# @genqlient(for: "SessionInput.customerId", omitempty: true)
# @genqlient(for: "SessionInput.host", omitempty: true)
# @genqlient(for: "SessionInput.language", omitempty: true)
# @genqlient(for: "SessionInput.llmModel", omitempty: true)
# @genqlient(for: "SessionInput.parentSessionId", omitempty: true)
# @genqlient(for: "SessionInput.prNumber", omitempty: true)
# @genqlient(for: "SessionInput.prevSessionId", omitempty: true)
# @genqlient(for: "SessionInput.repo", omitempty: true)
# @genqlient(for: "SessionInput.tool", omitempty: true)
# @genqlient(for: "SessionInput.transcriptPath", omitempty: true)
# @genqlient(for: "SessionInput.type", omitempty: true)
mutation StartTeamSession(
  $input: SessionInput!
) {
  startSession(input: $input) {
    ...TeamSessionFields
  }
}

# #931/#932: set a live session's mutable provenance fields mid-session.
# `session log --pr` denormalizes the PR number here; any authorized update
# also bumps updatedAt, which the #930 inactivity reaper counts as liveness.
mutation UpdateTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $prNumber: Int
  # @genqlient(omitempty: true)
  $branch: String
) {
  updateSession(id: $id, prNumber: $prNumber, branch: $branch) {
    ...TeamSessionFields
  }
}

mutation EndTeamSession(
  $id: ID!
  # @genqlient(omitempty: true)
  $summary: String
) {
  endSession(id: $id, summary: $summary) {
    ...TeamSessionFields
  }
}

# One session by id — the provenance query resolves worklog sessionIds
# through this (sessions have no URN; id-only is the cor:api:140 genuine-PK
# case). Null when not found or not visible.
query GetTeamSession($id: ID!) {
  session(id: $id) {
    ...TeamSessionFields
  }
}

# The sessions list has no agent/active filter server-side, so the presence
# and takeover checks page this to exhaustion (ordered startedAt desc) and
# filter client-side.
query TeamSessions(
  # @genqlient(omitempty: true)
  $repo: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  sessions(repo: $repo, limit: $limit, offset: $offset) {
    ...TeamSessionFields
  }
}
