# Memory access control (#57): members (team rows) and shares (per-user grants).
# Role enums are lower-case (owner/reader/writer; reader/writer). A distinct
# user fragment name avoids colliding with org.graphql's UserFields.

fragment MemUserFields on User {
  id
  name
  email
  handle
}

# memory(ref) — PK id or URN (hadron-server#473) — is the path to a memory's
# member/share rows.
query MemoryMembers($ref: ID!) {
  memory(ref: $ref) {
    id
    members {
      role
      createdAt
      user {
        ...MemUserFields
      }
    }
  }
}

query MemoryShares($ref: ID!) {
  memory(ref: $ref) {
    id
    shares {
      role
      createdAt
      grantee {
        ...MemUserFields
      }
    }
  }
}

# #764/#304: userRef + memoryRef are server-resolved (id / URN / handle / email),
# so the CLI passes the raw --user value straight through — no client-side user
# lookup. memoryRef receives the client-resolved memory id (a valid ref).
mutation AddMemoryMember($memoryRef: ID!, $userRef: ID!, $role: MemoryMemberRole!) {
  addMemoryMember(memoryRef: $memoryRef, userRef: $userRef, role: $role) {
    memoryMember {
      role
      user {
        ...MemUserFields
      }
    }
  }
}

mutation UpdateMemoryMemberRole($memoryRef: ID!, $userRef: ID!, $role: MemoryMemberRole!) {
  updateMemoryMemberRole(memoryRef: $memoryRef, userRef: $userRef, role: $role) {
    memoryMember {
      role
      user {
        ...MemUserFields
      }
    }
  }
}

mutation RemoveMemoryMember($memoryRef: ID!, $userRef: ID!) {
  removeMemoryMember(memoryRef: $memoryRef, userRef: $userRef) {
    memoryId
    userId
  }
}

# #769/#304: granteeRef is server-resolved (id / email / handle / hrn:user URN),
# but the share commands resolve --grantee client-side first
# (cmdutil.ResolveUserID) and send the user id. #4137: memoryRef (an id or URN) replaced memoryId,
# and the server declares the ref arguments ID!, so the variables are ID! too.
mutation CreateMemoryShare($memoryRef: ID!, $granteeRef: ID!, $role: MemoryShareRole!) {
  createMemoryShare(memoryRef: $memoryRef, granteeRef: $granteeRef, role: $role) {
    memoryShare {
      role
      grantee {
        ...MemUserFields
      }
    }
  }
}

mutation UpdateMemoryShareRole($memoryRef: ID!, $granteeRef: ID!, $role: MemoryShareRole!) {
  updateMemoryShareRole(memoryRef: $memoryRef, granteeRef: $granteeRef, role: $role) {
    memoryShare {
      role
      grantee {
        ...MemUserFields
      }
    }
  }
}

# hadron-server#785: renamed from revokeMemoryShare, and the authority widened
# from principal-only to principal-OR-self. `granteeRef` is optional now — omit
# it and the server deletes the CALLER'S own share (leave / stop-sharing-with-me).
# The contract is OMITTED, not null, so the variable carries omitempty: a nil
# *string must drop the key rather than serialize "granteeRef": null.
# memoryRef takes an id or a URN and is passed through WITHOUT a client-side
# memory(ref:) lookup — that lookup can't see a soft-deleted memory, and leaving
# one is exactly a case this mutation supports.
# #304: granteeRef is server-resolved (id / email / handle / hrn:user URN);
# share rm resolves --grantee client-side first and sends the user id. Omitted
# entirely, it targets the caller's own share (self-removal / leave).
mutation DeleteMemoryShare($memoryRef: ID!,
  # @genqlient(omitempty: true)
  $granteeRef: String) {
  deleteMemoryShare(memoryRef: $memoryRef, granteeRef: $granteeRef) {
    granteeId
    memoryId
  }
}

# Subscriptions (#57): grant an ORGANIZATION a role on a memory (memoryId +
# orgId + Role). Unlike members/shares these are org-scoped and return the
# MemorySubscription unwrapped; the role is the general Role enum (ADMIN/
# CONTRIBUTOR/OWNER/READER).

query MemorySubscriptions($ref: ID!) {
  memory(ref: $ref) {
    id
    subscriptions {
      role
      activated
      organization {
        id
        name
        urn
      }
    }
  }
}

# #764/#304: orgRef is server-resolved (id / slug / hrn:org URN); the CLI passes
# the raw --org value. memoryRef receives the client-resolved memory id.
mutation CreateMemorySubscription($memoryRef: ID!, $orgRef: ID!, $role: Role!) {
  createMemorySubscription(memoryRef: $memoryRef, orgRef: $orgRef, role: $role) {
    role
    activated
    organization {
      id
      name
      urn
    }
  }
}

mutation UpdateMemorySubscription($memoryRef: ID!, $orgRef: ID!, $role: Role!) {
  updateMemorySubscription(memoryRef: $memoryRef, orgRef: $orgRef, role: $role) {
    role
    activated
    organization {
      id
      name
      urn
    }
  }
}

mutation DeleteMemorySubscription($memoryRef: ID!, $orgRef: ID!) {
  deleteMemorySubscription(memoryRef: $memoryRef, orgRef: $orgRef)
}
