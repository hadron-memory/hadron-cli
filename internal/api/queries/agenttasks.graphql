# `hadron team task|roster|events|alarm|availability` — the Task Management
# epic's CLI slice T4 (hadron-cli#830, server #1705/#1706/#1707). Every
# operation below is a THIN caller over a server-owned gate; the CLI composes
# no task state and derives nothing the server doesn't hand back.
#
# Attribution: the write mutations carry no sessionRef argument — the server
# takes the actor from the X-Hadron-Session header (api.WithSession), which
# the authored-write middleware adds for exactly the root fields listed in
# authoredWriteField (internal/cmd/team/write_attribution.go). A person with
# no worktree binding writes as themselves over plain GraphQL.

# One sanitized task party (never a User object). name is the Worker's name
# or the person's handle; urn is set for workers only.
fragment AgentTaskPartyFields on AgentTaskParty {
  id
  kind
  name
  urn
}

fragment AgentTaskDependencyFields on AgentTask {
  id
  handle
  title
  status
}

fragment AgentTaskFields on AgentTask {
  priority
  blocked
  blockedBy(limit: 20, offset: 0) { total hasMore items { ...AgentTaskDependencyFields } }
  blocks(limit: 20, offset: 0) { total hasMore items { ...AgentTaskDependencyFields } }
  id
  handle
  taskNumber
  appId
  title
  description
  status
  queued
  waitingOnChildren
  owner {
    ...AgentTaskPartyFields
  }
  assignee {
    ...AgentTaskPartyFields
  }
  assignedBy {
    ...AgentTaskPartyFields
  }
  createdBy {
    ...AgentTaskPartyFields
  }
  parentTaskId
  tags
  source
  # cli#1524 C1 (hadron-server#3125 S2, cor:agt:120:02): the outside item the task claims.
  externalId
  references { kind target label }
  handBack { code text handedBackAt }
  matchFailure { reason failedAt }
  startBy
  finishBy
  createdAt
  updatedAt
  startedAt
  finishedAt
  cancelledAt
  closeSessionWhenDone
  requirements {
    minTier
    role
    roles
    teamWorkerId
    familyIn
    familyNotIn
    modelGroupIn
    modelGroupNotIn
    excludeWorkerIds
  }
  result {
    outcome
    summary
    evidence
  }
  # #2420: the task's OWN optional JSON object (never inherited, so a child
  # returns its own value, null when unset).
  properties
}

# createAgentTask takes one input object; appRef is required for a root task
# and inherited from the parent for a child. Optional party/requirements
# inputs are omitempty so a nil pointer is OMITTED (preserve/default), never
# sent as null — the wire-semantics rule from CLAUDE.md.
# `project` is omitted unless --project is given: the server reads an absent
# project as the reserved no-project AT0 (cor:agt:050:01), so a nil pointer
# must not be sent as null. Per-field omitempty on this one input field.
# Schema-only optional fields must stay absent for older providers.
# @genqlient(for: "CreateAgentTaskInput.project", omitempty: true)
# cli#1514: finishBy omitted unless --finish-by is given; never send null by default.
# @genqlient(for: "CreateAgentTaskInput.finishBy", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.priority", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.blockedBy", omitempty: true)
# #2420: the task's own properties object. A pointer field, omitted when nil.
# @genqlient(for: "CreateAgentTaskInput.properties", omitempty: true)
# cli#1524 C1 (hadron-server#3125 S2, cor:agt:120:02): the claimed outside item.
# Absent unless --external-id is given, so an ordinary create is unchanged and
# an older server never sees the field.
# @genqlient(for: "CreateAgentTaskInput.externalId", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.minTier", omitempty: true)
# cli#1568 (Andi LOCAL P2): match, roles and team arrived with the d7ae518d schema
# refresh (server#2829/#2830, tracked by #1549). Absent, not null, until a flag names
# them: a provider that predates the fields rejects them, even as null.
# @genqlient(for: "CreateAgentTaskInput.match", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.roles", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.team", omitempty: true)
# cli#1485 S3 (Andi BLIND P2): the model-group requirement fields arrived with
# the schema refresh (server #3029) and S2 exposes them as optional flags. Absent,
# not null, so ordinary create/update bodies are unchanged and an older server
# never sees an input field it does not know. This protects INPUTS only:
# every AgentTaskFields document needs provider #3029 for its output selection.
# @genqlient(for: "AgentTaskReferenceInput.label", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.modelGroupIn", omitempty: true)
# @genqlient(for: "AgentTaskRequirementsInput.modelGroupNotIn", omitempty: true)
# Keep legacy role:null for ordinary requirements, but omit role entirely
# when a role set is supplied: the two selector keys never coexist.
# @genqlient(for: "AgentTaskRequirementsInput.role", omitempty: true, bind: "encoding/json.RawMessage")
# cli#1848 (hadron-server#3816, V21-V23): matchSkipped is selected on the
# create answer ONLY. It is returned, never stored: the server answers it on a
# createAgentTask(match: true) that failed, and null everywhere else, so no
# read document selects it. Needs provider be731afd (0.0.1879) or later.
mutation AgentTaskCreate(
  $input: CreateAgentTaskInput!
) {
  createAgentTask(input: $input) {
    ...AgentTaskFields
    matchSkipped { workerId name reasons }
  }
}

# assign/reassign take closeSessionWhenDone as an OPTIONAL argument that
# replaces the task's value only when given — omitempty is load-bearing.
mutation AgentTaskAssign(
  $taskId: ID!
  $assignee: AgentTaskPartyInput!
  # @genqlient(omitempty: true)
  $closeSessionWhenDone: Boolean
) {
  assignAgentTask(taskId: $taskId, assignee: $assignee, closeSessionWhenDone: $closeSessionWhenDone) {
    ...AgentTaskFields
  }
}

mutation AgentTaskReassign(
  $taskId: ID!
  $assignee: AgentTaskPartyInput!
  # @genqlient(omitempty: true)
  $closeSessionWhenDone: Boolean
) {
  reassignAgentTask(taskId: $taskId, assignee: $assignee, closeSessionWhenDone: $closeSessionWhenDone) {
    ...AgentTaskFields
  }
}

mutation AgentTaskStart($taskId: ID!) {
  startAgentTask(taskId: $taskId) {
    ...AgentTaskFields
  }
}

mutation AgentTaskProgress($taskId: ID!) {
  recordAgentTaskProgress(taskId: $taskId) {
    ...AgentTaskFields
  }
}

mutation AgentTaskFinish(
  $taskId: ID!
  $result: AgentTaskResultInput!
) {
  finishAgentTask(taskId: $taskId, result: $result) {
    ...AgentTaskFields
  }
}

# @genqlient(for: "AgentTaskHandBackInput.text", omitempty: true)
mutation AgentTaskHandBack(
  $taskRef: ID!
  $reason: AgentTaskHandBackInput!
) {
  handBackAgentTask(taskRef: $taskRef, reason: $reason) {
    ...AgentTaskFields
  }
}

mutation AgentTaskCancel($taskId: ID!) {
  cancelAgentTask(taskId: $taskId) {
    ...AgentTaskFields
  }
}

# #1754 (cor:agt:050:02): a pending task with no assignee is parked — BACKLOG
# takes no assignee, never enters the queue, is never matched or waited on,
# and raises no alarms. Whoever may assign a task may park it
# (cor:agt:050:09). TASK_INVALID_TRANSITION when not pending or assigned.
mutation AgentTaskPark($taskId: ID!) {
  parkAgentTask(taskId: $taskId) {
    ...AgentTaskFields
  }
}

# The way out of BACKLOG: the task becomes PENDING and enters the queue.
# Whoever may assign a task may make it ready. TASK_INVALID_TRANSITION when
# not backlog.
mutation AgentTaskReady($taskId: ID!) {
  makeAgentTaskReady(taskId: $taskId) {
    ...AgentTaskFields
  }
}

# cli#1565: `task get` also reads the clone links (server#2646, cor:agt:050:02):
# clonedFrom and one page of clones (limit/offset). They sit in THIS document,
# not the shared AgentTaskFields projection, so only `get` needs a provider that
# has them.
query AgentTaskGet($id: ID!, $clonesLimit: Int!, $clonesOffset: Int!) {
  agentTask(id: $id) {
    ...AgentTaskFields
    clonedFrom { ...AgentTaskDependencyFields }
    clones(limit: $clonesLimit, offset: $clonesOffset) { total hasMore items { ...AgentTaskDependencyFields } }
  }
}

# cli#1565 (server#2646, cor:agt:050:02): make a new task from an existing one.
# Every override is optional and omitted unless a flag names it: an omitted
# field keeps the source's value (or stays unset), so a nil pointer must not
# be sent as null. parentTaskId is three-state — omitted keeps the source's
# parent, a task id names another, an explicit null means none — so it is a
# RawMessage (nil omitted, `null` sent as null, a JSON string for an id).
# cli#1579: tags, references, properties and requirements are RawMessage too:
# a clear is an explicit empty list ([]) or null, which a typed omitempty field
# would drop; nil still omits the key.
# @genqlient(for: "CloneAgentTaskInput.assignee", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.closeSessionWhenDone", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.description", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.finishBy", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.owner", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.parentTaskId", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "CloneAgentTaskInput.priority", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.project", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.properties", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "CloneAgentTaskInput.references", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "CloneAgentTaskInput.requirements", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "CloneAgentTaskInput.source", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.startBy", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.status", omitempty: true)
# @genqlient(for: "CloneAgentTaskInput.tags", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "CloneAgentTaskInput.title", omitempty: true)
mutation AgentTaskClone(
  $taskId: ID!
  $input: CloneAgentTaskInput!
) {
  cloneAgentTask(taskId: $taskId, input: $input) {
    ...AgentTaskFields
  }
}

# cli#1565 (server#2653, cor:agt:050:06): create 1-25 tasks in one call, all or
# none. Not idempotent: the command sends it exactly once and never retries.
# cli#1567: $distinctAssignees is the call-level option (server#3243, merged
# 74454999); omitempty so an unset flag sends no key at all (absent, not null).
mutation AgentTaskCreateBatch(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $distinctAssignees: Boolean
  $tasks: [CreateAgentTasksItemInput!]!
) {
  createAgentTasks(appRef: $appRef, distinctAssignees: $distinctAssignees, tasks: $tasks) {
    ...AgentTaskFields
  }
}

# Plain list read; paging is limit/offset against a bounded result. The
# filters map 1:1 onto `team task list` flags.
query AgentTaskList(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $parentTaskId: ID
  # @genqlient(omitempty: true)
  $queued: Boolean
  # @genqlient(omitempty: true)
  $rootsOnly: Boolean
  # @genqlient(omitempty: true)
  $status: [AgentTaskStatus!]
  # @genqlient(omitempty: true)
  $tag: String
) {
  agentTasks(
    appRef: $appRef
    assignee: $assignee
    limit: $limit
    offset: $offset
    owner: $owner
    parentTaskId: $parentTaskId
    queued: $queued
    rootsOnly: $rootsOnly
    status: $status
    tag: $tag
  ) {
    ...AgentTaskFields
  }
}

# Explicit text search only: keep the legacy document valid on older servers.
query AgentTaskListText(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $parentTaskId: ID
  # @genqlient(omitempty: true)
  $queued: Boolean
  # @genqlient(omitempty: true)
  $rootsOnly: Boolean
  # @genqlient(omitempty: true)
  $status: [AgentTaskStatus!]
  # @genqlient(omitempty: true)
  $tag: String
  # @genqlient(omitempty: true)
  $text: String
) {
  agentTasks(
    appRef: $appRef
    assignee: $assignee
    limit: $limit
    offset: $offset
    owner: $owner
    parentTaskId: $parentTaskId
    queued: $queued
    rootsOnly: $rootsOnly
    status: $status
    tag: $tag
    text: $text
  ) {
    ...AgentTaskFields
  }
}

query AgentTaskTree($root: ID!) {
  agentTaskTree(root: $root) {
    ...AgentTaskFields
  }
}

# The team's append-only event stream. `after` continues strictly past an
# event id; alarmsOnly is `team events --alarms` and the alarm leg of
# `team task tree`.
fragment AgentTeamEventFields on AgentTeamEvent {
  id
  appId
  taskId
  type
  severity
  createdAt
  actor {
    ...AgentTaskPartyFields
  }
  actorRunId
  subjectWorker {
    ...AgentTaskPartyFields
  }
  payload
  acknowledgedAt
  acknowledgedBy {
    ...AgentTaskPartyFields
  }
  episodeStart
  chain
  wakes {
    chainIndex
    dueAt
    owner {
      ...AgentTaskPartyFields
    }
    wokenAt
  }
}

# Page-aware read of the team event stream (cor:api:120:04, server#3933): the
# server says whether more rows exist (hasMore) and hands the continuation
# (nextCursor: `after` oldest-first, `before` with newestFirst). codePrefix,
# before and newestFirst are sent only when set.
query AgentTeamEventsPage(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $after: ID
  # @genqlient(omitempty: true)
  $before: ID
  # @genqlient(omitempty: true)
  $newestFirst: Boolean
  # @genqlient(omitempty: true)
  $codePrefix: String
  # @genqlient(omitempty: true)
  $alarmsOnly: Boolean
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $since: DateTime
  # @genqlient(omitempty: true)
  $taskId: ID
  # @genqlient(omitempty: true)
  $types: [String!]
) {
  agentTeamEventsPage(
    appRef: $appRef
    after: $after
    before: $before
    newestFirst: $newestFirst
    codePrefix: $codePrefix
    alarmsOnly: $alarmsOnly
    limit: $limit
    since: $since
    taskId: $taskId
    types: $types
  ) {
    events {
      ...AgentTeamEventFields
    }
    hasMore
    nextCursor
  }
}

mutation AlarmAcknowledge($eventId: ID!) {
  acknowledgeAlarm(eventId: $eventId) {
    ...AgentTeamEventFields
  }
}

# The server-derived roster (#1707). Rendered, never re-derived client-side;
# the states are plan-derived (cor:agt:050 Out Of Scope), which the command's
# help text says out loud.
query TeamRoster($appRef: ID!) {
  teamRoster(appRef: $appRef) {
    appId
    asOf
    workers {
      worker {
        ...AgentTaskPartyFields
      }
      state
      role
      bound
      liveSession
      family
      # Self-reported model and the server-derived coarse tier (hadron-server
      # #2252 slice A/C). Advisory display only; never authorization.
      model
      modelReportedAt
      tier
      # cli#1485 S3 (hadron-server#3026, cor:agt:060:12): the live matching
      # model-group names — advisory, never authorization. [] is a real answer
      # (no model, or no group matches); null arrives ONLY with a field error at
      # exactly teamRoster.workers[i].modelGroups, which the roster command
      # tolerates and nothing else does (see api.RosterGroupAdvisories).
      modelGroups
      freeForWork
      freeFamilies
      launchableFamilies
      unavailableFamilies
      unavailableReason
      unavailableUntil
      lastActiveAt
      checkStatus { ...ChannelCheckFields }
      # hadron-server#2771 / cli#1375: the worker's latest terminal report, null
      # when never reported or masked on the working-state gate. An older server
      # rejects it: the roster refuses as schema skew, like model/tier.
      terminal { ...WorkerTerminalFields }
      lastAssignedAt
      pendingTasks
      startedTasks
      waitingOn
      waitingSince
      unreactedChildTask
      alarms
      reportsTo {
        ...AgentTaskPartyFields
      }
      reportsToRetired
      heldBy {
        id
        handle
        urn
        name
      }
      heldAt
    }
  }
}

# Every worker and model-family availability record in an App (#1706) —
# `team availability get` renders both halves from this one read.
query TeamAvailability($appRef: ID!) {
  teamAvailability(appRef: $appRef) {
    workers {
      worker {
        ...AgentTaskPartyFields
      }
      state
      reason
      until
      setAt
      # The setter class; LAPSE (#1766) when the platform recorded a passed
      # until, which `team availability get` renders as a lapse (#858).
      setBy
      setByParty {
        ...AgentTaskPartyFields
      }
      inEffect
    }
    families {
      appId
      family
      state
      reason
      until
      setAt
      # The family record names its actor directly (setBy is the party);
      # only the worker record splits it into the enum + setByParty.
      setBy {
        ...AgentTaskPartyFields
      }
      inEffect
    }
  }
}

mutation WorkerAvailabilitySet($input: SetWorkerAvailabilityInput!) {
  setWorkerAvailability(input: $input) {
    worker {
      ...AgentTaskPartyFields
    }
    state
    reason
    until
    setAt
    setBy
    setByParty {
      ...AgentTaskPartyFields
    }
    inEffect
  }
}

mutation ModelFamilyAvailabilitySet($input: SetModelFamilyAvailabilityInput!) {
  setModelFamilyAvailability(input: $input) {
    appId
    family
    state
    reason
    until
    setAt
    setBy {
      ...AgentTaskPartyFields
    }
    inEffect
  }
}

# An App's stall schedule (#864 over server #1706/#1707, #1863): the four
# stall windows (cor:agt:050:14–:17), the host-registration lapse count
# (cor:agt:070:01), and (#983) the session-end grace (cor:agt:050:10) and
# host report timeout (cor:agt:070:02). `team stall-schedule get` and `set`
# render it.
fragment AgentTaskStallScheduleFields on AgentTaskStallSchedule {
  appId
  assignmentMinutes
  notStartedMinutes
  noProgressMinutes
  ownerReactionMinutes
  hostLapseCheckIns
  sessionEndGraceMinutes
  hostReportTimeoutMinutes
  updatedAt
}

query TeamStallSchedule($appRef: ID!) {
  agentTaskStallSchedule(appRef: $appRef) {
    ...AgentTaskStallScheduleFields
  }
}

# The input is bound to gqltypes.AgentTaskStallScheduleInput: an omitted field
# keeps its value, an explicit null returns it to the platform default.
mutation TeamStallScheduleSet($appRef: ID!, $input: AgentTaskStallScheduleInput!) {
  setAgentTaskStallSchedule(appRef: $appRef, input: $input) {
    ...AgentTaskStallScheduleFields
  }
}

# The roster's reporting lines only: `task list --team` (#1044) joins on
# these and nothing else, so it does not inherit the full roster's newer
# fields (and their schema skew on an older server).
query TeamReportingLines($appRef: ID!) {
  teamRoster(appRef: $appRef) {
    appId
    workers {
      worker {
        ...AgentTaskPartyFields
      }
      reportsTo {
        ...AgentTaskPartyFields
      }
    }
  }
}

# #1135, merged server#2726 at cf9bcfece: all task refs are passed to the server.
mutation AgentTaskSetPriority($taskRef: ID!, $priority: Int!) {
  setAgentTaskPriority(taskRef: $taskRef, priority: $priority) { ...AgentTaskFields }
}
mutation AgentTaskAddBlocker($taskRef: ID!, $blockerTaskRef: ID!) {
  addAgentTaskBlocker(taskRef: $taskRef, blockerTaskRef: $blockerTaskRef) { ...AgentTaskFields }
}
mutation AgentTaskRemoveBlocker($taskRef: ID!, $blockerTaskRef: ID!) {
  removeAgentTaskBlocker(taskRef: $taskRef, blockerTaskRef: $blockerTaskRef) { ...AgentTaskFields }
}
query AgentTaskDependencies($taskRef: ID!, $limit: Int!, $offset: Int!) {
  agentTask(id: $taskRef) {
    id
    blockedBy(limit: $limit, offset: $offset) { total hasMore items { ...AgentTaskDependencyFields } }
    blocks(limit: $limit, offset: $offset) { total hasMore items { ...AgentTaskDependencyFields } }
  }
}

# Server-side narrowing beyond `AgentTaskListText` (tag sets, source, overdue,
# date ranges). A separate document so a list with none of these flags keeps
