# @genqlient(for: "AgentTaskReferenceFilter.kind", omitempty: true)
query AgentTaskListFiltered(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $createdAfter: DateTime
  # @genqlient(omitempty: true)
  $createdBefore: DateTime
  # @genqlient(omitempty: true)
  $finishedAfter: DateTime
  # @genqlient(omitempty: true)
  $finishedBefore: DateTime
  # @genqlient(omitempty: true)
  $matchFailed: Boolean
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $overdue: Boolean
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $parentTaskId: ID
  # @genqlient(omitempty: true)
  $queued: Boolean
  # @genqlient(omitempty: true)
  $rootsOnly: Boolean
  # @genqlient(omitempty: true)
  $reference: AgentTaskReferenceFilter
  # @genqlient(omitempty: true)
  $source: String
  # cli#1524 C1 (V46): the exact externalId, how a caller finds the holder after TASK_EXTERNAL_ID_TAKEN.
  # @genqlient(omitempty: true)
  $externalId: String
  # @genqlient(omitempty: true)
  $startedAfter: DateTime
  # @genqlient(omitempty: true)
  $startedBefore: DateTime
  # @genqlient(omitempty: true)
  $status: [AgentTaskStatus!]
  # @genqlient(omitempty: true)
