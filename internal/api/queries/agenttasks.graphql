  # @genqlient(omitempty: true)
  $tagsAll: [String!]
  # @genqlient(omitempty: true)
  $tagsAny: [String!]
  # @genqlient(omitempty: true)
  $text: String
) {
  agentTasks(
    appRef: $appRef
    assignee: $assignee
    createdAfter: $createdAfter
    createdBefore: $createdBefore
    finishedAfter: $finishedAfter
    finishedBefore: $finishedBefore
    matchFailed: $matchFailed
    limit: $limit
    offset: $offset
    overdue: $overdue
    owner: $owner
    parentTaskId: $parentTaskId
    queued: $queued
    reference: $reference
    rootsOnly: $rootsOnly
    source: $source
    externalId: $externalId
    startedAfter: $startedAfter
    startedBefore: $startedBefore
    status: $status
    tag: $tag
    tagsAll: $tagsAll
    tagsAny: $tagsAny
    text: $text
  ) {
    ...AgentTaskFields
  }
}

# cli#1137 (server#2645, cor:agt:050:09) — edit a task's descriptive fields.
# The server reads `input` as a STRICT PATCH: a key that is present is applied
# and a present null CLEARS, a key that is absent is left alone. A nil pointer
# would therefore never express "clear", and a plain omitempty slice would drop
# an empty list. Every field is omitempty, and the nullable patch fields are
# json.RawMessage: nil is omitted, `null` is sent as null, anything else is the
# value (the UpdateApp description idiom). title and closeSessionWhenDone have
# no null-clear (an empty title is refused; null would mean false), so they stay
# pointers, where a pointer to false is still sent.
# @genqlient(for: "UpdateAgentTaskInput.title", omitempty: true)
# @genqlient(for: "UpdateAgentTaskInput.closeSessionWhenDone", omitempty: true)
# @genqlient(for: "UpdateAgentTaskInput.description", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "UpdateAgentTaskInput.tags", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "UpdateAgentTaskInput.requirements", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "UpdateAgentTaskInput.startBy", omitempty: true, bind: "encoding/json.RawMessage")
# cli#1514: nil is omitted, a timestamp sets, and RawMessage("null") clears.
# @genqlient(for: "UpdateAgentTaskInput.finishBy", omitempty: true, bind: "encoding/json.RawMessage")
# #2649 references: a replace list or an explicit clear (null/[]); a plain omitempty slice would drop the empty list, so the clear needs RawMessage like tags.
# @genqlient(for: "UpdateAgentTaskInput.references", omitempty: true, bind: "encoding/json.RawMessage")
# #2420: nil = key omitted (unchanged), RawMessage("null") = explicit clear. The
# global JSON binding is a slice, so without omitempty a nil value would be sent
# as null and clear the task's properties on every unrelated update (#1331).
# @genqlient(for: "UpdateAgentTaskInput.properties", omitempty: true, bind: "encoding/json.RawMessage")
mutation AgentTaskUpdate(
  $taskId: ID!
  $input: UpdateAgentTaskInput!
) {
  updateAgentTask(taskId: $taskId, input: $input) {
    ...AgentTaskFields
  }
}

# cli#1524 C3 (hadron-server#3125 S3, cor:agt:120:03): one page of the open
# outside items of a task integration that no task of the App claims. Every
# optional argument is omitted unless its flag is given, so the server's
# defaults and bounds apply (list limit 1-100, default 20).
query UntrackedTaskItems(
  $appRef: ID!
  $integration: String!
  # @genqlient(omitempty: true)
  $team: ID
  # @genqlient(omitempty: true)
  $repository: String
  # @genqlient(omitempty: true)
  $ready: ReadyFilter
  # @genqlient(omitempty: true)
  $skip: Int
  # @genqlient(omitempty: true)
  $limit: Int
) {
  untrackedTaskItems(appRef: $appRef, integration: $integration, team: $team, repository: $repository, ready: $ready, skip: $skip, limit: $limit) {
    items {
      externalId
      repository
      number
      title
      url
      labels
      createdAt
      updatedAt
      linkedPullRequestMerged
    }
    total
    complete
    incompleteReason
  }
}

# cli#1524 C3: claim up to limit (1-10, server default 1) of those items as
# STARTED root tasks assigned to the caller. No skip: a claim walks the list
# from its start. A mid-walk refusal comes back beside the claims already made
# (incompleteReason claim_refused, refusalCode), not thrown.
mutation ClaimUntrackedTaskItems(
  $appRef: ID!
  $integration: String!
  # @genqlient(omitempty: true)
  $team: ID
  # @genqlient(omitempty: true)
  $repository: String
  # @genqlient(omitempty: true)
  $ready: ReadyFilter
  # @genqlient(omitempty: true)
  $limit: Int
) {
  claimUntrackedTaskItems(appRef: $appRef, integration: $integration, team: $team, repository: $repository, ready: $ready, limit: $limit) {
    tasks { ...AgentTaskFields }
    complete
    incompleteReason
    refusalCode
  }
}


# cli#1596 (hadron-server#3132 S4, cor:agt:120:03): the same claim naming
# its parties. A SEPARATE document so the no-flag claim above stays the old
# document byte for byte and an older server keeps validating it; this one
# needs a server with the assignee/owner arguments. Only an App's own key may
# name parties (it must name both); a person or worker naming one gets the
# server's BAD_USER_INPUT. Each party is sent as given, never resolved here.
mutation ClaimUntrackedTaskItemsForParties(
  $appRef: ID!
  $integration: String!
  # @genqlient(omitempty: true)
  $team: ID
  # @genqlient(omitempty: true)
  $repository: String
  # @genqlient(omitempty: true)
  $ready: ReadyFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
) {
  claimUntrackedTaskItems(appRef: $appRef, integration: $integration, team: $team, repository: $repository, ready: $ready, limit: $limit, assignee: $assignee, owner: $owner) {
    tasks { ...AgentTaskFields }
    complete
    incompleteReason
    refusalCode
  }
}

# cli#1622 (hadron-server#3422, cor:agt:120:03): the three documents above
# with the server's no-team filter. SEPARATE documents, as cli#1596 did, so the
# three above stay byte for byte what they were (a server without noTeam keeps
# validating them) and only --no-team needs a server that has the argument.
# $noTeam is non-null: these documents exist only to send true, and never send
# team (the server refuses the pair, BAD_USER_INPUT, and the CLI refuses it
# first).
query UntrackedTaskItemsNoTeam(
  $appRef: ID!
  $integration: String!
  $noTeam: Boolean!
  # @genqlient(omitempty: true)
  $repository: String
  # @genqlient(omitempty: true)
  $ready: ReadyFilter
  # @genqlient(omitempty: true)
  $skip: Int
  # @genqlient(omitempty: true)
  $limit: Int
) {
  untrackedTaskItems(appRef: $appRef, integration: $integration, noTeam: $noTeam, repository: $repository, ready: $ready, skip: $skip, limit: $limit) {
    items {
      externalId
      repository
      number
      title
      url
      labels
      createdAt
      updatedAt
      linkedPullRequestMerged
    }
    total
    complete
    incompleteReason
  }
}

