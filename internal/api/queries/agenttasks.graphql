# `hadron team task|roster|events|alarm|availability` — the Task Management
# epic's CLI slice T4 (hadron-cli#830, server #1705/#1706/#1707). Every
# operation below is a THIN caller over a server-owned gate; the CLI composes
# no task state and derives nothing the server doesn't hand back.
#
# Attribution: the write mutations carry no sessionRef argument — the server
# takes the actor from the X-Hadron-Session header (api.WithSession), which
# the authored-write middleware adds for exactly the root fields listed in
# authoredWriteField (internal/cmd/team/write_attribution.go). A person with
# no worktree binding writes as themselves over plain GraphQL.

# One sanitized task party (never a User object). name is the Worker's name
# or the person's handle; urn is set for workers only.
fragment AgentTaskPartyFields on AgentTaskParty {
  id
  kind
  name
  urn
}

fragment AgentTaskDependencyFields on AgentTask {
  id
  handle
  title
  status
}

fragment AgentTaskFields on AgentTask {
  priority
  blocked
  blockedBy(limit: 20, offset: 0) { total hasMore items { ...AgentTaskDependencyFields } }
  blocks(limit: 20, offset: 0) { total hasMore items { ...AgentTaskDependencyFields } }
  id
  handle
  taskNumber
  appId
  title
  description
  status
  queued
  waitingOnChildren
  owner {
    ...AgentTaskPartyFields
  }
  assignee {
    ...AgentTaskPartyFields
  }
  assignedBy {
    ...AgentTaskPartyFields
  }
  createdBy {
    ...AgentTaskPartyFields
  }
  parentTaskId
  tags
  source
  startBy
  createdAt
  updatedAt
  startedAt
  finishedAt
  cancelledAt
  closeSessionWhenDone
  requirements {
    role
    familyIn
    familyNotIn
    excludeWorkerIds
  }
  result {
    outcome
    summary
    evidence
  }
  # #2420: the task's OWN optional JSON object (never inherited, so a child
  # returns its own value, null when unset).
  properties
}

# createAgentTask takes one input object; appRef is required for a root task
# and inherited from the parent for a child. Optional party/requirements
# inputs are omitempty so a nil pointer is OMITTED (preserve/default), never
# sent as null — the wire-semantics rule from CLAUDE.md.
# `project` is omitted unless --project is given: the server reads an absent
# project as the reserved no-project AT0 (cor:agt:050:01), so a nil pointer
# must not be sent as null. Per-field omitempty on this one input field.
# Schema-only optional fields must stay absent for older providers.
# @genqlient(for: "CreateAgentTaskInput.project", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.priority", omitempty: true)
# @genqlient(for: "CreateAgentTaskInput.blockedBy", omitempty: true)
# #2420: the task's own properties object. A pointer field, omitted when nil.
# @genqlient(for: "CreateAgentTaskInput.properties", omitempty: true)
mutation AgentTaskCreate(
  $input: CreateAgentTaskInput!
) {
  createAgentTask(input: $input) {
    ...AgentTaskFields
  }
}

# assign/reassign take closeSessionWhenDone as an OPTIONAL argument that
# replaces the task's value only when given — omitempty is load-bearing.
mutation AgentTaskAssign(
  $taskId: ID!
  $assignee: AgentTaskPartyInput!
  # @genqlient(omitempty: true)
  $closeSessionWhenDone: Boolean
) {
  assignAgentTask(taskId: $taskId, assignee: $assignee, closeSessionWhenDone: $closeSessionWhenDone) {
    ...AgentTaskFields
  }
}

mutation AgentTaskReassign(
  $taskId: ID!
  $assignee: AgentTaskPartyInput!
  # @genqlient(omitempty: true)
  $closeSessionWhenDone: Boolean
) {
  reassignAgentTask(taskId: $taskId, assignee: $assignee, closeSessionWhenDone: $closeSessionWhenDone) {
    ...AgentTaskFields
  }
}

mutation AgentTaskStart($taskId: ID!) {
  startAgentTask(taskId: $taskId) {
    ...AgentTaskFields
  }
}

mutation AgentTaskProgress($taskId: ID!) {
  recordAgentTaskProgress(taskId: $taskId) {
    ...AgentTaskFields
  }
}

mutation AgentTaskFinish(
  $taskId: ID!
  $result: AgentTaskResultInput!
) {
  finishAgentTask(taskId: $taskId, result: $result) {
    ...AgentTaskFields
  }
}

mutation AgentTaskCancel($taskId: ID!) {
  cancelAgentTask(taskId: $taskId) {
    ...AgentTaskFields
  }
}

# #1754 (cor:agt:050:02): a pending task with no assignee is parked — BACKLOG
# takes no assignee, never enters the queue, is never matched or waited on,
# and raises no alarms. Whoever may assign a task may park it
# (cor:agt:050:09). TASK_INVALID_TRANSITION when not pending or assigned.
mutation AgentTaskPark($taskId: ID!) {
  parkAgentTask(taskId: $taskId) {
    ...AgentTaskFields
  }
}

# The way out of BACKLOG: the task becomes PENDING and enters the queue.
# Whoever may assign a task may make it ready. TASK_INVALID_TRANSITION when
# not backlog.
mutation AgentTaskReady($taskId: ID!) {
  makeAgentTaskReady(taskId: $taskId) {
    ...AgentTaskFields
  }
}

query AgentTaskGet($id: ID!) {
  agentTask(id: $id) {
    ...AgentTaskFields
  }
}

# Plain list read; paging is limit/offset against a bounded result. The
# filters map 1:1 onto `team task list` flags.
query AgentTaskList(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $parentTaskId: ID
  # @genqlient(omitempty: true)
  $queued: Boolean
  # @genqlient(omitempty: true)
  $rootsOnly: Boolean
  # @genqlient(omitempty: true)
  $status: [AgentTaskStatus!]
  # @genqlient(omitempty: true)
  $tag: String
) {
  agentTasks(
    appRef: $appRef
    assignee: $assignee
    limit: $limit
    offset: $offset
    owner: $owner
    parentTaskId: $parentTaskId
    queued: $queued
    rootsOnly: $rootsOnly
    status: $status
    tag: $tag
  ) {
    ...AgentTaskFields
  }
}

# Explicit text search only: keep the legacy document valid on older servers.
query AgentTaskListText(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $parentTaskId: ID
  # @genqlient(omitempty: true)
  $queued: Boolean
  # @genqlient(omitempty: true)
  $rootsOnly: Boolean
  # @genqlient(omitempty: true)
  $status: [AgentTaskStatus!]
  # @genqlient(omitempty: true)
  $tag: String
  # @genqlient(omitempty: true)
  $text: String
) {
  agentTasks(
    appRef: $appRef
    assignee: $assignee
    limit: $limit
    offset: $offset
    owner: $owner
    parentTaskId: $parentTaskId
    queued: $queued
    rootsOnly: $rootsOnly
    status: $status
    tag: $tag
    text: $text
  ) {
    ...AgentTaskFields
  }
}

query AgentTaskTree($root: ID!) {
  agentTaskTree(root: $root) {
    ...AgentTaskFields
  }
}

# The team's append-only event stream. `after` continues strictly past an
# event id; alarmsOnly is `team events --alarms` and the alarm leg of
# `team task tree`.
fragment AgentTeamEventFields on AgentTeamEvent {
  id
  appId
  taskId
  type
  severity
  createdAt
  actor {
    ...AgentTaskPartyFields
  }
  actorRunId
  subjectWorker {
    ...AgentTaskPartyFields
  }
  payload
  acknowledgedAt
  acknowledgedBy {
    ...AgentTaskPartyFields
  }
  episodeStart
  chain
  wakes {
    chainIndex
    dueAt
    owner {
      ...AgentTaskPartyFields
    }
    wokenAt
  }
}

query AgentTeamEvents(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $after: ID
  # @genqlient(omitempty: true)
  $alarmsOnly: Boolean
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $since: DateTime
  # @genqlient(omitempty: true)
  $taskId: ID
  # @genqlient(omitempty: true)
  $types: [String!]
) {
  agentTeamEvents(
    appRef: $appRef
    after: $after
    alarmsOnly: $alarmsOnly
    limit: $limit
    since: $since
    taskId: $taskId
    types: $types
  ) {
    ...AgentTeamEventFields
  }
}

mutation AlarmAcknowledge($eventId: ID!) {
  acknowledgeAlarm(eventId: $eventId) {
    ...AgentTeamEventFields
  }
}

# The server-derived roster (#1707). Rendered, never re-derived client-side;
# the states are plan-derived (cor:agt:050 Out Of Scope), which the command's
# help text says out loud.
query TeamRoster($appRef: ID!) {
  teamRoster(appRef: $appRef) {
    appId
    asOf
    workers {
      worker {
        ...AgentTaskPartyFields
      }
      state
      role
      bound
      liveSession
      family
      # Self-reported model and the server-derived coarse tier (hadron-server
      # #2252 slice A/C). Advisory display only; never authorization.
      model
      modelReportedAt
      tier
      freeForWork
      freeFamilies
      launchableFamilies
      unavailableFamilies
      unavailableReason
      unavailableUntil
      lastActiveAt
      checkStatus { ...ChannelCheckFields }
      # hadron-server#2771 / cli#1375: the worker's latest terminal report, null
      # when never reported or masked on the working-state gate. An older server
      # rejects it: the roster refuses as schema skew, like model/tier.
      terminal { ...WorkerTerminalFields }
      lastAssignedAt
      pendingTasks
      startedTasks
      waitingOn
      waitingSince
      unreactedChildTask
      alarms
      reportsTo {
        ...AgentTaskPartyFields
      }
      reportsToRetired
      heldBy {
        id
        handle
        urn
        name
      }
      heldAt
    }
  }
}

# Every worker and model-family availability record in an App (#1706) —
# `team availability get` renders both halves from this one read.
query TeamAvailability($appRef: ID!) {
  teamAvailability(appRef: $appRef) {
    workers {
      worker {
        ...AgentTaskPartyFields
      }
      state
      reason
      until
      setAt
      # The setter class; LAPSE (#1766) when the platform recorded a passed
      # until, which `team availability get` renders as a lapse (#858).
      setBy
      setByParty {
        ...AgentTaskPartyFields
      }
      inEffect
    }
    families {
      appId
      family
      state
      reason
      until
      setAt
      # The family record names its actor directly (setBy is the party);
      # only the worker record splits it into the enum + setByParty.
      setBy {
        ...AgentTaskPartyFields
      }
      inEffect
    }
  }
}

mutation WorkerAvailabilitySet($input: SetWorkerAvailabilityInput!) {
  setWorkerAvailability(input: $input) {
    worker {
      ...AgentTaskPartyFields
    }
    state
    reason
    until
    setAt
    setBy
    setByParty {
      ...AgentTaskPartyFields
    }
    inEffect
  }
}

mutation ModelFamilyAvailabilitySet($input: SetModelFamilyAvailabilityInput!) {
  setModelFamilyAvailability(input: $input) {
    appId
    family
    state
    reason
    until
    setAt
    setBy {
      ...AgentTaskPartyFields
    }
    inEffect
  }
}

# An App's stall schedule (#864 over server #1706/#1707, #1863): the four
# stall windows (cor:agt:050:14–:17), the host-registration lapse count
# (cor:agt:070:01), and (#983) the session-end grace (cor:agt:050:10) and
# host report timeout (cor:agt:070:02). `team stall-schedule get` and `set`
# render it.
fragment AgentTaskStallScheduleFields on AgentTaskStallSchedule {
  appId
  assignmentMinutes
  notStartedMinutes
  noProgressMinutes
  ownerReactionMinutes
  hostLapseCheckIns
  sessionEndGraceMinutes
  hostReportTimeoutMinutes
  updatedAt
}

query TeamStallSchedule($appRef: ID!) {
  agentTaskStallSchedule(appRef: $appRef) {
    ...AgentTaskStallScheduleFields
  }
}

# The input is bound to gqltypes.AgentTaskStallScheduleInput: an omitted field
# keeps its value, an explicit null returns it to the platform default.
mutation TeamStallScheduleSet($appRef: ID!, $input: AgentTaskStallScheduleInput!) {
  setAgentTaskStallSchedule(appRef: $appRef, input: $input) {
    ...AgentTaskStallScheduleFields
  }
}

# The roster's reporting lines only: `task list --team` (#1044) joins on
# these and nothing else, so it does not inherit the full roster's newer
# fields (and their schema skew on an older server).
query TeamReportingLines($appRef: ID!) {
  teamRoster(appRef: $appRef) {
    appId
    workers {
      worker {
        ...AgentTaskPartyFields
      }
      reportsTo {
        ...AgentTaskPartyFields
      }
    }
  }
}

# #1135, merged server#2726 at cf9bcfece: all task refs are passed to the server.
mutation AgentTaskSetPriority($taskRef: ID!, $priority: Int!) {
  setAgentTaskPriority(taskRef: $taskRef, priority: $priority) { ...AgentTaskFields }
}
mutation AgentTaskAddBlocker($taskRef: ID!, $blockerTaskRef: ID!) {
  addAgentTaskBlocker(taskRef: $taskRef, blockerTaskRef: $blockerTaskRef) { ...AgentTaskFields }
}
mutation AgentTaskRemoveBlocker($taskRef: ID!, $blockerTaskRef: ID!) {
  removeAgentTaskBlocker(taskRef: $taskRef, blockerTaskRef: $blockerTaskRef) { ...AgentTaskFields }
}
query AgentTaskDependencies($taskRef: ID!, $limit: Int!, $offset: Int!) {
  agentTask(id: $taskRef) {
    id
    blockedBy(limit: $limit, offset: $offset) { total hasMore items { ...AgentTaskDependencyFields } }
    blocks(limit: $limit, offset: $offset) { total hasMore items { ...AgentTaskDependencyFields } }
  }
}

# Server-side narrowing beyond `AgentTaskListText` (tag sets, source, overdue,
# date ranges). A separate document so a list with none of these flags keeps
# sending the legacy request byte for byte. $overdue is a pointer: an explicit
# false is sent, only nil is omitted.
query AgentTaskListFiltered(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $assignee: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $createdAfter: DateTime
  # @genqlient(omitempty: true)
  $createdBefore: DateTime
  # @genqlient(omitempty: true)
  $finishedAfter: DateTime
  # @genqlient(omitempty: true)
  $finishedBefore: DateTime
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $overdue: Boolean
  # @genqlient(omitempty: true)
  $owner: AgentTaskPartyInput
  # @genqlient(omitempty: true)
  $parentTaskId: ID
  # @genqlient(omitempty: true)
  $queued: Boolean
  # @genqlient(omitempty: true)
  $rootsOnly: Boolean
  # @genqlient(omitempty: true)
  $source: String
  # @genqlient(omitempty: true)
  $startedAfter: DateTime
  # @genqlient(omitempty: true)
  $startedBefore: DateTime
  # @genqlient(omitempty: true)
  $status: [AgentTaskStatus!]
  # @genqlient(omitempty: true)
  $tag: String
  # @genqlient(omitempty: true)
  $tagsAll: [String!]
  # @genqlient(omitempty: true)
  $tagsAny: [String!]
  # @genqlient(omitempty: true)
  $text: String
) {
  agentTasks(
    appRef: $appRef
    assignee: $assignee
    createdAfter: $createdAfter
    createdBefore: $createdBefore
    finishedAfter: $finishedAfter
    finishedBefore: $finishedBefore
    limit: $limit
    offset: $offset
    overdue: $overdue
    owner: $owner
    parentTaskId: $parentTaskId
    queued: $queued
    rootsOnly: $rootsOnly
    source: $source
    startedAfter: $startedAfter
    startedBefore: $startedBefore
    status: $status
    tag: $tag
    tagsAll: $tagsAll
    tagsAny: $tagsAny
    text: $text
  ) {
    ...AgentTaskFields
  }
}

# cli#1137 (server#2645, cor:agt:050:09) — edit a task's descriptive fields.
# The server reads `input` as a STRICT PATCH: a key that is present is applied
# and a present null CLEARS, a key that is absent is left alone. A nil pointer
# would therefore never express "clear", and a plain omitempty slice would drop
# an empty list. Every field is omitempty, and the four that can clear are
# json.RawMessage: nil is omitted, `null` is sent as null, anything else is the
# value (the UpdateApp description idiom). title and closeSessionWhenDone have
# no null-clear (an empty title is refused; null would mean false), so they stay
# pointers, where a pointer to false is still sent.
# @genqlient(for: "UpdateAgentTaskInput.title", omitempty: true)
# @genqlient(for: "UpdateAgentTaskInput.closeSessionWhenDone", omitempty: true)
# @genqlient(for: "UpdateAgentTaskInput.description", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "UpdateAgentTaskInput.tags", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "UpdateAgentTaskInput.requirements", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "UpdateAgentTaskInput.startBy", omitempty: true, bind: "encoding/json.RawMessage")
# #2420: nil = key omitted (unchanged), RawMessage("null") = explicit clear. The
# global JSON binding is a slice, so without omitempty a nil value would be sent
# as null and clear the task's properties on every unrelated update (#1331).
# @genqlient(for: "UpdateAgentTaskInput.properties", omitempty: true, bind: "encoding/json.RawMessage")
mutation AgentTaskUpdate(
  $taskId: ID!
  $input: UpdateAgentTaskInput!
) {
  updateAgentTask(taskId: $taskId, input: $input) {
    ...AgentTaskFields
  }
}
