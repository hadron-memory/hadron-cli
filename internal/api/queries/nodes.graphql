# Unified node list + search (cor:api:090) — the one field that supersedes the
# old `nodes` list and `nodeSearch`. Omit $query for a filtered list in
# deterministic order (subsumes `nodes`); pass $query to rank by $mode
# (keyword | vector | hybrid | regex). $filter is the structured, AND-combined
# selector context (memoryIds, locPrefix, nodeType, tags, isRunnable, …).
# Results are under hits[].node — never a bare array. Backs `node ls`,
# `node import`, `memory export`, and the `spec` reads; driven through
# api.FindNodes, which flattens hits→nodes and surfaces degraded/reason.
#
# The server treats an omitted NodeFilter field as "no constraint"; nil
# pointers must therefore be omitted, not sent as null — hence the per-field
# omitempty annotations mirroring nodes.graphql's NodeInput contract.
# @genqlient(for: "NodeFilter.memoryIds", omitempty: true)
# @genqlient(for: "NodeFilter.memoryClasses", omitempty: true)
# @genqlient(for: "NodeFilter.nodeType", omitempty: true)
# @genqlient(for: "NodeFilter.objectType", omitempty: true)
# @genqlient(for: "NodeFilter.tags", omitempty: true)
# @genqlient(for: "NodeFilter.isRunnable", omitempty: true)
# @genqlient(for: "NodeFilter.locPrefix", omitempty: true)
# @genqlient(for: "NodeFilter.createdBy", omitempty: true)
# @genqlient(for: "NodeFilter.updatedAfter", omitempty: true)
# @genqlient(for: "NodeFilter.updatedBefore", omitempty: true)
# @genqlient(for: "NodeFilter.includeDeleted", omitempty: true)
# @genqlient(for: "NodeFilter.where", omitempty: true)
# @genqlient(for: "NodeFilter.role", omitempty: true)
# NodeWhereInput / NodePropertySort are bound to hand-authored structs
# (internal/api/gqltypes, wired in genqlient.yaml) whose json tags pin the
# omit-vs-null wire contract — genqlient's own omitempty resolution is
# non-deterministic for the recursive NodeWhereInput, so it can't own it.
query FindNodes(
  # @genqlient(omitempty: true)
  $query: String
  # @genqlient(omitempty: true)
  $mode: FindNodesMode
  # @genqlient(omitempty: true)
  $filter: NodeFilter
  # @genqlient(omitempty: true)
  $sort: NodeSort
  # @genqlient(omitempty: true)
  $sortProperty: NodePropertySort
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # The two JSONB columns are opt-in and INDEPENDENT (#602): a listing is a thin
  # index, and a 500-row chat listing with full envelopes is a large payload to
  # send by default. They are separate variables rather than one flag so
  # --with-data fetches data ALONE. Both are `Boolean!` because @include(if:)
  # takes a non-null argument; genqlient renders the selected fields as
  # *json.RawMessage, nil when not selected.
  $withProperties: Boolean!
  $withData: Boolean!
) {
  findNodes(
    query: $query
    mode: $mode
    filter: $filter
    sort: $sort
    sortProperty: $sortProperty
    limit: $limit
    offset: $offset
  ) {
    total
    degraded
    reason
    hits {
      score
      node {
        id
        memoryId
        loc
        name
        nodeType
        tags
        seq
        isRunnable
        role
        updatedAt
        properties @include(if: $withProperties)
        data @include(if: $withData)
      }
    }
  }
}

query ResolveUrn($urn: String!) {
  resolveUrn(urn: $urn) {
    id
    kind
    memoryId
  }
}

# Bulk read of full nodes by ref (cor:api:040). Each entry of `refs` is a
# primary key OR a fully-qualified node URN (hadron-server#813) — so a caller
# holding URNs reads them in ONE call instead of resolving each one first. A
# malformed ref is a loud server error, so refs are validated client-side before
# they go out. Server caps a call at 200 nodes / 1 MB: an over-cap window comes
# back with truncated=true and the spillover in `omitted`, so callers must
# re-request those; `unavailable` lists refs the server could not return
# (deleted/inaccessible). Both lists echo the refs as SENT. Selects a full node
# projection — both edge directions (with target/source loc + memoryId),
# everything the markdown exporter serializes, and the fields the spec detail/
# lint builders read — so the whole-corpus fan-outs (`memory export`,
# `spec get --prefix`) read in ceil(N/200) round-trips instead of one node(ref)
# per node. Driven through api.CollectNodeBatch.
# The prefix form (memory + locPrefix) reads a whole subtree in ONE call with
# no per-node resolution, which `node get --prefix` uses. The server requires
# EITHER refs OR memory+locPrefix, so every variable is omitempty: a nil pointer
# must be absent, not an explicit null the server would count as "provided".
query NodeBatch(
  # @genqlient(omitempty: true)
  $refs: [ID!]
  # @genqlient(omitempty: true)
  $memory: ID
  # @genqlient(omitempty: true)
  $locPrefix: String
) {
  nodeBatch(refs: $refs, memory: $memory, locPrefix: $locPrefix) {
    truncated
    omitted
    unavailable
    nodes {
      id
      # Same two as GetNode (#515): a batched read must not print a different
      # shape from a single-ref read of the same node. renderNodeDetail is
      # shared between them, so selecting these in one query and not the other
      # is how `node get <ref>` and `node get <ref> <ref>` start disagreeing.
      urn
      portalUrl
      memoryId
      loc
      name
      alias
      nodeType
      role
      objectType
      isRunnable
      description
      abstract
      abstractOriginHash
      tags
      seq
      data
      properties
      content
      createdAt
      updatedAt
      outgoingEdges {
        id
        name
        loc
        description
        isRunnable
        priority
        condition
        target {
          id
          loc
          memoryId
        }
      }
      incomingEdges {
        id
        name
        loc
        priority
        isRunnable
        source {
          id
          loc
          memoryId
        }
      }
    }
  }
}

# The uniform single-node read (hadron-server#473) — node(ref:) subsumes the
# former nodeById(id:); ref accepts a PK, a fully-qualified node URN, or a
# bare loc (memory-scoped via the separate `memory` arg, unused here — the
# CLI resolves refs to PKs first via resolveUrn).
query GetNode($ref: ID!) {
  node(ref: $ref) {
    id
    # The fully-qualified URN and the portal link that opens it (#515).
    #
    # BOTH, from the one read, because cor:api:230:01 requires it: the surface
    # prints an identifier and a link that opens it, and they derive from the
    # same composition so they cannot disagree about what they address. Two
    # independent composers is how a surface starts printing a link to a
    # resource other than the one it just named.
    #
    # portalUrl is SERVER-BUILT and nullable, and on a NODE for exactly ONE
    # reason: the deployment has no usable web origin. It renders as nothing.
    # Never a locally-composed fallback: a link to a guessed origin fails
    # silently for whoever clicks it, which is worse than the caller seeing
    # none. The urn beside it is unaffected by the link's absence.
    #
    # The "or there is no identifier to build one from" arm belongs to WORKERS,
    # not here — `Worker.urn` is nullable, `Node.urn` is `String!`. Stating the
    # worker's reason on a node is how a reader inherits a nullability that
    # cannot occur; it had leaked into three places before PR #526 swept it.
    urn
    portalUrl
    memoryId
    loc
    name
    description
    abstract
    abstractOriginHash
    nodeType
    role
    objectType
    tags
    content
    data
    properties
    seq
    isRunnable
    createdAt
    updatedAt
    outgoingEdges {
      id
      name
      loc
      isRunnable
      priority
      target {
        id
        loc
        memoryId
      }
    }
    incomingEdges {
      id
      name
      loc
      isRunnable
      priority
      source {
        id
        loc
        memoryId
      }
    }
  }
}

