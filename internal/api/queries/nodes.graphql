# The UPDATE door for the spec kind (#1201) — createSpecNode's counterpart.
#
# It is needed because the gate reads the kind the node is now as well as the
# kind it will be: editing a node that already carries `role: "spec"` touches
# the spec kind, so the generic `updateNode` refuses it even when the edit
# touches neither signal. That is the point — a
# spec node must not be rewritable through the generic surface.
#
# Identical to `updateNode` otherwise, SELECTORS INCLUDED (`id` XOR `memoryId` +
# `loc`), and it never creates and never moves. So omit-to-preserve holds here
# exactly as it does there, which is what `spec edit` depends on and what
# routing an edit through a CREATE door could never have given it (#1192).
# @genqlient(for: "UpdateNodeInput.id", omitempty: true)
# @genqlient(for: "UpdateNodeInput.memoryId", omitempty: true)
# @genqlient(for: "UpdateNodeInput.loc", omitempty: true)
# @genqlient(for: "UpdateNodeInput.name", omitempty: true)
# @genqlient(for: "UpdateNodeInput.abstract", omitempty: true)
# @genqlient(for: "UpdateNodeInput.aiAgent", omitempty: true)
# @genqlient(for: "UpdateNodeInput.alias", omitempty: true)
# @genqlient(for: "UpdateNodeInput.content", omitempty: true)
# @genqlient(for: "UpdateNodeInput.contentType", omitempty: true)
