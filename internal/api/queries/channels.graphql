# Channels — the chat rooms spec 049 Phase 4 introduced (hadron-server#1165;
# hadron-cli#593).
#
# ADDRESSING (hadron-server#1171/#1172): a channelRef takes TWO forms — the
# Channel's id, or its ADDRESS, which is the chat root's node URN and what
# `createChannel(memoryRef, loc)` composes to. The server resolves both at every
# site, so THIS CLIENT NEVER CLASSIFIES A REF: it passes the string through and
# lets the server decide. That is the whole reason #1172 exists — a client-side
# matcher here would be a third copy of one addressing rule, beside the portal's
# and MCP's.
#
# `chatRootUrn` is the address to COPY rather than compose, and it is NULLABLE:
# where the host memory's stored URN is a pre-v2 compound form, no flat-v2
# address can be safely advertised, so the server emits none rather than hand
# out a string it would itself reject. The id always works. Every rendering must
# therefore tolerate a missing address and must never REQUIRE one.

fragment ChannelFields on Channel {
  id
  name
  description
  kind
  # The reserved address of the chat root (e.g. chats:team), and the host
  # memory it lives in. Together these are the (memory, loc) pair
  # createChannel takes — which is why two Channels can share a name AND a loc
  # and be told apart only by their host memory.
  loc
  memoryId
  # The Channel's address — copy it, never compose one. NULL when the server
  # has no flat-v2 form it can safely advertise (#1171); the id always works,
  # so no caller may depend on this being present.
  chatRootUrn
  chatRootNodeId
  # A watermark, not a count: the highest seq the allocator has issued.
  lastSeq
  lastMessageAt
  createdAt
  updatedAt
}

# The host memory, projected separately so a listing can name where a Channel
# lives without a second read — two Channels named `team` at loc `chats:team`
# are distinguishable only by this.
fragment ChannelMemory on Channel {
  memory {
    id
    urn
    name
  }
}

# Channels visible to the caller. ChannelFilter narrows by App or host memory.
query Channels(
  # @genqlient(omitempty: true)
  $filter: ChannelFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $orgId: ID
) {
  channels(filter: $filter, limit: $limit, offset: $offset, orgId: $orgId) {
    total
    items {
      ...ChannelFields
      ...ChannelMemory
    }
  }
}

# Single-Channel read. `ref` is the id OR the address; the server resolves both.
#
# Returns null when the Channel does not exist, when the ref names nothing, AND
# when the caller may not read its host memory — identically and on purpose, so
# it is "never an existence oracle" in the server's own words. Callers render
# ONE message covering all three and must not infer not-found from the null.
query GetChannel($ref: ID!) {
  channel(ref: $ref) {
    ...ChannelFields
    ...ChannelMemory
  }
}

# Create a Channel on a host memory at a reserved loc. The (memoryRef, loc) pair
# IS the address the other operations accept back, which is why `chatRootUrn`
# exists to emit it rather than asking a caller to rebuild it.
#
# @genqlient(for: "CreateChannelInput.description", omitempty: true)
mutation CreateChannel(
  $input: CreateChannelInput!
) {
  createChannel(input: $input) {
    ...ChannelFields
    ...ChannelMemory
  }
}

# Rename / re-describe a Channel whose host memory the caller may write.
#
# WIRE SEMANTICS: an OMITTED input field preserves, an explicit null clears — so
# both optional fields carry omitempty and a nil pointer is omitted rather than
# sent as null. Dropping either makes an unset flag silently clear a field
# (CLAUDE.md; findings:a-schema-refresh-can-regress-an-unrelated-write).
#
# The `for:` directives only bind when the variable list is on its own lines
# (findings:genqlient-for-directive-needs-multiline-signature) — keep this
# signature expanded.
# @genqlient(for: "UpdateChannelInput.name", omitempty: true)
# @genqlient(for: "UpdateChannelInput.description", omitempty: true)
mutation UpdateChannel(
  $ref: ID!
  $input: UpdateChannelInput!
) {
  updateChannel(ref: $ref, input: $input) {
    ...ChannelFields
    ...ChannelMemory
  }
}

mutation DeleteChannel($ref: ID!) {
  deleteChannel(ref: $ref)
}

# ---------------------------------------------------------------------------
# Messaging (spec 049 Phase 8)
# ---------------------------------------------------------------------------

fragment ChannelMessageFields on TeamChatMessage {
  seq
  at
  body
  # Display convenience: the worker name or the user handle. Nullable, so
  # every consumer falls back rather than assuming a name is present.
  authorName
  authorWorkerId
  authorUserId
  # Phase 8 item J — the Worker's App when the post crossed Apps. A
  # cross-App post is MARKED, and a transcript that hides the mark
  # misrepresents who was speaking where.
  authorAppId
  sessionId
  replyToSeq
  mentions
  nodeId
}

# Read a Channel's messages. channelRef is the id or the address.
#
# sinceSeq is a watermark (strictly greater). beforeSeq pages BACKWARD and is
# the stable way to walk history: offset is a position in a list other people
# are appending to, so it skips or repeats under concurrent posting. offset is
# IGNORED when beforeSeq is given.
query ChannelMessages(
  $channelRef: ID!
  # @genqlient(omitempty: true)
  $sinceSeq: Int
  # @genqlient(omitempty: true)
  $beforeSeq: Int
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $mentionsRef: ID
) {
  channelMessages(
    channelRef: $channelRef
    sinceSeq: $sinceSeq
    beforeSeq: $beforeSeq
    limit: $limit
    offset: $offset
    mentionsRef: $mentionsRef
  ) {
    total
    items {
      ...ChannelMessageFields
    }
  }
}

# Post into a Channel.
#
# sessionRef is what makes the message the WORKER's rather than the human's.
# It is optional on the wire, and that is the quiet failure the team-chat tools
# are known for: omitting it posts as the caller, with no error and the wrong
# authorship recorded. The command surfaces that rather than defaulting it
# silently.
mutation CreateChannelMessage(
  $channelRef: ID!
  $body: String!
  # @genqlient(omitempty: true)
  $replyToSeq: Int
  # @genqlient(omitempty: true)
  $sessionRef: ID
) {
  createChannelMessage(
    channelRef: $channelRef
    body: $body
    replyToSeq: $replyToSeq
    sessionRef: $sessionRef
  ) {
    ...ChannelMessageFields
  }
}

# Where an attendee is up to on a Channel.
query ChannelReadState(
  $channelRef: ID!
  $attendeeRef: ID!
  # @genqlient(omitempty: true)
  $appRef: ID
) {
  channelReadState(channelRef: $channelRef, attendeeRef: $attendeeRef, appRef: $appRef) {
    channelId
    attendeeUrn
    lastSeenSeq
    updatedAt
  }
}

# Advance an attendee's cursor. MONOTONIC: a lower seq is a no-op that returns
# the cursor unchanged, so this is safe to call with a stale watermark and the
# command must not present a no-op as a rewind.
mutation AdvanceChannelReadState(
  $channelRef: ID!
  $attendeeRef: ID!
  $seq: Int!
  # @genqlient(omitempty: true)
  $appRef: ID
) {
  advanceChannelReadState(channelRef: $channelRef, attendeeRef: $attendeeRef, seq: $seq, appRef: $appRef) {
    channelId
    attendeeUrn
    lastSeenSeq
    updatedAt
  }
}

# ── The register (spec 049 Phase 5; hadron-cli#636) ────────────────────────────
#
# A RegisterEntry says WHO may do WHAT in a Channel: an attendee (a Worker or an
# Agent), a role (BOTH / POST / WATCH), and whether only mentions count as new.
# It is the participation model, and until #636 the CLI could not touch it while
# MCP could.
#
# `attendeeUrn` is NULL for the wide row — "every attendee in the owner's
# context" — which is a much broader grant than naming one, and the CLI makes
# that an explicit opt-in rather than the result of a forgotten flag. The
# SERVER is right to model it as optional; the CLIENT declines to let it happen
# by omission.
#
# Refs are passed through unexamined, exactly as everywhere else in this file.

fragment RegisterEntryFields on RegisterEntry {
  id
  channelId
  attendeeUrn
  role
  mentionOnly
  installDefault
  description
  ownerType
  ownerId
  organizationId
  createdAt
  updatedAt
}

# A ref naming nothing MATCHES NOTHING rather than erroring (the server's own
# wording), so an empty page is ambiguous: no rows, or a filter typo. The
# command says so on stderr rather than printing an empty table that reads as
# "nobody is registered".
# @genqlient(for: "RegisterEntryFilter.attendeeRef", omitempty: true)
# @genqlient(for: "RegisterEntryFilter.channelRef", omitempty: true)
# @genqlient(for: "RegisterEntryFilter.ownerRef", omitempty: true)
query RegisterEntries(
  # @genqlient(omitempty: true)
  $filter: RegisterEntryFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # @genqlient(omitempty: true)
  $orgId: ID
) {
  registerEntries(filter: $filter, limit: $limit, offset: $offset, orgId: $orgId) {
    total
    items {
      ...RegisterEntryFields
    }
  }
}

query GetRegisterEntry($ref: ID!) {
  registerEntry(ref: $ref) {
    ...RegisterEntryFields
  }
}

# attendeeRef omitted is the WIDE row. Optional on the wire, never optional in
# the command: `register add` requires --attendee or --all-attendees.
# @genqlient(for: "CreateRegisterEntryInput.attendeeRef", omitempty: true)
# @genqlient(for: "CreateRegisterEntryInput.description", omitempty: true)
# @genqlient(for: "CreateRegisterEntryInput.mentionOnly", omitempty: true)
# @genqlient(for: "CreateRegisterEntryInput.role", omitempty: true)
mutation CreateRegisterEntry(
  $input: CreateRegisterEntryInput!
) {
  createRegisterEntry(input: $input) {
    ...RegisterEntryFields
  }
}

# Update carries ONLY role / mentionOnly / description — the attendee and the
# Channel are immutable, so "move this registration" is delete + create and the
# command must not pretend otherwise. Each field is omitempty so an unset flag
# is OMITTED (preserve) rather than sent as null (clear).
# @genqlient(for: "UpdateRegisterEntryInput.description", omitempty: true)
# @genqlient(for: "UpdateRegisterEntryInput.mentionOnly", omitempty: true)
# @genqlient(for: "UpdateRegisterEntryInput.role", omitempty: true)
mutation UpdateRegisterEntry(
  $ref: ID!
  $input: UpdateRegisterEntryInput!
) {
  updateRegisterEntry(ref: $ref, input: $input) {
    ...RegisterEntryFields
  }
}

# Returns a BOOLEAN: false means nothing was deleted (unknown ref, or already
# gone). Discarding it would report success on a failed delete.
mutation DeleteRegisterEntry($ref: ID!) {
  deleteRegisterEntry(ref: $ref)
}
