# Uniform paginated app list (hadron-server#473) — { items, total } envelope,
# limit capped at 200 server-side; `app ls` pages to exhaustion.
query Apps(
  $orgId: ID!
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  apps(orgId: $orgId, limit: $limit, offset: $offset) {
    total
    items {
      id
      urn
      name
      appType
      agentId
      memberCount
      createdAt
    }
  }
}

mutation CreateApp(
  # spec 047: omit orgRef to create a user-owned (personal) App under the
  # caller's @handle. omitempty so a nil pointer is omitted, not sent as null.
  # @genqlient(omitempty: true)
  $orgRef: ID
  $agentRef: ID!
  $name: String!
  # @genqlient(omitempty: true)
  $urn: String
  # @genqlient(omitempty: true)
  $appType: AppType
  # @genqlient(omitempty: true)
  $description: String
) {
  createApp(
    orgRef: $orgRef
    agentRef: $agentRef
    name: $name
    urn: $urn
    appType: $appType
    description: $description
  ) {
    id
    urn
    name
    appType
    agentId
    memberCount
    createdAt
  }
}

mutation DeleteApp($ref: ID!) {
  deleteApp(ref: $ref)
}

# #389: attach / detach an existing Agent to an existing App — the AppAgent
# join (spec 023 US1, cor:dmo:050:03). `createApp` makes a NEW App from an
# Agent; these two are the only way to compose the roster of one you already
# have, and until now only raw GraphQL reached them, which is why
# hadron-server#952 read as "no surface attaches an existing Agent".
#
# trainingMode is omitempty because it is PER-APP, not per-Agent (spec 023
# FR-001): sending it always would silently re-set the flag for every installed
# Agent on an add that never meant to touch it.
mutation InstallAgentIntoApp(
  $appRef: ID!
  $agentRef: ID!
  # @genqlient(omitempty: true)
  $trainingMode: Boolean
) {
  installAgentIntoApp(appRef: $appRef, agentRef: $agentRef, trainingMode: $trainingMode) {
    appAgent {
      createdAt
      agent {
        id
        urn
        name
        personaRole
      }
      app {
        id
        urn
        name
      }
    }
  }
}

# Idempotent server-side: succeeds whether or not the AppAgent row exists. The
# Agent's per-(App, Agent, *) memories are NOT cascade-deleted (spec 023
# FR-005) — they persist as orphans and become reachable again on reinstall,
# which is the retention promise cor:dmo:050:03 makes and #389 exists to make
# reachable.
mutation UninstallAgentFromApp($appRef: ID!, $agentRef: ID!) {
  uninstallAgentFromApp(appRef: $appRef, agentRef: $agentRef) {
    agentId
    appId
  }
}

# The install-roster read (#408, re-homed from team.graphql in #428): the
# AppAgent join answering "which Agents are installed in this App?". Under the
# Worker model this is the INSTALL roster only — the App's STAFF (named
# workers) is the Workers query in team.graphql. App.agents is the
# 023-app-shape convenience over App.appAgents, so this needs no paging: an
# App's installed set is small and bounded, unlike agents().
query AppAgentRoster($appRef: ID!) {
  app(ref: $appRef) {
    id
    urn
    name
    agents {
      id
      urn
      name
      description
      visibility
      organizationId
      personaRole
      createdAt
    }
  }
}
