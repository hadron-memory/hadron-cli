# Uniform paginated app list (hadron-server#473) — { items, total } envelope,
# limit capped at 200 server-side; `app ls` pages to exhaustion.
# orgId is NULLABLE on the server (#473's uniform list) and the owner slice is
# org-less by definition, so it must be omittable here — `app list` still
# requires one of --org / --owned-by-me, but that is the command's rule, not
# the operation's.
# @genqlient(for: "AppFilter.ownedByMe", omitempty: true)
query Apps(
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $filter: AppFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  apps(orgId: $orgId, filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      id
      urn
      name
      appType
      agentId
      memberCount
      createdAt
    }
  }
}

mutation CreateApp(
  # spec 047: omit orgRef to create a user-owned (personal) App under the
  # caller's @handle. omitempty so a nil pointer is omitted, not sent as null.
  # @genqlient(omitempty: true)
  $orgRef: ID
  $agentRef: ID!
  $name: String!
  # @genqlient(omitempty: true)
  $urn: String
  # @genqlient(omitempty: true)
  $appType: AppType
  # @genqlient(omitempty: true)
  $description: String
) {
  createApp(
    orgRef: $orgRef
    agentRef: $agentRef
    name: $name
    urn: $urn
    appType: $appType
    description: $description
  ) {
    id
    urn
    name
    appType
    agentId
    memberCount
    createdAt
  }
}

mutation DeleteApp($ref: ID!) {
  deleteApp(ref: $ref)
}

# #389: attach / detach an existing Agent to an existing App — the AppAgent
# join (spec 023 US1, cor:dmo:050:03). `createApp` makes a NEW App from an
# Agent; these two are the only way to compose the roster of one you already
# have, and until now only raw GraphQL reached them, which is why
# hadron-server#952 read as "no surface attaches an existing Agent".
#
# trainingMode is omitempty because it is PER-APP, not per-Agent (spec 023
# FR-001): sending it always would silently re-set the flag for every installed
# Agent on an add that never meant to touch it.
mutation InstallAgentIntoApp(
  $appRef: ID!
  $agentRef: ID!
  # @genqlient(omitempty: true)
  $trainingMode: Boolean
) {
  installAgentIntoApp(appRef: $appRef, agentRef: $agentRef, trainingMode: $trainingMode) {
    appAgent {
      createdAt
      agent {
        id
        urn
        name
        personaRole
      }
      app {
        id
        urn
        name
      }
    }
  }
}

# Idempotent server-side: succeeds whether or not the AppAgent row exists. The
# Agent's per-(App, Agent, *) memories are NOT cascade-deleted (spec 023
# FR-005) — they persist as orphans and become reachable again on reinstall,
# which is the retention promise cor:dmo:050:03 makes and #389 exists to make
# reachable.
mutation UninstallAgentFromApp($appRef: ID!, $agentRef: ID!) {
  uninstallAgentFromApp(appRef: $appRef, agentRef: $agentRef) {
    agentId
    appId
  }
}

# The install-roster read (#408, re-homed from team.graphql in #428): the
# AppAgent join answering "which Agents are installed in this App?". Under the
# Worker model this is the INSTALL roster only — the App's STAFF (named
# workers) is the Workers query in team.graphql. App.agents is the
# 023-app-shape convenience over App.appAgents, so this needs no paging: an
# App's installed set is small and bounded, unlike agents().
query AppAgentRoster($appRef: ID!) {
  app(ref: $appRef) {
    id
    urn
    name
    agents {
      id
      urn
      name
      description
      visibility
      organizationId
      personaRole
      createdAt
    }
    # cli#916 C2: each install's boot-prompt pointer (AppAgent.bootPromptRef,
    # #2045 S8), joined onto the Agents above by agent id. agent is null when
    # the caller may not read the definition, and such a row joins nothing.
    appAgents {
      agent { id }
      bootPromptRef
      bootPromptTargetDeleted
    }
  }
}

# #400: `team init --app` — the App resolves its own team shared memory
# (hadron-server#965: read-only, never provisions; the memory holding the
# App's worklog root wins, mirroring the worklog locator). The schema rides
# along so init can keep its three-value status contract (created / updated /
# unchanged) without the caller naming the memory.
query GetAppSharedMemory($appRef: ID!) {
  app(ref: $appRef) {
    id
    sharedMemory {
      id
      urn
      class
      schema
    }
  }
}

# cli#916 C2: an installed Agent's boot-prompt pointer for one App. nodeRef has
# no omitempty, as SetAgentBootPrompt (agent.graphql) explains.
mutation SetAppAgentBootPrompt($appRef: String!, $agentRef: String!, $nodeRef: String) {
  setAppAgentBootPrompt(appRef: $appRef, agentRef: $agentRef, nodeRef: $nodeRef) {
    agent { id urn name }
    app { id urn name }
    bootPromptRef
    bootPromptTargetDeleted
  }
}

# cli#1057: minimal single-App identity, no settings or nested keys.
query GetAppMetadata($ref: ID!) {
  app(ref: $ref) {
    id
    urn
    name
    appType
    description
  }
}

# cli#1057: manager-authorized, active-only metadata inventory. No raw key,
# nested App.keys, host usage, or scope mutations.
query AppKeysMetadata($appRef: ID!) {
  appKeys(appRef: $appRef) {
    id
    keyPreview
    label
    createdAt
    lastUsedAt
    revokedAt
  }
}

# cli#1058 — bounded App update. Omitted = preserve, so every optional variable
# carries omitempty and a nil never reaches the wire. description uses
# json.RawMessage, where nil is omitted, `null` is sent as null and a quoted
# string (including "") is sent as that string — a *string cannot express all
# three. name and sessionTimeoutSeconds have no null-clear and stay pointers.
mutation UpdateApp(
  $ref: ID!
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $description: String
  # @genqlient(omitempty: true)
  $sessionTimeoutSeconds: Int
) {
  updateApp(
    ref: $ref
    name: $name
    description: $description
    sessionTimeoutSeconds: $sessionTimeoutSeconds
  ) {
    id
    urn
    name
    sessionTimeoutSeconds
  }
}

# cli#1209 (server#2190, cor:dmo:050:17): the memories appNodes reads for the
# caller, one row per memory with every reason it is in scope. The CLI always
# sends limit; offset is omitted at 0.
query AppMemoryScope(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  appMemoryScope(appRef: $appRef, limit: $limit, offset: $offset) {
    total
    items {
      memoryId
      memoryUrn
      name
      class
      sources {
        kind
        agentId
      }
      viewerCanWrite
    }
  }
}

# cli#1209: the display name of one source agent. Null when the caller may not
# read it — the row then shows the source kind alone, as the SDL says.
query AppScopeAgentName($ref: ID!) {
  agent(ref: $ref) {
    id
    name
  }
}

# cli#1223 — mint an App key. rawKey is the secret, shown once: the command
# writes it to a 0600 file and never prints it unless --print-key.
mutation CreateAppKey(
  $appRef: ID!
  # @genqlient(omitempty: true)
  $label: String
) {
  createAppKey(appRef: $appRef, label: $label) {
    key {
      id
      keyPreview
      label
    }
    rawKey
  }
}
