# Host operations — hadron-cli#871 over server #1876 (#1709 T6 slice 1). The
# manager and reader surfaces: grant an App key `host:operate` for one host,
# issue a typed operation to a registered host, and read the App's host
# registrations and operations. The host's own side (register, collect,
# report, availability) is the poller's, hadron-cli#831.

fragment HostOperationFields on HostOperation {
  id
  appId
  hostId
  type
  args
  workerId
  worker {
    id
    name
  }
  status
  issuedBy
  issuedByUserId
  issuedByWorkerId
  issuedAt
  collectedAt
  finishedAt
  result
  failureReason
}

query HostRegistrations($appRef: String!) {
  hostRegistrations(appRef: $appRef) {
    hostId
    label
    pollIntervalSeconds
    registeredAt
    refreshedAt
    live
    workers {
      workerId
      worker {
        id
        urn
        name
      }
      family
      worktrees
    }
  }
}

# One page of an App's host registrations, the paged sibling of the field
# above (server #2213 S3, cli#2824): same rows, App gate and refusals, plus
# the {items,total,hasMore} envelope. limit and offset are always sent —
# `team host list` drains this field 20 at a time by default and reads one
# explicit page with --limit/--offset, so it never wants the server's default
# page; a limit of 0 asks for the count only. The callers that decide on the
# whole set (host up/run/sweep, onboarding, the chat adapter) keep the
# unpaged field.
query HostRegistrationsPage($appRef: String!, $limit: Int!, $offset: Int!) {
  hostRegistrationsPage(appRef: $appRef, limit: $limit, offset: $offset) {
    items {
      hostId
      label
      pollIntervalSeconds
      registeredAt
      refreshedAt
      live
      workers {
        workerId
        worker {
          id
          urn
          name
        }
        family
        worktrees
      }
    }
    total
    hasMore
  }
}

query HostOperations(
  $appRef: String!
  # @genqlient(omitempty: true)
  $hostId: String
  # @genqlient(omitempty: true)
  $status: HostOperationStatus
  # @genqlient(omitempty: true)
  $worker: String
  # @genqlient(omitempty: true)
  $first: Int
  # @genqlient(omitempty: true)
  $after: String
) {
  hostOperations(appRef: $appRef, hostId: $hostId, status: $status, worker: $worker, first: $first, after: $after) {
    items {
      ...HostOperationFields
    }
    hasNextPage
    endCursor
  }
}

# #4231 (hadron-server#4257): the same list, selecting issuedReason too. Only `team host ops`
# uses it, and falls back to HostOperations when the server rejects that one field: the
# poller's own operations (collect, report) must keep working on an older server.
query HostOperationsWithReason(
  $appRef: String!
  # @genqlient(omitempty: true)
  $hostId: String
  # @genqlient(omitempty: true)
  $status: HostOperationStatus
  # @genqlient(omitempty: true)
  $worker: String
  # @genqlient(omitempty: true)
  $first: Int
  # @genqlient(omitempty: true)
  $after: String
) {
  hostOperations(appRef: $appRef, hostId: $hostId, status: $status, worker: $worker, first: $first, after: $after) {
    items {
      ...HostOperationFields
      issuedReason
    }
    hasNextPage
    endCursor
  }
}

mutation IssueHostOperation($input: IssueHostOperationInput!) {
  issueHostOperation(input: $input) {
    ...HostOperationFields
  }
}

# The key's id, label and scopes only — never its preview or any key material.
fragment AppKeyScopesFields on AppKey {
  id
  appId
  label
  revokedAt
  scopes {
    scope
    hostId
    grantedAt
    grantedBy
  }
}

mutation GrantAppKeyScope(
  $id: ID!
  $scope: String!
  # @genqlient(omitempty: true)
  $hostId: String
) {
  grantAppKeyScope(id: $id, scope: $scope, hostId: $hostId) {
    ...AppKeyScopesFields
  }
}

mutation RevokeAppKeyScope($id: ID!, $scope: String!) {
 # @genqlient(typename: "RevokeAppKeyScopeRow1595")
  revokeAppKeyScope(id: $id, scope: $scope) {
    ...AppKeyScopesFields
  }
}

# ---- The host poller's own surface (hadron-cli#831, server #1876/#1883) ----
# Called with a host:operate App key (cor:agt:070:04); the host's identity
# comes from the key's scope row, never from these arguments, and no session
# rides along (APP_KEY_SESSION_BOUND).

fragment HostRegistrationFields on HostRegistration {
  hostId
  label
  pollIntervalSeconds
  registeredAt
  refreshedAt
  live
  workers {
    workerId
    worker {
      id
      urn
      name
    }
    family
    worktrees
  }
}

# The whole workers list: it replaces the last registration's. So workers is
# ALWAYS sent, an empty list included: omitting it would not clear a host
# whose workers were all removed from its configuration.
# @genqlient(for: "RegisterHostInput.workers", omitempty: false)
# @genqlient(for: "RegisterHostInput.capabilities", omitempty: true)
mutation RegisterHost(
  $input: RegisterHostInput!
) {
  registerHost(input: $input) {
    ...HostRegistrationFields
  }
}

# #4222 / cli#2091: the same registration, also asking for refusedWorkers: under
# a SERVER setup source, the listed workers the platform did not assign to this
# host. A SEPARATE document, because a server without hadron-server#4241 refuses
# any query naming the field, which would take every host poller down. The
# poller tries this one first and, on a schema-skew refusal, falls back to
# RegisterHost once and remembers it (hostServer.Register). Never widen
# RegisterHost or HostRegistrationFields with the field.
# @genqlient(for: "RegisterHostInput.workers", omitempty: false)
# @genqlient(for: "RegisterHostInput.capabilities", omitempty: true)
mutation RegisterHostWithRefused(
  $input: RegisterHostInput!
) {
  registerHost(input: $input) {
    ...HostRegistrationFields
    refusedWorkers {
      worker
      code
    }
  }
}

# Issued operations become collected; collected-but-unreported ones come back
# too (a restarted host resumes them). launchGrant is set only on worker.start,
# and only in this answer: a re-collection revokes the unconsumed grant and
# mints a fresh one (launch.ts mintLaunchGrants).
mutation CollectHostOperations(
  $appRef: String!
  # @genqlient(omitempty: true)
  $first: Int
) {
  collectHostOperations(appRef: $appRef, first: $first) {
    ...HostOperationFields
    launchGrant
  }
}

# worktree is sent only on a worktree.create success and failureReason only on
# a failure, so both are omitted when unset. ($input sits on its own line: a
# comment above a one-line signature also attaches to its first variable.)
# @genqlient(for: "ReportHostOperationInput.worktree", omitempty: true)
# @genqlient(for: "ReportHostOperationInput.failureReason", omitempty: true)
mutation ReportHostOperation(
  $input: ReportHostOperationInput!
) {
  reportHostOperation(input: $input) {
    ...HostOperationFields
  }
}

# cli#1595: explicitly instructed documents; legacy operations stay byte-identical.
mutation RevokeAppKeyScopeInstructed($id: ID!, $scope: String!, $instruction: ActInstructionInput!) {
 # @genqlient(typename: "RevokeAppKeyScopeRow1595")
  revokeAppKeyScope(id: $id, scope: $scope, instruction: $instruction) {
    ...AppKeyScopesFields
  }
}
