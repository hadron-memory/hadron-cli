# Spec 046 metering reads (cli#215). Money fields are base-10 integer strings
# of micro-cents (1e-8 USD); the CLI never parses them. The writes
# (setAiModelPrice, grantCredits, adjustCredits) are at the end of the file (cli#215 write cut).

fragment AiModelPriceFields on AiModelPrice {
  id
  provider
  model
  tier
  inputMicroCentsPerMTok
  outputMicroCentsPerMTok
  markupBasisPoints
  effectiveAt
  createdAt
  createdBy
}

fragment CreditLedgerEntryFields on CreditLedgerEntry {
  id
  organizationId
  ownerUserId
  kind
  amountMicroCents
  expiresAt
  sourceType
  sourceId
  note
  createdAt
  createdBy
}

# One rate row by id. Authenticated read; null means not found or not
# visible (the server does not say which).
query AiModelPrice($ref: ID!) {
  aiModelPrice(ref: $ref) {
    ...AiModelPriceFields
  }
}

# Rate rows, provider/model/tier then newest effective first. Authenticated
# read. An unset filter is omitted (the server treats "" as no filter, so the
# command refuses an empty one rather than send it).
query AiModelPrices(
  # @genqlient(omitempty: true)
  $provider: String
  # @genqlient(omitempty: true)
  $model: String
  # @genqlient(omitempty: true)
  $tier: Int
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  aiModelPrices(provider: $provider, model: $model, tier: $tier, limit: $limit, offset: $offset) {
    total
    items {
      ...AiModelPriceFields
    }
  }
}

# One owner's balance (an organization, or a person) and what is left of each
# expiring grant, soonest first. Exactly one of orgRef and userRef is sent, the other
# omitted, never null (cli#3072). The read may settle expired grants (hadron-server#5011).
query CreditBalance(
  # @genqlient(omitempty: true)
  $orgRef: String
  # @genqlient(omitempty: true)
  $userRef: ID
) {
  creditBalance(orgRef: $orgRef, userRef: $userRef) {
    organizationId
    ownerUserId
    balanceMicroCents
    expiring {
      amountMicroCents
      expiresAt
    }
  }
}

# One org's AI spend over [from, to), one grouping (cli#3071). Org-ADMIN. Cost
# and charged are two figures (cor:dmo:170:04).
query AiSpend(
  # @genqlient(omitempty: true)
  $orgRef: String
  # @genqlient(omitempty: true)
  $userRef: ID
  $from: String!
  $to: String!
  $groupBy: AiSpendGroup!
) {
  aiSpend(orgRef: $orgRef, userRef: $userRef, from: $from, to: $to, groupBy: $groupBy) {
    from
    to
    truncated
    totalGroups
    rows {
      key
      events
      tokensIn
      tokensOut
      costMicroCents
      unpricedEvents
      chargedMicroCents
    }
  }
}

# One org's ledger page, newest first. Org-ADMIN.
query CreditLedgerEntries(
  # @genqlient(omitempty: true)
  $orgRef: String
  # @genqlient(omitempty: true)
  $userRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  creditLedgerEntries(orgRef: $orgRef, userRef: $userRef, limit: $limit, offset: $offset) {
    total
    items {
      ...CreditLedgerEntryFields
    }
  }
}

# One-line-per-variable layout: genqlient applies a directive comment to every
# node starting on the operation's line.
# Platform-ADMIN. Appends one effective-dated rate row; never mutates an
# existing one. An omitted optional is not sent, so the server defaults apply
# (tier 1, env markup, now).
# @genqlient(for: "SetAiModelPriceInput.effectiveAt", omitempty: true)
# @genqlient(for: "SetAiModelPriceInput.markupBasisPoints", omitempty: true)
# @genqlient(for: "SetAiModelPriceInput.tier", omitempty: true)
mutation SetAiModelPrice(
  $input: SetAiModelPriceInput!
) {
  setAiModelPrice(input: $input) {
    ...AiModelPriceFields
  }
}

# Platform-ADMIN or the BILLING role. Appends a positive grant to an org's ledger. The response
# has no created/reused flag, so a replay of (sourceType, sourceId) is
# indistinguishable from a first grant. An omitted optional is not sent.
# @genqlient(for: "GrantCreditsInput.expiresAt", omitempty: true)
# @genqlient(for: "GrantCreditsInput.note", omitempty: true)
# @genqlient(for: "GrantCreditsInput.sourceId", omitempty: true)
# @genqlient(for: "GrantCreditsInput.sourceType", omitempty: true)
# cli#3184, cli#3072: exactly one of orgRef and userRef names the ledger (server#5014); the
# other is omitted, never an explicit null, which an older server rejects as an unknown field.
# @genqlient(for: "GrantCreditsInput.orgRef", omitempty: true)
# @genqlient(for: "GrantCreditsInput.userRef", omitempty: true)
mutation GrantCredits(
  $input: GrantCreditsInput!
) {
  grantCredits(input: $input) {
    ...CreditLedgerEntryFields
  }
}

# Platform-ADMIN or the BILLING role. Appends a signed adjustment; idempotent on
# (sourceType, sourceId), a mismatched replay is IDEMPOTENCY_CONFLICT.
# As for GrantCredits, exactly one owner is sent and the other omitted (cli#3072).
# @genqlient(for: "AdjustCreditsInput.orgRef", omitempty: true)
# @genqlient(for: "AdjustCreditsInput.userRef", omitempty: true)
mutation AdjustCredits(
  $input: AdjustCreditsInput!
) {
  adjustCredits(input: $input) {
    ...CreditLedgerEntryFields
  }
}

# One owner's limits and how much of each is held now (hadron-server#5009). One
# row per key the server returns; null limit means unlimited. The CLI keeps no key list.
query OwnerLimits(
  # @genqlient(omitempty: true)
  $orgRef: String
  # @genqlient(omitempty: true)
  $userRef: ID
) {
  ownerLimits(orgRef: $orgRef, userRef: $userRef) {
    key
    limit
    used
  }
}

# Platform-ADMIN or the BILLING role. Writes owner limits. A nil limit inside an
# OwnerLimitInput is sent as null, which means unlimited and lifts the deployment
# default, so that field carries no omitempty; every other optional is omitted when unset.
# @genqlient(for: "SetOwnerLimitsInput.orgRef", omitempty: true)
# @genqlient(for: "SetOwnerLimitsInput.userRef", omitempty: true)
# @genqlient(for: "SetOwnerLimitsInput.replace", omitempty: true)
# @genqlient(for: "SetOwnerLimitsInput.onlySourceType", omitempty: true)
mutation SetOwnerLimits(
  $input: SetOwnerLimitsInput!
) {
  setOwnerLimits(input: $input) {
    key
    limit
    used
  }
}

# Platform-ADMIN or the BILLING role. Clears owner limits; omitted keys clear every key.
# @genqlient(for: "ClearOwnerLimitsInput.orgRef", omitempty: true)
# @genqlient(for: "ClearOwnerLimitsInput.userRef", omitempty: true)
# @genqlient(for: "ClearOwnerLimitsInput.keys", omitempty: true)
# @genqlient(for: "ClearOwnerLimitsInput.onlySourceType", omitempty: true)
mutation ClearOwnerLimits(
  $input: ClearOwnerLimitsInput!
) {
  clearOwnerLimits(input: $input) {
    key
    limit
    used
  }
}
