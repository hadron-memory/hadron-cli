# cli#2631 slice 1: issue a read client for an App secret, and list the read
# clients the caller issued or holds. Optional input fields are omitted when unset:
# omitted keeps the server default, an explicit null would be read as a value.
# @genqlient(for: "IssueSecretReadClientInput.holderRef", omitempty: true)
# @genqlient(for: "IssueSecretReadClientInput.startsAt", omitempty: true)
# @genqlient(for: "IssueSecretReadClientInput.expiresAt", omitempty: true)
# @genqlient(for: "IssueSecretReadClientInput.maxReads", omitempty: true)
mutation IssueSecretReadClient(
  $input: IssueSecretReadClientInput!
) {
  issueSecretReadClient(input: $input) {
    clientId
    grantId
    secretName
    selfIssued
  }
}

# One page of the caller's read clients (the server caps and defaults the page).
query MySecretReadClients(
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  mySecretReadClients(limit: $limit, offset: $offset) {
    clientId
    clientPrefix
    grantId
    secretId
    secretName
    selfIssued
    endReason
    createdAt
    # cli#2720: the auto-delete mark (the secret is deleted at the last read or when the window ends).
    destroyOnEnd
  }
}

# cli#2680: revoke a read client's grant. A read client is one grant (cor:sec:060),
# so this is revokeGrant on its grantId, once. The answer is the grant as the App's
# manager reads it; the first end stands, so an already-ended grant comes back as it
# is. No instruction is sent: the CLI acts as the person.
mutation RevokeSecretReadClientGrant($ref: ID!) {
  revokeGrant(ref: $ref) {
    id
    state
    revokedAt
    # A missing or null allows must not read as false: it is a pointer so absence is seen.
    # @genqlient(pointer: true)
    allows
  }
}

# cli#2664 slice 2: reveal a value through a read client, spending one read. THE
# ONLY place the CLI selects `value`: it must never reach a log, an error or an
# output the command did not mean to print. One call per process, never retried.
mutation RevealSecret($clientId: ID!) {
  revealSecret(clientId: $clientId) {
    secretName
    value
    readsLeft
  }
}
