# Decision logs and decisions (hadron-server #1641; hadron-cli#1335).
#
# Naming is intentional: the server renamed these operations and types to
# question*/Question* (cli#2465), but the operation names (AskDecision, ...)
# and fragment names (DecisionFields, DecisionLogFields) below are client-chosen
# and deliberately keep the Decision spelling. Test capture keys and the pin
# tests key on them, so do not "fix" either side on its own; the server-side
# fields they call (question(...), askQuestion(...)) are the new names.
#
# Every operation is passed through: refs go to the server exactly as typed
# and who may do what is the server's rule (cor:api:240:01). Optional fields
# of the ask/amend input objects carry omitempty (except the presence-sensitive
# lists noted at each operation), so a field the caller left out stays
# omitted: amend reads an omitted field as "unchanged", and QuestionRefInput is
# exactly one of ref/node/spec, so a sent null for the other two would be a
# different request.

fragment DecisionActorRefFields on CommentActorRef { id name handle urn }

fragment DecisionActorFields on QuestionActor {
  userId
  user { ...DecisionActorRefFields }
  workerId
  worker { ...DecisionActorRefFields }
  appId
  app { ...DecisionActorRefFields }
}

fragment DecisionRefFields on QuestionRef { ref node spec }

fragment DecisionIdentityMergeFields on QuestionIdentityMerge {
  fromUserId
  from { ...DecisionActorRefFields }
  toUserId
  to { ...DecisionActorRefFields }
  mergedAt
}

fragment DecisionAnswerFields on QuestionAnswer {
  at
  byUserId
  recordedByUserId
  claimedBy
  freeform
  key
  text
  reason
  via
  source { ...DecisionRefFields }
}

fragment DecisionFields on Question {
  id
  urn
  code
  n
  logId
  title
  context
  state
  tier
  urgency
  authorizes
  archival
  revSeq
  portalUrl
  viewerIsDecider
  askedAt
  answeredAt
  askedBy { ...DecisionActorFields }
  deciderIds
  deciders { ...DecisionActorRefFields }
  identityMerges { ...DecisionIdentityMergeFields }
  parts {
    n
    citation
    question
    options { key label meaning cost }
    recommendation { key reason attributedTo by { ...DecisionActorFields } }
    noRecommendationReason
    answer { ...DecisionAnswerFields }
    answerHistory { ...DecisionAnswerFields }
  }
  blocks { ...DecisionRefFields }
  followUps { ...DecisionRefFields }
  sources { ...DecisionRefFields }
  withdrawn { at reason by { ...DecisionActorFields } }
  evidence {
    approval {
      approvedAt
      revision
      integrity
      byDecider
      byUserId
      by { ...DecisionActorRefFields }
    }
  }
}

fragment DecisionLogFields on QuestionLog {
  id
  urn
  loc
  name
  prefix
  lastCode
  revSeq
  portalUrl
  defaultDeciderIds
  defaultDeciders { ...DecisionActorRefFields }
  eligibleDeciderIds
  eligibleDeciders { ...DecisionActorRefFields }
  identityMerges { ...DecisionIdentityMergeFields }
  purges {
    code
    at
    reason
    contentHash
    byUserId
    by { ...DecisionActorRefFields }
  }
}

query DecisionLog($ref: ID!) {
  questionLog(ref: $ref) { ...DecisionLogFields }
}

# By ref, or by code within logRef. Each argument is omitted when unset so the
# server sees exactly the selector the caller gave.
query Decision(
  # @genqlient(omitempty: true)
  $ref: ID,
  # @genqlient(omitempty: true)
  $code: String,
  # @genqlient(omitempty: true)
  $logRef: ID
) {
  question(ref: $ref, code: $code, logRef: $logRef) { ...DecisionFields }
}

# The server pages (limit/offset, QuestionPage.total); omitted filters keep the
# server defaults (limit 20, offset 0, sort PORTAL_DEFAULT).
query Decisions(
  # @genqlient(omitempty: true)
  $logRef: ID,
  # @genqlient(omitempty: true)
  $awaitingMe: Boolean,
  # @genqlient(omitempty: true)
  $authorizes: Boolean,
  # @genqlient(omitempty: true)
  $state: [QuestionState!],
  # @genqlient(omitempty: true)
  $tier: QuestionTier,
  # @genqlient(omitempty: true)
  $urgency: [QuestionUrgency!],
  # @genqlient(omitempty: true)
  $sort: QuestionSort,
  # @genqlient(omitempty: true)
  $limit: Int,
  # @genqlient(omitempty: true)
  $offset: Int
) {
  questions(
    logRef: $logRef
    awaitingMe: $awaitingMe
    authorizes: $authorizes
    state: $state
    tier: $tier
    urgency: $urgency
    sort: $sort
    limit: $limit
    offset: $offset
  ) {
    total
    items { ...DecisionFields }
  }
}

query VerifyDecision($ref: ID!) {
  verifyQuestion(ref: $ref) {
    state
    revision
    approvedRevision
    approvalIntegrity
    approvalByDecider
    codec
    renderer
    findings
  }
}

mutation CreateDecisionLog(
  $memoryRef: ID!,
  $loc: String!,
  # @genqlient(omitempty: true)
  $name: String,
  # @genqlient(omitempty: true)
  $prefix: String,
  $defaultDeciders: [ID!]!,
  # @genqlient(omitempty: true)
  $eligibleDeciders: [ID!]
) {
  createQuestionLog(
    memoryRef: $memoryRef
    loc: $loc
    name: $name
    prefix: $prefix
    defaultDeciders: $defaultDeciders
    eligibleDeciders: $eligibleDeciders
  ) { ...DecisionLogFields }
}

mutation SetDecisionLogDeciders(
  $logRef: ID!,
  $defaultDeciders: [ID!]!,
  # NO omitempty on purpose: nil is sent as null, which keeps the log's
  # eligible set, and [] clears it (the server resolver, formerly
  # resolvers.decisions.ts: eligibleDeciders == null ? prior : given).
  $eligibleDeciders: [ID!],
  $expectedRevision: Int!,
  $reason: String!
) {
  setQuestionLogDeciders(
    logRef: $logRef
    defaultDeciders: $defaultDeciders
    eligibleDeciders: $eligibleDeciders
    expectedRevision: $expectedRevision
    reason: $reason
  ) { ...DecisionLogFields }
}

# @genqlient(for: "AskQuestionInput.authorizes", omitempty: true)
# @genqlient(for: "AskQuestionInput.blocks", omitempty: true)
# deciders carries NO omitempty: null means the log's defaults, while an explicit
# [] is the caller's own (refused) request, so it must reach the server as sent.
# @genqlient(for: "AskQuestionInput.context", omitempty: true)
# @genqlient(for: "AskQuestionInput.followUps", omitempty: true)
# @genqlient(for: "AskQuestionInput.grant", omitempty: true)
# @genqlient(for: "AskQuestionInput.sources", omitempty: true)
# @genqlient(for: "AskQuestionInput.tier", omitempty: true)
# @genqlient(for: "AskQuestionInput.urgency", omitempty: true)
# @genqlient(for: "QuestionPartInput.noRecommendation", omitempty: true)
# @genqlient(for: "QuestionPartInput.options", omitempty: true)
# @genqlient(for: "QuestionPartInput.recommendation", omitempty: true)
# @genqlient(for: "QuestionPartInput.yesno", omitempty: true)
# @genqlient(for: "QuestionOptionInput.cost", omitempty: true)
# @genqlient(for: "QuestionOptionInput.meaning", omitempty: true)
# @genqlient(for: "QuestionRecommendationInput.attributedTo", omitempty: true)
# @genqlient(for: "QuestionRecommendationInput.reason", omitempty: true)
# @genqlient(for: "QuestionRefInput.node", omitempty: true)
# @genqlient(for: "QuestionRefInput.ref", omitempty: true)
# @genqlient(for: "QuestionRefInput.spec", omitempty: true)
mutation AskDecision(
  $logRef: ID!,
  $input: AskQuestionInput!
) {
  askQuestion(logRef: $logRef, input: $input) { ...DecisionFields }
}

# blocks, followUps and sources carry NO omitempty on purpose: the server reads
# null as "unchanged" and [] as "clear" (amendQuestion, formerly amendDecision: patch.blocks != null), so
# an absent key decodes to nil and is sent as null, and an explicit [] clears.
# (omitempty: false is explicit because use_struct_references adds it by default.)
# @genqlient(for: "AmendQuestionInput.blocks", omitempty: false)
# @genqlient(for: "AmendQuestionInput.followUps", omitempty: false)
# @genqlient(for: "AmendQuestionInput.sources", omitempty: false)
# @genqlient(for: "AmendQuestionInput.addParts", omitempty: true)
# context is tri-state on the server (patch.context !== undefined: absent keeps,
# null clears, a string sets), which *string cannot carry: RawMessage keeps the
# file's literal null (non-nil "null") apart from an absent key (nil, omitted).
# @genqlient(for: "AmendQuestionInput.context", omitempty: true, bind: "encoding/json.RawMessage")
# @genqlient(for: "AmendQuestionInput.parts", omitempty: true)
# @genqlient(for: "AmendQuestionInput.tier", omitempty: true)
# @genqlient(for: "AmendQuestionInput.title", omitempty: true)
# @genqlient(for: "AmendQuestionInput.urgency", omitempty: true)
# @genqlient(for: "QuestionPartPatchInput.noRecommendation", omitempty: true)
# @genqlient(for: "QuestionPartPatchInput.options", omitempty: true)
# @genqlient(for: "QuestionPartPatchInput.question", omitempty: true)
# @genqlient(for: "QuestionPartPatchInput.recommendation", omitempty: true)
# @genqlient(for: "QuestionPartPatchInput.yesno", omitempty: true)
# @genqlient(for: "QuestionPartInput.noRecommendation", omitempty: true)
# @genqlient(for: "QuestionPartInput.options", omitempty: true)
# @genqlient(for: "QuestionPartInput.recommendation", omitempty: true)
# @genqlient(for: "QuestionPartInput.yesno", omitempty: true)
# @genqlient(for: "QuestionOptionInput.cost", omitempty: true)
# @genqlient(for: "QuestionOptionInput.meaning", omitempty: true)
# @genqlient(for: "QuestionRecommendationInput.attributedTo", omitempty: true)
# @genqlient(for: "QuestionRecommendationInput.reason", omitempty: true)
# @genqlient(for: "QuestionRefInput.node", omitempty: true)
# @genqlient(for: "QuestionRefInput.ref", omitempty: true)
# @genqlient(for: "QuestionRefInput.spec", omitempty: true)
mutation AmendDecision(
  $ref: ID!,
  $input: AmendQuestionInput!,
  $expectedRevision: Int!,
  $reason: String!
) {
  amendQuestion(ref: $ref, input: $input, expectedRevision: $expectedRevision, reason: $reason) { ...DecisionFields }
}

mutation WithdrawDecision($ref: ID!, $reason: String!, $expectedRevision: Int!) {
  withdrawQuestion(ref: $ref, reason: $reason, expectedRevision: $expectedRevision) { ...DecisionFields }
}

mutation PurgeUnansweredDecision($ref: ID!, $reason: String!) {
  purgeUnansweredQuestion(ref: $ref, reason: $reason)
}
