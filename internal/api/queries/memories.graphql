# Uniform paginated memory list (hadron-server#473) — replaces myMemories.
# The noisy agent system class is hidden unless filter.memoryClasses names it
# explicitly; limit is capped at 200 server-side, so whole-scope callers page
# to exhaustion (api.CollectAll).
# @genqlient(for: "MemoryFilter.memoryClasses", omitempty: true)
# @genqlient(for: "MemoryFilter.visibility", omitempty: true)
# @genqlient(for: "MemoryFilter.sharedWithMe", omitempty: true)
query Memories(
  # @genqlient(omitempty: true)
  $filter: MemoryFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  memories(filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      id
      urn
      name
      shortDescription
      class
      visibility
      organizationId
      isEncrypted
      maxRevCount
      updatedAt
    }
  }
}

# The shared-with-me slice (#316): memories the caller was granted via
# MemoryShare. `sharedWithMe: true` SWITCHES which readable set memories()
# draws from — it is not part of the caller's owned/org union, so this never
# returns a memory you own.
#
# A separate operation from Memories on purpose: it selects myShare for the
# per-row role + grantor (which MemoryFilter.sharedWithMe's own docblock points
# at for this listing), and every whole-scope caller pages the plain memories()
# list to exhaustion — a per-row myShare resolution must not ride along there.
query MemoriesSharedWithMe(
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  memories(filter: { sharedWithMe: true }, limit: $limit, offset: $offset) {
    total
    items {
      id
      urn
      name
      shortDescription
      class
      visibility
      organizationId
      isEncrypted
      maxRevCount
      updatedAt
      # The full user projection the sibling access listings (share list,
      # member list) already emit — not a display label. `sharedBy` is the
      # handle you feed back to `memory share rm --grantee`, and two grantors
      # can share a display name, so the id has to survive to the DTO.
      myShare {
        role
        grantor {
          ...MemUserFields
        }
      }
    }
  }
}

mutation CreateMemory(
  # spec 047 — orgId is OPTIONAL: omit it (nil pointer) for a user-owned
  # memory in the caller's own @handle namespace (organizationId NULL,
  # ownerUserId = caller). omitempty so a nil pointer is omitted, not sent as
  # an explicit null. The server derives the bare <handle>:<slug> URN; never
  # construct or prefix it client-side.
  # @genqlient(omitempty: true)
  $orgId: ID
  $name: String!
  # @genqlient(omitempty: true)
  $memoryClass: MemoryClass
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still
  # serializes as [] (clear) — omitempty on a plain slice would drop it.
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $visibility: MemoryVisibility
  # #621 — per-node revision-history cap (min 1). Omitted = server default.
  # @genqlient(omitempty: true)
  $maxRevCount: Int
) {
  createMemory(
    orgId: $orgId
    name: $name
    memoryClass: $memoryClass
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    visibility: $visibility
    maxRevCount: $maxRevCount
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Create a new App-scoped app/personal/private memory. The server owns URN
# composition: app-class URNs are name-derived; personal/private use opaque
# per-owner identities, so this mutation intentionally has no slug argument.
mutation CreateMemoryInApp(
  $appRef: ID!
  $agentRef: ID!
  $memoryClass: MemoryClass!
  $name: String!
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still serializes as [].
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $maxRevCount: Int
) {
  createMemoryInApp(
    appRef: $appRef
    agentRef: $agentRef
    memoryClass: $memoryClass
    name: $name
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    maxRevCount: $maxRevCount
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Bind an existing free-standing personal/private memory to an App. All refs
# accept either IDs or URNs and are resolved by the server.
mutation AttachMemoryToApp($memoryRef: ID!, $appRef: ID!, $agentRef: ID!) {
  attachMemoryToApp(memoryRef: $memoryRef, appRef: $appRef, agentRef: $agentRef) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Omitted = preserve; flags the user didn't pass must not reach the wire.
mutation UpdateMemory(
  $id: ID!
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still
  # serializes as [] (clear) — omitempty on a plain slice would drop it.
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $visibility: MemoryVisibility
  # @genqlient(omitempty: true)
  $data: JSON
  # The new URN slug (a bare slug, e.g. "hadrontool-pdf"). The server
  # kebab-normalizes it and recomposes the memory URN. Omitted = preserve.
  # @genqlient(omitempty: true)
  $urn: String
  # #621 — per-node revision-history cap (min 1). Omitted = preserve.
  # @genqlient(omitempty: true)
  $maxRevCount: Int
  # #725 — opt-in per-memory property schema (declared collections + typed
  # fields). Omitted = preserve; explicit JSON null clears it. The server
  # validates well-formedness and rejects a malformed schema with BAD_USER_INPUT.
  # @genqlient(omitempty: true)
  $schema: JSON
) {
  updateMemory(
    id: $id
    name: $name
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    visibility: $visibility
    data: $data
    urn: $urn
    maxRevCount: $maxRevCount
    schema: $schema
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    data
    updatedAt
  }
}

mutation DeleteMemory($id: ID!) {
  deleteMemory(id: $id)
}

# memory(ref:) accepts the memory's PK id or URN (hadron-server#473).
query GetMemory($ref: ID!) {
  memory(ref: $ref) {
    id
    urn
    name
    shortDescription
    description
    class
    visibility
    organizationId
    isEncrypted
    tags
    source
    syncStatus
    vectorIndexEnabled
    maxRevCount
    data
    schema
    createdAt
    updatedAt
  }
}

mutation CloneMemory($ref: ID!, $targetUrn: String!) {
  cloneMemory(ref: $ref, targetUrn: $targetUrn) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Extract a parent node + its loc-subtree into a new memory (hadron-server#637).
# move = false copies (source intact); move = true relocates, soft-deleting the
# source subtree. The default is applied server-side, so it is omitted when the
# --move flag is not set.
mutation ExtractParentNodeToMemory(
  $parentRef: ID!
  $targetUrn: String!
  # @genqlient(omitempty: true)
  $move: Boolean
) {
  extractParentNodeToMemory(parentRef: $parentRef, targetUrn: $targetUrn, move: $move) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Convert a plaintext memory to encrypted-at-rest (#57). One-way: the caller
# provides the data key and all node content/data is rewritten as ciphertext in
# a single transaction. There is no decrypt mutation, so the command gates like a
# destructive op.
mutation EncryptMemory($memoryId: ID!, $dataKey: String!) {
  encryptMemory(memoryId: $memoryId, dataKey: $dataKey) {
    id
    urn
    name
    isEncrypted
  }
}

# Promote an anonymous/session memory to a registered user (#75, descoped from
# #57). Backs `hadron memory link-user`.
#
# App-key only: the server gates on ctx.appId, so a user PAT is refused. The
# memory must be a user/anonymous memory in the App's own organization.
#
# externalUserId is the App's own identifier for the end user; the server
# resolves it to an existing app-scoped user or provisions one (unless the App
# sets createUserPermission=DENY).
#
# Two side effects the caller must see, hence selecting urn and isEncrypted:
# the memory's URN is RE-MINTED as a fresh flat v2 urn (the old one stops
# resolving), and passing dataKey encrypts every node in place and lands the
# memory as class='private' owned by that user.
mutation LinkMemoryToUser(
  $memoryId: ID!
  $externalUserId: String!
  # Optional: omitempty so a nil pointer is omitted rather than sent as an
  # explicit null (the server reads an omitted field as "no encryption").
  # @genqlient(omitempty: true)
  $dataKey: String
) {
  linkMemoryToUser(memoryId: $memoryId, externalUserId: $externalUserId, dataKey: $dataKey) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Memory health audit (hadron-server#819) — the GraphQL twin of the MCP-only
# hadron_validate, wired up for `hadron memory validate` (#352).
#
# Two fields exist because `findings` is NOT the answer on its own:
#   - totalFindings is the true count BEFORE `limit` truncation — gate CI on
#     this, never on len(findings).
#   - ok is false when any check was SKIPPED, even with zero findings, so a
#     clean bill of health can't quietly omit a check. skippedChecks says which
#     and why (e.g. the stale-abstract check is skipped on encrypted memories:
#     the validator does not decrypt).
#
# The server takes no per-check filter, so --check narrows client-side; the
# command surfaces the interaction with truncation rather than hiding it.
query ValidateMemory(
  $memoryRef: ID!
  # @genqlient(omitempty: true)
  $limit: Int
) {
  validateMemory(memoryRef: $memoryRef, limit: $limit) {
    memoryId
    nodesChecked
    ok
    totalFindings
    truncated
    findings {
      kind
      nodeId
      nodeLoc
      nodeUrn
      detail
    }
    skippedChecks {
      check
      reason
    }
  }
}
