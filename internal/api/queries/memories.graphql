  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $visibility: MemoryVisibility
  # @genqlient(omitempty: true)
  $maxRevCount: Int
  # cli#1340 — the memory's settings. Each is omitted unless its flag was
  # passed; on create an explicit null is the same as omitted.
  # @genqlient(omitempty: true)
  $category0: String
  # @genqlient(omitempty: true)
  $category1: String
  # @genqlient(omitempty: true)
  $category2: String
  # @genqlient(omitempty: true)
  $data: JSON
  # @genqlient(omitempty: true)
  $embeddingSource: EmbeddingSource
  # @genqlient(omitempty: true)
  $vectorIndexEnabled: Boolean
  # @genqlient(omitempty: true)
  $license: String
  # @genqlient(omitempty: true)
  $iconUrl: String
  # @genqlient(omitempty: true)
  $heroUrl: String
  # @genqlient(omitempty: true)
  $homeUrl: String
  # @genqlient(omitempty: true)
  $source: String
  # @genqlient(omitempty: true)
  $readBranch: String
  # @genqlient(omitempty: true)
  $writeBranch: String
) {
  createMemory(
    orgId: $orgId
    name: $name
    memoryClass: $memoryClass
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    visibility: $visibility
    maxRevCount: $maxRevCount
    category0: $category0
    category1: $category1
    category2: $category2
    data: $data
    embeddingSource: $embeddingSource
    vectorIndexEnabled: $vectorIndexEnabled
    license: $license
    iconUrl: $iconUrl
    heroUrl: $heroUrl
    homeUrl: $homeUrl
    source: $source
    readBranch: $readBranch
    writeBranch: $writeBranch
    draftCorpus: true
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
