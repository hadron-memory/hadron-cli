# Uniform paginated memory list (hadron-server#473) — replaces myMemories.
# The noisy agent system class is hidden unless filter.memoryClasses names it
# explicitly; limit is capped at 200 server-side, so whole-scope callers page
# to exhaustion (api.CollectAll).
# @genqlient(for: "MemoryFilter.memoryClasses", omitempty: true)
# @genqlient(for: "MemoryFilter.visibility", omitempty: true)
# @genqlient(for: "MemoryFilter.sharedWithMe", omitempty: true)
# @genqlient(for: "MemoryFilter.ownedByMe", omitempty: true)
query Memories(
  # @genqlient(omitempty: true)
  $filter: MemoryFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # cli#1340 — the "active organization" view (cor:api:100:01); omitted = the
  # caller's whole union.
  # @genqlient(omitempty: true)
  $orgId: ID
) {
  memories(filter: $filter, limit: $limit, offset: $offset, orgId: $orgId) {
    total
    items {
      id
      urn
      name
      shortDescription
      class
      visibility
      organizationId
      isEncrypted
      maxRevCount
      updatedAt
    }
  }
}

# The shared-with-me slice (#316): memories the caller was granted via
# MemoryShare. `sharedWithMe: true` SWITCHES which readable set memories()
# draws from — it is not part of the caller's owned/org union, so this never
# returns a memory you own.
#
# A separate operation from Memories on purpose: it selects myShare for the
# per-row role + grantor (which MemoryFilter.sharedWithMe's own docblock points
# at for this listing), and every whole-scope caller pages the plain memories()
# list to exhaustion — a per-row myShare resolution must not ride along there.
query MemoriesSharedWithMe(
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # Omitted ⇒ the server's default class set, which EXCLUDES agent-system
  # memories; a whole-corpus caller passes every class (skill lint --all).
  # @genqlient(omitempty: true)
  $memoryClasses: [MemoryClass!]
) {
  memories(filter: { sharedWithMe: true, memoryClasses: $memoryClasses }, limit: $limit, offset: $offset) {
    total
    items {
      id
      urn
      name
      shortDescription
      class
      visibility
      organizationId
      isEncrypted
      maxRevCount
      updatedAt
      # The full user projection the sibling access listings (share list,
      # member list) already emit — not a display label. `sharedBy` is the
      # handle you feed back to `memory share rm --grantee`, and two grantors
      # can share a display name, so the id has to survive to the DTO.
      myShare {
        role
        grantor {
          ...MemUserFields
        }
      }
    }
  }
}

mutation CreateMemory(
  # spec 047 — orgId is OPTIONAL: omit it (nil pointer) for a user-owned
  # memory in the caller's own @handle namespace (organizationId NULL,
  # ownerUserId = caller). omitempty so a nil pointer is omitted, not sent as
  # an explicit null. The server derives the bare <handle>:<slug> URN; never
  # construct or prefix it client-side.
  # @genqlient(omitempty: true)
  $orgId: ID
  $name: String!
  # @genqlient(omitempty: true)
  $memoryClass: MemoryClass
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still
  # serializes as [] (clear) — omitempty on a plain slice would drop it.
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $visibility: MemoryVisibility
  # #621 — per-node revision-history cap (min 1). Omitted = server default.
  # @genqlient(omitempty: true)
  $maxRevCount: Int
  # cli#1340 — the memory's settings. Each is omitted unless its flag was
  # passed; on create an explicit null is the same as omitted.
  # @genqlient(omitempty: true)
  $category0: String
  # @genqlient(omitempty: true)
  $category1: String
  # @genqlient(omitempty: true)
  $category2: String
  # @genqlient(omitempty: true)
  $data: JSON
  # @genqlient(omitempty: true)
  $embeddingSource: EmbeddingSource
  # @genqlient(omitempty: true)
  $vectorIndexEnabled: Boolean
  # @genqlient(omitempty: true)
  $license: String
  # @genqlient(omitempty: true)
  $iconUrl: String
  # @genqlient(omitempty: true)
  $heroUrl: String
  # @genqlient(omitempty: true)
  $homeUrl: String
  # @genqlient(omitempty: true)
  $source: String
  # @genqlient(omitempty: true)
  $readBranch: String
  # @genqlient(omitempty: true)
  $writeBranch: String
) {
  createMemory(
    orgId: $orgId
    name: $name
    memoryClass: $memoryClass
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    visibility: $visibility
    maxRevCount: $maxRevCount
    category0: $category0
    category1: $category1
    category2: $category2
    data: $data
    embeddingSource: $embeddingSource
    vectorIndexEnabled: $vectorIndexEnabled
    license: $license
    iconUrl: $iconUrl
    heroUrl: $heroUrl
    homeUrl: $homeUrl
    source: $source
    readBranch: $readBranch
    writeBranch: $writeBranch
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

