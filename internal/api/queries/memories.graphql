# Create a new App-scoped app/personal/private memory. The server owns URN
# composition: app-class URNs are name-derived; personal/private use opaque
# per-owner identities, so this mutation intentionally has no slug argument.
mutation CreateMemoryInApp(
  $appRef: ID!
  $agentRef: ID!
  $memoryClass: MemoryClass!
  $name: String!
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still serializes as [].
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $maxRevCount: Int
  # cli#1340 — the settings createMemoryInApp takes; omitted unless passed.
  # @genqlient(omitempty: true)
  $data: JSON
  # @genqlient(omitempty: true)
  $embeddingSource: EmbeddingSource
  # @genqlient(omitempty: true)
  $vectorIndexEnabled: Boolean
) {
  createMemoryInApp(
    appRef: $appRef
    agentRef: $agentRef
    memoryClass: $memoryClass
    name: $name
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    maxRevCount: $maxRevCount
    data: $data
    embeddingSource: $embeddingSource
    vectorIndexEnabled: $vectorIndexEnabled
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Add a NEW free-standing app-class memory to an org-owned App that has at least
# one installed Agent (hadron-server#2661, cor:acl:010:01). An org admin/owner
# acting as themselves; no Agent, class, visibility, slug or maxRevCount input —
# the server owns the class (app) and composes the URN from the name.
mutation CreateAppMemory(
  $appRef: ID!
  $name: String!
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still serializes as [].
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
) {
  createAppMemory(
    appRef: $appRef
    name: $name
    shortDescription: $shortDescription
    description: $description
    tags: $tags
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Bind an existing free-standing personal/private memory to an App. All refs
# accept either IDs or URNs and are resolved by the server.
mutation AttachMemoryToApp($memoryRef: ID!, $appRef: ID!, $agentRef: ID!) {
  attachMemoryToApp(memoryRef: $memoryRef, appRef: $appRef, agentRef: $agentRef) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Omitted = preserve; flags the user didn't pass must not reach the wire.
mutation UpdateMemory(
  $id: ID!
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $shortDescription: String
  # @genqlient(omitempty: true)
  $description: String
  # bound to *[]string so an explicitly-passed empty list still
  # serializes as [] (clear) — omitempty on a plain slice would drop it.
  # @genqlient(omitempty: true, bind: "*[]string")
  $tags: [String!]
  # @genqlient(omitempty: true)
  $visibility: MemoryVisibility
  # @genqlient(omitempty: true)
  $data: JSON
  # The new URN slug (a bare slug, e.g. "hadrontool-pdf"). The server
  # kebab-normalizes it and recomposes the memory URN. Omitted = preserve.
  # @genqlient(omitempty: true)
  $urn: String
  # #621 — per-node revision-history cap (min 1). Omitted = preserve.
  # @genqlient(omitempty: true)
  $maxRevCount: Int
  # #725 — opt-in per-memory property schema (declared collections + typed
  # fields). Omitted = preserve; explicit JSON null clears it. The server
  # validates well-formedness and rejects a malformed schema with BAD_USER_INPUT.
  # @genqlient(omitempty: true)
  $schema: JSON
  # #592 (cor:acl:080:04): the opt-in marketplace catalogue flag. Omitted =
  # preserve: sending false unasked would silently de-list the memory.
  # @genqlient(omitempty: true)
  $listedOnMarketplace: Boolean
  # cli#1340 — the memory's settings. The server reads an omitted argument as
  # "keep" and an explicit null as "clear" for the text settings, so those are
  # bound to json.RawMessage: nil is omitted, `null` clears, a JSON string sets.
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $category0: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $category1: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $category2: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $license: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $iconUrl: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $heroUrl: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $homeUrl: String
  # An explicit null clears the git source (DB-only mode).
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $source: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $readBranch: String
  # @genqlient(omitempty: true, bind: "encoding/json.RawMessage")
  $writeBranch: String
  # @genqlient(omitempty: true)
  $embeddingSource: EmbeddingSource
  # @genqlient(omitempty: true)
  $vectorIndexEnabled: Boolean
  # Spec 033 FR-026: required (true) to enable the vector index on an
  # encrypted memory. Only ever sent as true.
  # @genqlient(omitempty: true)
  $acknowledgeVectorInversionRisk: Boolean
  # The chunk dials; the server validates them against the effective state.
  # @genqlient(omitempty: true)
  $chunkTokens: Int
  # @genqlient(omitempty: true)
  $chunkOverlap: Int
  # @genqlient(omitempty: true)
  $forceFixedSize: Boolean
) {
  updateMemory(
    id: $id
    name: $name
    shortDescription: $shortDescription
    description: $description
    tags: $tags
    visibility: $visibility
    data: $data
    urn: $urn
    maxRevCount: $maxRevCount
    schema: $schema
    listedOnMarketplace: $listedOnMarketplace
    category0: $category0
    category1: $category1
    category2: $category2
    license: $license
    iconUrl: $iconUrl
    heroUrl: $heroUrl
    homeUrl: $homeUrl
    source: $source
    readBranch: $readBranch
    writeBranch: $writeBranch
    embeddingSource: $embeddingSource
    vectorIndexEnabled: $vectorIndexEnabled
    acknowledgeVectorInversionRisk: $acknowledgeVectorInversionRisk
    chunkTokens: $chunkTokens
    chunkOverlap: $chunkOverlap
    forceFixedSize: $forceFixedSize
  ) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    listedOnMarketplace
    data
    updatedAt
  }
}

# GetMemoryDetail is `memory get`'s read: GetMemory plus the sync outcome
# (hadron-cli#1014, provider hadron-server#2366). Kept apart from the shared
# GetMemory, which a dozen commands resolve through, so a server that predates
# lastSyncReport fails only `memory get`, not every memory-ref lookup.
query GetMemoryDetail($ref: ID!) {
  memory(ref: $ref) {
    id
    urn
    name
    shortDescription
    description
    class
    visibility
    organizationId
    isEncrypted
    tags
    source
    syncStatus
    lastSyncedAt
    syncError
    # Version 1 JSON text, or null after a clean completed sync. Parsed and
    # validated client-side (internal/cmd/memory/syncreport.go).
    lastSyncReport
    vectorIndexEnabled
    maxRevCount
    listedOnMarketplace
    schema
    createdAt
    updatedAt
  }
}

mutation DeleteMemory($id: ID!) {
  deleteMemory(id: $id)
}

# memory(ref:) accepts the memory's PK id or URN (hadron-server#473).
query GetMemory($ref: ID!) {
  memory(ref: $ref) {
    id
    urn
    name
    shortDescription
    description
    class
    visibility
    organizationId
    # The org's skill-export prefix (hadron-server#1164) — what `hadron skill`
    isEncrypted
    tags
    source
    syncStatus
    vectorIndexEnabled
    maxRevCount
    listedOnMarketplace
    data
    schema
    createdAt
    updatedAt
  }
}

mutation CloneMemory($ref: ID!, $targetUrn: String!) {
  cloneMemory(ref: $ref, targetUrn: $targetUrn) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Extract a parent node + its loc-subtree into a new memory (hadron-server#637).
# move = false copies (source intact); move = true relocates, soft-deleting the
# source subtree. The default is applied server-side, so it is omitted when the
# --move flag is not set.
mutation ExtractParentNodeToMemory(
  $parentRef: ID!
  $targetUrn: String!
  # @genqlient(omitempty: true)
  $move: Boolean
) {
  extractParentNodeToMemory(parentRef: $parentRef, targetUrn: $targetUrn, move: $move) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Convert a plaintext memory to encrypted-at-rest (#57). One-way: the caller
# provides the data key and all node content/data is rewritten as ciphertext in
# a single transaction. There is no decrypt mutation, so the command gates like a
# destructive op.
# cli#1340 — exactly one of dataKey / passphrase is sent (the server refuses
# both or neither); the other stays omitted.
mutation EncryptMemory(
  $memoryId: ID!
  # @genqlient(omitempty: true)
  $dataKey: String
  # @genqlient(omitempty: true)
  $passphrase: String
) {
  encryptMemory(memoryId: $memoryId, dataKey: $dataKey, passphrase: $passphrase) {
    id
    urn
    name
    isEncrypted
  }
}

# Promote an anonymous/session memory to a registered user (#75, descoped from
# #57). Backs `hadron memory link-user`.
#
# App-key only: the server gates on ctx.appId, so a user PAT is refused. The
# memory must be a user/anonymous memory in the App's own organization.
#
# externalUserId is the App's own identifier for the end user; the server
# resolves it to an existing app-scoped user or provisions one (unless the App
# sets createUserPermission=DENY).
#
# Two side effects the caller must see, hence selecting urn and isEncrypted:
# the memory's URN is RE-MINTED as a fresh flat v2 urn (the old one stops
# resolving), and encrypting the promotion lands the memory as class='private'
# owned by that user.
#
# The data key NEVER appears here. It is supplied per request through the
# x-hadron-operation-key header (hadron-server#1817, the first #1796 slice for
# cor:sec:040:04: "a key is never a field on a query or a mutation"). The
# command carries it with api.WithOperationKey (a per-call context marker; it
# performs NO validation) and refuses a non-canonical key client-side with
# api.ValidateOperationKey, before any request. This document must not name
# dataKey at all, even to omit it: the removal slice deletes the argument,
# which breaks every document that names it.
mutation LinkMemoryToUser(
  $memoryId: ID!
  $externalUserId: String!
) {
  linkMemoryToUser(memoryId: $memoryId, externalUserId: $externalUserId) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# Memory health audit (hadron-server#819) — the GraphQL twin of the MCP-only
# hadron_validate, wired up for `hadron memory validate` (#352).
#
# Two fields exist because `findings` is NOT the answer on its own:
#   - totalFindings is the true count BEFORE `limit` truncation — gate CI on
#     this, never on len(findings).
#   - ok is false when any check was SKIPPED, even with zero findings, so a
#     clean bill of health can't quietly omit a check. skippedChecks says which
#     and why (e.g. the stale-abstract check is skipped on encrypted memories:
#     the validator does not decrypt).
#
# The server takes no per-check filter, so --check narrows client-side; the
# command surfaces the interaction with truncation rather than hiding it.
query ValidateMemory(
  $memoryRef: ID!
  # @genqlient(omitempty: true)
  $limit: Int
) {
  validateMemory(memoryRef: $memoryRef, limit: $limit) {
    memoryId
    nodesChecked
    ok
    totalFindings
    truncated
    findings {
      kind
      nodeId
      nodeLoc
      nodeUrn
      detail
    }
    skippedChecks {
      check
      reason
    }
  }
}

# Re-stamp every live node whose embedding failed so the embedding worker tries
# it again (hadron-server retryFailedEmbeddings, cli#356). The Int is how many
# were RE-STAMPED, never how many ended up indexed. Not idempotent-by-contract
# for a client: a transport error leaves the outcome unknown, so the caller does
# not retry it.
#
# pointer: true so a missing/null result stays nil instead of decoding to 0 —
# 0 is a legitimate answer ("nothing to re-stamp"), absence is an unknown
# outcome (cli#1008).
mutation RetryFailedEmbeddings($memoryRef: ID!) {
  # @genqlient(pointer: true)
  retryFailedEmbeddings(memoryRef: $memoryRef)
}

# cli#1340 — fold one memory into another (mergeMemories). Source nodes whose
# loc exists in the target fold via the mergeNodes field strategy (include);
# the rest move over with their loc. The source ends up empty, and
# deleteSourceMem deletes it. A refusal after some batches committed carries
# extensions.partialMerge; re-running the same merge finishes it.
mutation MergeMemories($input: MergeMemoriesInput!) {
  mergeMemories(input: $input) {
    id
    urn
    name
    shortDescription
    class
    visibility
    organizationId
    isEncrypted
    maxRevCount
    updatedAt
  }
}

# cli#1340 — the tamper check over every live node of a memory (#1591).
query VerifyMemoryNodes($memoryRef: String!) {
  verifyMemoryNodes(memoryRef: $memoryRef) {
    checked
    intact
    notApproved
    superseded
    tampered
    problems {
      nodeId
      urn
      loc
      state
      revision
      approvedRevision
      expectedHash
      actualHash
    }
  }
}
