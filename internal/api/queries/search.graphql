# Ranked node search backing `hadron search` (#135). Same unified findNodes
# field as nodes.graphql's FindNodes, but a search-shaped selection: per-hit
# score, abstract/description, and the vector abstract-staleness flag — so a
# result list is assessable at a glance without one `node get` per hit. Kept
# separate from FindNodes so the browse/list callers (`node ls`, exports, spec
# reads) don't pay for abstract payloads they never render.
#
# The server treats an omitted NodeFilter field as "no constraint"; nil
# pointers must therefore be omitted, not sent as null — same contract as
# nodes.graphql.
# @genqlient(for: "NodeFilter.memoryIds", omitempty: true)
# @genqlient(for: "NodeFilter.memoryClasses", omitempty: true)
# @genqlient(for: "NodeFilter.nodeType", omitempty: true)
# @genqlient(for: "NodeFilter.objectType", omitempty: true)
# @genqlient(for: "NodeFilter.tags", omitempty: true)
# @genqlient(for: "NodeFilter.isRunnable", omitempty: true)
# @genqlient(for: "NodeFilter.locPrefix", omitempty: true)
# @genqlient(for: "NodeFilter.createdBy", omitempty: true)
# @genqlient(for: "NodeFilter.updatedAfter", omitempty: true)
# @genqlient(for: "NodeFilter.updatedBefore", omitempty: true)
# @genqlient(for: "NodeFilter.includeDeleted", omitempty: true)
# @genqlient(for: "NodeFilter.where", omitempty: true)
# @genqlient(for: "NodeFilter.role", omitempty: true)
# NodeWhereInput / NodePropertySort are bound to hand-authored structs
# (internal/api/gqltypes) — see nodes.graphql's FindNodes for why genqlient
# can't own the omitempty on the recursive NodeWhereInput.
query SearchNodes(
  $query: String!
  # @genqlient(omitempty: true)
  $mode: FindNodesMode
  # @genqlient(omitempty: true)
  $filter: NodeFilter
  # @genqlient(omitempty: true)
  $sortProperty: NodePropertySort
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
  # Spec 049 (D-2026-09-13-002): a scope id, a bare scope NAME (needs an App
  # context), `app`, or `global`. The server resolves it — the CLI passes the
  # string through and renders what comes back. Omitted is the pre-049
  # behaviour (your whole accessible set), which is why it carries omitempty:
  # an explicit null here is not the same as not asking for a scope.
  # @genqlient(omitempty: true)
  $scope: String
  # REQUIRED by the server for `scope: "app"` and for a bare scope NAME — a
  # name is unique only per owner, so it resolves in an App's context. Sending
  # the scope without it makes those two forms fail or resolve against
  # unrelated ambient state (@codex, #595).
  # @genqlient(omitempty: true)
  $appRef: ID
  # cor:api:100:01 — for a member this selects the "active organization" view,
  # which is what `scope: "global"` resolves against. Omitted means the server
  # falls back to a single membership and otherwise refuses, so it carries
  # omitempty: sending null is not the same as not naming an organization.
  # @genqlient(omitempty: true)
  $orgId: ID
  # The two JSONB columns, opt-in and independent (#602) — the read half of
  # --where's `field` key, which names exactly these two. Separate variables so
  # --with-data fetches data ALONE; `Boolean!` because @include(if:) takes a
  # non-null argument. genqlient renders the selected fields as
  # *json.RawMessage, nil when not selected.
  $withProperties: Boolean!
  $withData: Boolean!
) {
  findNodes(
    query: $query
    mode: $mode
    filter: $filter
    sortProperty: $sortProperty
    limit: $limit
    offset: $offset
    scope: $scope
    appRef: $appRef
    orgId: $orgId
  ) {
    total
    degraded
    reason
    # The scope the search ACTUALLY ran under, as the server resolved it.
    # `source` is which rung of the ladder won and `droppedCount` is what the
    # scope lists but the caller may not read — the disclosure that stops a
    # short result list reading as "there is nothing there". Null when no
    # scope applied.
    scope {
      kind
      label
      source
      ownerUrn
      memoryUrns
      droppedCount
    }
    hits {
      score
      vector {
        abstractStale
      }
      node {
        id
        memoryId
        loc
        name
        nodeType
        tags
        description
        abstract
        updatedAt
        properties @include(if: $withProperties)
        data @include(if: $withData)
      }
    }
  }
}
