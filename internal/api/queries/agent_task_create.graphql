# @genqlient(for: "CreateNodeInput.seq", omitempty: true)
# @genqlient(for: "CreateNodeInput.tags", omitempty: true)
mutation CreateRoleTask(
  $input: CreateNodeInput!
  # @genqlient(omitempty: true)
  $index: TaskIndexInput
  # @genqlient(omitempty: true)
  $skill: TaskSkillExportInput
) {
  createTaskNode(input: $input, index: $index, skill: $skill) {
    id
    memoryId
    loc
    urn
    name
    nodeType
    isRunnable
    role
    updatedAt
    outgoingEdges {
      id
      name
      target {
        id
        loc
        urn
      }
    }
  }
}
