# Organization & membership management (#56). Roles are the shared Role enum
# (OWNER/ADMIN/CONTRIBUTOR/READER).

fragment OrgFields on Organization {
  id
  urn
  name
  listedOnMarketplace
  createdAt
  updatedAt
}

# The identity fields (identityProvider/githubId/externalId/externalAppId)
# are load-bearing for duplicate-account triage: `user merge` folds a
# source-only value into an EMPTY target field only, so a populated
# collision is cleared from the source and that login stops working. Seeing
# both sides' providers is what tells a merge apart from a lockout
# (cor:api:010:02).
fragment UserFields on User {
  id
  name
  email
  handle
  githubUsername
  roles
  identityProvider
  githubId
  externalId
  externalAppId
  linkedAt
}

# organization(ref:) accepts the org's PK id or URN (hadron-server#473).
query GetOrganization($ref: ID!) {
  organization(ref: $ref) {
    ...OrgFields
  }
}

# organization(ref) is the only path to an org's members.
query OrgMembers($ref: ID!) {
  organization(ref: $ref) {
    id
    members {
      id
      role
      canInvite
      user {
        ...UserFields
      }
    }
  }
}

# The uniform single-user read (hadron-server#473): ref accepts a PK or an
# hrn:user:<handle> URN; denied and missing are both null (anti-enumeration).
# The access-check user resolution tries this before falling back to the
# paged search below.
query GetUser($ref: ID!) {
  user(ref: $ref) {
    ...UserFields
  }
}

# Uniform paginated user list (hadron-server#473) — replaces searchUsers.
# Non-admin callers must pass filter.query (enumeration-safe matching:
# handle/githubUsername substring, email exact). Results are name-ascending,
# so an EXACT identifier match can sit past the first 200-cap page — user-ref
# resolution pages via api.CollectUntil with an exact-match short-circuit.
#
# $query is nullable and omitempty: a nil pointer drops the variable, which
# GraphQL input-object coercion renders as `filter: {}` — i.e. an omitted
# query. That is the platform ADMIN/OWNER full-user-list path (a non-admin
# gets an empty page instead, per cor:acl:070:02), and it is the only way to
# enumerate accounts nobody thought to search for.
query SearchUsers(
  # @genqlient(omitempty: true)
  $query: String
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  users(filter: { query: $query }, limit: $limit, offset: $offset) {
    total
    items {
      ...UserFields
    }
  }
}

mutation CreateOrganization($name: String!, $urn: String!) {
  createOrganization(name: $name, urn: $urn) {
    ...OrgFields
  }
}

mutation UpdateOrganization(
  $id: ID!
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $urn: String
  # @genqlient(omitempty: true)
  $listedOnMarketplace: Boolean
) {
  updateOrganization(id: $id, name: $name, urn: $urn, listedOnMarketplace: $listedOnMarketplace) {
    ...OrgFields
  }
}

mutation DeleteOrganization($id: ID!) {
  deleteOrganization(id: $id)
}

mutation AddOrgMember($orgId: ID!, $userId: ID!, $role: Role!) {
  addOrgMember(orgId: $orgId, userId: $userId, role: $role) {
    id
    role
    user {
      ...UserFields
    }
  }
}

mutation UpdateOrgMember($orgId: ID!, $userId: ID!, $role: Role!) {
  updateOrgMember(orgId: $orgId, userId: $userId, role: $role) {
    id
    role
    user {
      ...UserFields
    }
  }
}

mutation RemoveOrgMember($orgId: ID!, $userId: ID!) {
  removeOrgMember(orgId: $orgId, userId: $userId)
}

# Organizations list (#473 uniform surface) — for `org ls`. Unscoped spans
# every org the caller can see (all live orgs for a platform admin); memberOnly
# restricts to the caller's own memberships.
query Organizations(
  # @genqlient(omitempty: true)
  $filter: OrganizationFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  organizations(filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...OrgFields
    }
  }
}

fragment InvitationFields on UserInvitation {
  id
  slug
  email
  name
  githubUsername
  memberRole
  organizationId
  maxActivations
  activationCount
  expiresAt
  acceptedAt
  createdAt
}

# Org-scoped invitation (#56). The returned `slug` is the acceptance token the
# invitee redeems with `org invite accept <slug>`.
mutation CreateUserInvitation(
  $orgId: ID!
  $memberRole: Role!
  # @genqlient(omitempty: true)
  $email: String
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $githubUsername: String
  # @genqlient(omitempty: true)
  $expiresInDays: Int
  # @genqlient(omitempty: true)
  $maxActivations: Int
) {
  createUserInvitation(
    orgId: $orgId
    memberRole: $memberRole
    email: $email
    name: $name
    githubUsername: $githubUsername
    expiresInDays: $expiresInDays
    maxActivations: $maxActivations
  ) {
    ...InvitationFields
  }
}

mutation AcceptInvitation($slug: String!) {
  acceptInvitation(slug: $slug)
}

query GetInvitation($slug: String!) {
  invitation(slug: $slug) {
    ...InvitationFields
  }
}

# Update the signed-in user's own profile (#56). Only the fields passed are sent
# (omitempty), so an unset flag leaves that field unchanged.
mutation UpdateMyProfile(
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $email: String
  # @genqlient(omitempty: true)
  $handle: String
) {
  updateMyProfile(name: $name, email: $email, handle: $handle) {
    ...UserFields
  }
}

# mergeUsers globally consolidates a duplicate source user into a surviving
# target user; $source and $target each accept a PK id, bare handle, or
# fully-qualified hrn:user:<handle> URN, passed through verbatim. The source is
# soft-deleted; the target survives. Destructive + irreversible — `hadron user
# merge` gates it behind a confirmation. The server is authoritative for
# authorization (platform or org ADMIN/OWNER) and collision handling; the CLI
# adds no local checks. Spec cor:api:010:02.
mutation MergeUsers($source: String!, $target: String!) {
  mergeUsers(input: { source: $source, target: $target }) {
    ...UserFields
  }
}

# publicOrganization returns the sanitized, non-member-safe view of a
# DISCOVERABLE organization (activated + a public footprint), or null when the
# org isn't discoverable — the server collapses not-found and not-discoverable
# to null for anti-enumeration. `$ref` accepts an org id or URN. Surfaced by
# `hadron org public`. Spec cor:acl:080:02 (#270 / hadron-server#741).
fragment PublicResourceRefFields on PublicResourceRef {
  id
  name
  urn
  description
}

query PublicOrganization($ref: ID!) {
  publicOrganization(ref: $ref) {
    id
    urn
    name
    listedOnMarketplace
    publicMemories {
      ...PublicResourceRefFields
    }
    publicAgents {
      ...PublicResourceRefFields
    }
  }
}

# Platform-role administration (#75, descoped from #56). Backs
# `hadron user set-roles`.
#
# updateUserRoles takes a raw PK — unlike mergeUsers it does NOT resolve a
# ref server-side — so the CLI resolves the caller's <userRef> to an id
# first (cmdutil.ResolveUserID) and passes that.
#
# `roles` REPLACES the user's whole role set; the server assigns the list
# verbatim. The command reads the current set first (via the GetUser query
# above) so it can show before → after and make that replacement explicit
# before it happens.
mutation UpdateUserRoles($userId: ID!, $roles: [Role!]!) {
  updateUserRoles(userId: $userId, roles: $roles) {
    ...UserFields
  }
}
