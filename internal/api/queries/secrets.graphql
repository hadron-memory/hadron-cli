# General secret store (#677). Secret values are write-only: readers never
# select or print them.

fragment SecretFields on Secret {
  id
  ownerType
  ownerId
  name
  kind
  metadata
  createdAt
  createdBy
  updatedAt
  updatedBy
}

query Secrets(
  $ownerType: String!
  # @genqlient(omitempty: true)
  $ownerRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  secrets(ownerType: $ownerType, ownerRef: $ownerRef, limit: $limit, offset: $offset) {
    items {
      ...SecretFields
    }
    total
  }
}

mutation CreateSecret(
  $ownerType: String!
  # @genqlient(omitempty: true)
  $ownerRef: ID
  $name: String!
  $kind: String!
  # @genqlient(omitempty: true)
  $metadata: JSON
  $value: JSON!
) {
  createSecret(ownerType: $ownerType, ownerRef: $ownerRef, name: $name, kind: $kind, metadata: $metadata, value: $value) {
    ...SecretFields
  }
}

mutation DeleteSecret($ref: ID!) {
  deleteSecret(ref: $ref)
}

# One secret's inspectable half (#1343). Null both when it does not exist and
# when the caller is not entitled to its owner scope (no existence oracle).
query Secret($ref: ID!) {
  secret(ref: $ref) {
    ...SecretFields
  }
}

# Overwrite a secret's value and/or metadata (v1 rotation: no versions). An
# omitted argument preserves the stored half, so both are omitempty.
mutation UpdateSecret(
  $ref: ID!
  # @genqlient(omitempty: true)
  $metadata: JSON
  # @genqlient(omitempty: true)
  $value: JSON
) {
  updateSecret(ref: $ref, metadata: $metadata, value: $value) {
    ...SecretFields
  }
}
