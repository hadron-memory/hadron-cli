# General secret store (#677). Secret values are write-only: readers never
# select or print them.

fragment SecretFields on Secret {
  id
  ownerType
  ownerId
  name
  kind
  metadata
  # App secrets only (hadron-server#3997): null / false for org and user secrets.
  currentVersion
  protected
  createdAt
  createdBy
  updatedAt
  updatedBy
}

query Secrets(
  $ownerType: String!
  # @genqlient(omitempty: true)
  $ownerRef: ID
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  secrets(ownerType: $ownerType, ownerRef: $ownerRef, limit: $limit, offset: $offset) {
    items {
      ...SecretFields
    }
    total
  }
}

mutation CreateSecret(
  $ownerType: String!
  # @genqlient(omitempty: true)
  $ownerRef: ID
  $name: String!
  $kind: String!
  # @genqlient(omitempty: true)
  $metadata: JSON
  $value: JSON!
) {
  createSecret(ownerType: $ownerType, ownerRef: $ownerRef, name: $name, kind: $kind, metadata: $metadata, value: $value) {
    ...SecretFields
  }
}

# cli#2815: the --protected tri-state is flag-conditional BY DOCUMENT (Eden's
# ruling on the round-5 BLIND P2, chat #137754), following the client-list
# precedent (cli#2758/2720: one document per server generation, stepping only
# as far as the server's validation error forces). CreateSecret above keeps its
# pre-#2815 shape — no `protected` anywhere — so a server from before the
# argument reached server main (2026-11-21, hadron-server#4177 e42bb1897)
# keeps accepting plain creates exactly as before the flag existed. This
# document is chosen only when --protected is given, so its `protected`
# argument is always sent (no omitempty): true stages the whole creation for a
# passkey (App scope only, the server words the refusal), false asks for the
# default outright.
mutation CreateSecretProtected(
  $ownerType: String!
  # @genqlient(omitempty: true)
  $ownerRef: ID
  $name: String!
  $kind: String!
  # @genqlient(omitempty: true)
  $metadata: JSON
  $value: JSON!
  $protected: Boolean
) {
  createSecret(ownerType: $ownerType, ownerRef: $ownerRef, name: $name, kind: $kind, metadata: $metadata, value: $value, protected: $protected) {
    ...SecretFields
  }
}

mutation DeleteSecret($ref: ID!) {
  deleteSecret(ref: $ref)
}

# One secret's inspectable half (#1343). Null both when it does not exist and
# when the caller is not entitled to its owner scope (no existence oracle).
query Secret($ref: ID!) {
  secret(ref: $ref) {
    ...SecretFields
  }
}

# Overwrite a secret's value and/or metadata (v1 rotation: no versions). An
# omitted argument preserves the stored half, so both are omitempty. This
# document keeps its pre-#2815 shape (no `protected`): `secret set` and every
# flag-omitted update ride it, so servers from before the argument reached
# server main keep accepting them (see CreateSecretProtected above).
mutation UpdateSecret(
  $ref: ID!
  # @genqlient(omitempty: true)
  $metadata: JSON
  # @genqlient(omitempty: true)
  $value: JSON
) {
  updateSecret(ref: $ref, metadata: $metadata, value: $value) {
    ...SecretFields
  }
}

# cli#2815: the flag-conditional protection-change document, chosen only when
# --protected is given (always sent, no omitempty): an explicit value stages a
# protection change on an App secret (false is manager-only; the server judges
# both, the CLI never pre-checks).
mutation UpdateSecretProtected(
  $ref: ID!
  # @genqlient(omitempty: true)
  $metadata: JSON
  # @genqlient(omitempty: true)
  $value: JSON
  $protected: Boolean
) {
  updateSecret(ref: $ref, metadata: $metadata, value: $value, protected: $protected) {
    ...SecretFields
  }
}

# An App secret's kept versions, newest first (metadata only, never a value).
# Null secret = missing or not visible, same as `secret`.
query SecretVersions(
  $ref: ID!
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  secret(ref: $ref) {
    id
    name
    currentVersion
    protected
    versions(limit: $limit, offset: $offset) {
      items {
        versionNo
        sizeBytes
        writtenAt
        supersededAt
        writtenByUserId
        writtenByWorkerId
      }
      total
      hasMore
    }
  }
}

# One App secret's audit events, newest first. A caller the server excludes
# gets an empty page (no existence oracle).
query SecretEvents(
  $ref: ID!
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  secretEvents(ref: $ref, limit: $limit, offset: $offset) {
    items {
      id
      at
      kind
      outcome
      secretId
      secretName
      versionNo
      actorUserId
      workerId
      sessionId
    }
    total
  }
}

# Protected-secret changes (hadron-server#3999 S4, cor:sec:070:02). On a
# protected secret every change is STAGED, never applied: setSecretProtected
# and the other doors refuse with SECRET_PROTECTED_NEEDS_PASSKEY carrying
# extensions.requestId and extensions.ceremonyUrl, and a person completes it on
# that page. These operations are absent from a server whose signing is off.
mutation SetSecretProtected($ref: ID!, $protected: Boolean!) {
  setSecretProtected(ref: $ref, protected: $protected) {
    ...SecretFields
  }
}

# The requester's own change request; null for anyone else. Never carries the
# staged value.
query SecretChangeRequest($id: ID!) {
  secretChangeRequest(id: $id) {
    id
    state
    operation
    createdAt
    expiresAt
  }
}

# true: the open request was withdrawn (its staged value cleared); false: it
# was not open. An unknown or someone else's request is NOT_FOUND.
mutation WithdrawSecretChangeRequest($id: ID!) {
  # @genqlient(pointer: true)
  withdrawSecretChangeRequest(id: $id)
}
