# @genqlient(for: "UsageEventInput.tokensIn", omitempty: true)
# @genqlient(for: "UsageEventInput.tokensOut", omitempty: true)
mutation RecordUsage(
  $event: UsageEventInput!
) {
  recordUsage(event: $event)
}
