# #2162 (S4b of #4229): the agent context cap. These documents are the ONLY ones that
# send or select contextCap, so AgentFields and every other agent document stay valid
# on a server older than hadron-server#4258 (the split-selection rule). A write that
# carries a cap flag uses them; they also carry the lifecycle exactly as the S3 ones do.

mutation CreateAgentWithContextCap(
  $name: String!
  # @genqlient(omitempty: true)
  $lifecycle: AgentLifecycle
  # @genqlient(omitempty: true)
  $orgRef: ID
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $agentType: AgentType
  # @genqlient(omitempty: true)
  $visibility: AgentVisibility
  # @genqlient(omitempty: true)
  $systemMemoryRef: ID
  # @genqlient(omitempty: true)
  $surfaces: [String!]
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $memberRoles: [String!]
  # cli#58 slice 2: omitted takes the server default (usesTasks true, reset
  # false); an explicit false is a value, so both carry omitempty.
  # @genqlient(omitempty: true)
  $usesTasks: Boolean
  # @genqlient(omitempty: true)
  $resetContextAfterTask: Boolean
  # #4225 (hadron-server#4258): THREE states. omitted preserves (update) or means no
  # cap (create); a number sets; an explicit null clears. The variable is bound to
  # gqltypes.ContextCapInput, whose MarshalJSON emits the null; omitempty drops only
  # the nil pointer. Never default it.
  # @genqlient(omitempty: true, bind: "*github.com/hadron-memory/hadron-cli/internal/api/gqltypes.ContextCapInput")
  $contextCap: Int
) {
  createAgent(
    contextCap: $contextCap
    name: $name
    lifecycle: $lifecycle
    orgRef: $orgRef
    description: $description
    type: $agentType
    visibility: $visibility
    systemMemoryRef: $systemMemoryRef
    surfaces: $surfaces
    personaRole: $personaRole
    memberRoles: $memberRoles
    usesTasks: $usesTasks
    resetContextAfterTask: $resetContextAfterTask
  ) {
    ...AgentFields
    lifecycle
    contextCap
  }
}

mutation UpdateAgentWithContextCap(
  $ref: ID!
  # @genqlient(omitempty: true)
  $lifecycle: AgentLifecycle
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $agentType: AgentType
  # @genqlient(omitempty: true)
  $visibility: AgentVisibility
  # @genqlient(omitempty: true)
  $systemMemoryRef: ID
  # omitempty: unset (nil) is omitted → preserved. The CLI's --surface
  # (StringArrayVar) only ever yields nil or a NON-empty slice, so the
  # "empty slice gets omitted" case is unreachable here; explicit clear-the-set
  # support would need a dedicated flag (a later #58 slice).
  # @genqlient(omitempty: true)
  $surfaces: [String!]
  # @genqlient(omitempty: true)
  $urn: String
  # An unset role is omitted and preserved; the shared prompt follows the
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $usesTasks: Boolean
  # #1551: omitted preserves; an explicit false is sent.
  # @genqlient(omitempty: true)
  $resetContextAfterTask: Boolean
  # @genqlient(omitempty: true)
  $memberRoles: [String!]
  # cli#58 slice 2: the server ignores null, so this never sends null; omitted
  # preserves, an explicit false is sent.
  # @genqlient(omitempty: true)
  $listedOnMarketplace: Boolean
  # THREE states (omit preserves / object sets / null clears): the variable is
  # bound to gqltypes.RegisterDefaultsInput, whose MarshalJSON emits the null.
  # omitempty drops only the nil pointer. Never default it.
  # @genqlient(omitempty: true)
  $registerDefaults: RegisterDefaultsInput
  # #4225 (hadron-server#4258): THREE states. omitted preserves (update) or means no
  # cap (create); a number sets; an explicit null clears. The variable is bound to
  # gqltypes.ContextCapInput, whose MarshalJSON emits the null; omitempty drops only
  # the nil pointer. Never default it.
  # @genqlient(omitempty: true, bind: "*github.com/hadron-memory/hadron-cli/internal/api/gqltypes.ContextCapInput")
  $contextCap: Int
) {
  updateAgent(
    contextCap: $contextCap
    ref: $ref
    lifecycle: $lifecycle
    name: $name
    description: $description
    type: $agentType
    visibility: $visibility
    systemMemoryRef: $systemMemoryRef
    surfaces: $surfaces
    urn: $urn
    personaRole: $personaRole
    usesTasks: $usesTasks
    resetContextAfterTask: $resetContextAfterTask
    memberRoles: $memberRoles
    listedOnMarketplace: $listedOnMarketplace
    registerDefaults: $registerDefaults
  ) {
    ...AgentFields
    lifecycle
    contextCap
  }
}

# agent get's read of the cap: its own document, like GetAgentLifecycle, so a server
# without the field rejects only this one and get still answers.
query GetAgentContextCap($ref: ID!) {
  agent(ref: $ref) { id contextCap }
}
