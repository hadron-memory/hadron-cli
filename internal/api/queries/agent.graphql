# Agent lifecycle CRUD (#58, part 1). Agents may be user- or org-owned; create/update take
# positional args (no input struct). Optional args are omitempty so an unset
# flag leaves the server default (create) or the field unchanged (update).

fragment AgentFields on Agent {
  id
  urn
  name
  description
  type
  visibility
  organizationId
  surfaces
  systemMemoryId
  systemPrompt
  aiProvider
  aiModel
  hasAiApiKey
  # The persona DRESSING (#428 / hadron-server#974): personaRole is pure
  # metadata, personaPrompt a {{name}}/{{role}} TEMPLATE bound at casting time
  # (Worker.prompt returns the bound result). The named identity never lives
  # here — it is a Worker.
  personaRole
  personaPrompt
  createdAt
}

query GetAgent($ref: ID!) {
  agent(ref: $ref) {
    ...AgentFields
  }
}

query Agents(
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $filter: AgentFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  agents(orgId: $orgId, filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...AgentFields
    }
  }
}

# The cross-org marketplace slice (#551/#552): every live PUBLIC agent, readable
# without org membership. A deliberately separate surface from agents() (which
# stays member-scoped), not a visibility filter on it — backs `agent ls --public`.
#
# Its filter is a separate, narrower input than agents()' AgentFilter: only
# `type` narrows. The slice is PUBLIC by definition (so `visibility` is
# meaningless) and a PUBLIC agent is never user-owned (so `ownedByMe` would
# always be empty) — the server rejects both at the schema rather than letting a
# client apply AgentFilter uniformly and silently get cross-org agents back.
query PublicAgents(
  # @genqlient(omitempty: true)
  $filter: PublicAgentFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  publicAgents(filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...AgentFields
    }
  }
}

mutation CreateAgent(
  $name: String!
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $agentType: AgentType
  # @genqlient(omitempty: true)
  $visibility: AgentVisibility
  # @genqlient(omitempty: true)
  $systemPrompt: String
  # @genqlient(omitempty: true)
  $systemMemoryId: String
  # @genqlient(omitempty: true)
  $surfaces: [String!]
  # The persona dressing rides create too (#428 review): a role agent is
  # usually born dressed, so the bootstrap is one command, not create+update.
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $personaPrompt: String
) {
  createAgent(
    name: $name
    orgId: $orgId
    description: $description
    type: $agentType
    visibility: $visibility
    systemPrompt: $systemPrompt
    systemMemoryId: $systemMemoryId
    surfaces: $surfaces
    personaRole: $personaRole
    personaPrompt: $personaPrompt
  ) {
    ...AgentFields
  }
}

mutation UpdateAgent(
  $ref: ID!
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $agentType: AgentType
  # @genqlient(omitempty: true)
  $visibility: AgentVisibility
  # @genqlient(omitempty: true)
  $systemPrompt: String
  # @genqlient(omitempty: true)
  $systemMemoryId: String
  # omitempty: unset (nil) is omitted → preserved. The CLI's --surface
  # (StringArrayVar) only ever yields nil or a NON-empty slice, so the
  # "empty slice gets omitted" case is unreachable here; explicit clear-the-set
  # support would need a dedicated flag (a later #58 slice).
  # @genqlient(omitempty: true)
  $surfaces: [String!]
  # @genqlient(omitempty: true)
  $urn: String
  # The persona dressing rides the ordinary agent update since #428 (the
  # `team persona` group is gone — the named identity is a Worker). omitempty:
  # an unset flag is OMITTED (preserve); an explicit null would CLEAR the
  # column (CLAUDE.md wire-semantics gotcha).
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $personaPrompt: String
) {
  updateAgent(
    ref: $ref
    name: $name
    description: $description
    type: $agentType
    visibility: $visibility
    systemPrompt: $systemPrompt
    systemMemoryId: $systemMemoryId
    surfaces: $surfaces
    urn: $urn
    personaRole: $personaRole
    personaPrompt: $personaPrompt
  ) {
    ...AgentFields
  }
}

mutation DeleteAgent($ref: ID!) {
  deleteAgent(ref: $ref)
}
