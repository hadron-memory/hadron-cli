# Agent lifecycle CRUD (#58, part 1). Agents may be user- or org-owned; create/update take
# positional args (no input struct). Optional args are omitempty so an unset
# flag leaves the server default (create) or the field unchanged (update).

fragment AgentFields on Agent {
  id
  urn
  name
  description
  type
  visibility
  organizationId
  surfaces
  systemMemoryId
  systemPrompt
  # #874 read-back: the two index refs, null when unset — agent get shows
  # what agent update set, so the write is verifiable through the CLI.
  tasksIndexRef
  processesIndexRef
  # #881: the base this Agent extends (cor:dmo:050:14), null when it
  # extends nothing.
  extendsAgentId
  aiProvider
  aiModel
  hasAiApiKey
  # The persona role is metadata. systemPrompt is the shared template with
  # {{name}}/{{role}} bound when a Worker is cast or its prompt is resolved.
  personaRole
  usesTasks
  createdAt
}

query GetAgent($ref: ID!) {
  agent(ref: $ref) {
    ...AgentFields
  }
}

# @genqlient(for: "AgentFilter.ownedByMe", omitempty: true)
# @genqlient(for: "AgentFilter.type", omitempty: true)
# @genqlient(for: "AgentFilter.visibility", omitempty: true)
query Agents(
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $filter: AgentFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  agents(orgId: $orgId, filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...AgentFields
    }
  }
}

# The cross-org marketplace slice (#551/#552): every live PUBLIC agent, readable
# without org membership. A deliberately separate surface from agents() (which
# stays member-scoped), not a visibility filter on it — backs `agent ls --public`.
#
# Its filter is a separate, narrower input than agents()' AgentFilter: only
# `type` narrows. The slice is PUBLIC by definition (so `visibility` is
# meaningless) and a PUBLIC agent is never user-owned (so `ownedByMe` would
# always be empty) — the server rejects both at the schema rather than letting a
# client apply AgentFilter uniformly and silently get cross-org agents back.
query PublicAgents(
  # @genqlient(omitempty: true)
  $filter: PublicAgentFilter
  # @genqlient(omitempty: true)
  $limit: Int
  # @genqlient(omitempty: true)
  $offset: Int
) {
  publicAgents(filter: $filter, limit: $limit, offset: $offset) {
    total
    items {
      ...AgentFields
    }
  }
}

mutation CreateAgent(
  $name: String!
  # @genqlient(omitempty: true)
  $orgId: ID
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $agentType: AgentType
  # @genqlient(omitempty: true)
  $visibility: AgentVisibility
  # @genqlient(omitempty: true)
  $systemPrompt: String
  # @genqlient(omitempty: true)
  $systemMemoryId: String
  # @genqlient(omitempty: true)
  $surfaces: [String!]
  # @genqlient(omitempty: true)
  $personaRole: String
) {
  createAgent(
    name: $name
    orgId: $orgId
    description: $description
    type: $agentType
    visibility: $visibility
    systemPrompt: $systemPrompt
    systemMemoryId: $systemMemoryId
    surfaces: $surfaces
    personaRole: $personaRole
  ) {
    ...AgentFields
  }
}

mutation UpdateAgent(
  $ref: ID!
  # @genqlient(omitempty: true)
  $name: String
  # @genqlient(omitempty: true)
  $description: String
  # @genqlient(omitempty: true)
  $agentType: AgentType
  # @genqlient(omitempty: true)
  $visibility: AgentVisibility
  # @genqlient(omitempty: true)
  $systemPrompt: String
  # @genqlient(omitempty: true)
  $systemMemoryId: String
  # omitempty: unset (nil) is omitted → preserved. The CLI's --surface
  # (StringArrayVar) only ever yields nil or a NON-empty slice, so the
  # "empty slice gets omitted" case is unreachable here; explicit clear-the-set
  # support would need a dedicated flag (a later #58 slice).
  # @genqlient(omitempty: true)
  $surfaces: [String!]
  # @genqlient(omitempty: true)
  $urn: String
  # An unset role is omitted and preserved; the shared prompt follows the
  # same rule via systemPrompt above.
  # @genqlient(omitempty: true)
  $personaRole: String
  # @genqlient(omitempty: true)
  $usesTasks: Boolean
) {
  updateAgent(
    ref: $ref
    name: $name
    description: $description
    type: $agentType
    visibility: $visibility
    systemPrompt: $systemPrompt
    systemMemoryId: $systemMemoryId
    surfaces: $surfaces
    urn: $urn
    personaRole: $personaRole
    usesTasks: $usesTasks
  ) {
    ...AgentFields
  }
}

mutation DeleteAgent($ref: ID!) {
  deleteAgent(ref: $ref)
}

# ---- #874: the Agent's two index refs (cor:dmo:050:15 / :16) ---------------
#
# The server owns the base-chain walk and the dedupe; these read what it
# returns. Each row's node carries its own address and, where it applies, the
# base it was inherited from.

query AgentTaskIndexList($ref: ID!) {
  agentTaskList(ref: $ref) {
    node {
      id
      urn
      name
      inheritedFrom {
        agentId
        agentUrn
      }
    }
    trigger
  }
}

query AgentProcessIndexList($ref: ID!) {
  agentProcessList(ref: $ref) {
    node {
      id
      urn
      name
      inheritedFrom {
        agentId
        agentUrn
      }
    }
    kind
    trigger
  }
}

# setAgentIndexRefs reads an OMITTED argument as preserve and an explicit
# NULL as clear — a three-state wire contract one omitempty variable cannot
# express. Values go through SetAgentIndexRefs (omitempty: a nil pointer is
# omitted, so only the passed flags ride); each clear goes through its own
# document below, whose variable marshals a nil pointer as an explicit null
# for exactly the ref being cleared while the other stays omitted. The
# resolver writes each ref independently, so a set and a clear compose.
mutation SetAgentIndexRefs(
  $ref: ID!
  # @genqlient(omitempty: true)
  $tasksIndexRef: ID
  # @genqlient(omitempty: true)
  $processesIndexRef: ID
) {
  setAgentIndexRefs(ref: $ref, tasksIndexRef: $tasksIndexRef, processesIndexRef: $processesIndexRef) {
    ...AgentFields
  }
}

# The clear variable deliberately has NO omitempty: a nil pointer marshals
# as an explicit null in the variables — the server's clear — while the
# untouched ref is OMITTED from the document entirely, and omitted preserves.
mutation ClearAgentTasksIndex($ref: ID!, $tasksIndexRef: ID) {
  setAgentIndexRefs(ref: $ref, tasksIndexRef: $tasksIndexRef) {
    ...AgentFields
  }
}

mutation ClearAgentProcessesIndex($ref: ID!, $processesIndexRef: ID) {
  setAgentIndexRefs(ref: $ref, processesIndexRef: $processesIndexRef) {
    ...AgentFields
  }
}

# #881 (cor:dmo:050:14): set or clear the Agent's base. Two-state on the
# wire: a baseRef value sets it; an OMITTED baseRef clears it (the resolver
# resolves the base only when baseRef is non-empty — there is no preserve
# state), so one omitempty variable serves both set and --clear.
mutation SetAgentBase(
  $ref: ID!
  # @genqlient(omitempty: true)
  $baseRef: ID
) {
  setAgentBase(ref: $ref, baseRef: $baseRef) {
    ...AgentFields
  }
}
