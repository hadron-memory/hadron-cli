query PreviewAgentSchedule(
  $input: PreviewAgentScheduleInput!
) {
  previewAgentSchedule(input: $input) {
    outcome
    hash
    reason
    summary {
      name schedule reads writes cannotDo tools limits
      flows { name urn tools writes }
    }
  }
}
