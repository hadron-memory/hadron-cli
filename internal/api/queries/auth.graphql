# User-scoped API key (PAT) management — server feature 025-oauth-for-mcp
# FR-004. These require a user-resolved caller (a browser-login token); an
# AppKey-resolved caller is rejected UNAUTHENTICATED.

fragment UserApiKeyFields on UserApiKey {
  id
  label
  keyPreview
  issuedVia
  createdAt
  lastUsedAt
  revokedAt
  hiddenAt
}

# includeHidden carries omitempty: false is the server default, so it is left
# out rather than sent, and a hidden key stays hidden unless asked for (#1344).
query MyUserApiKeys(
  $limit: Int!
  $offset: Int!
  # @genqlient(omitempty: true)
  $includeHidden: Boolean
) {
  myUserApiKeysPage(includeHidden: $includeHidden, limit: $limit, offset: $offset) {
    hasMore
    items {
      ...UserApiKeyFields
    }
  }
}

# Returns the raw key EXACTLY ONCE (the server stores only its hash). label is
# optional — omitted lets the server apply its placeholder default.
mutation CreateUserApiKey(
  # @genqlient(omitempty: true)
  $label: String
) {
  createUserApiKey(label: $label) {
    rawKey
    userApiKey {
      ...UserApiKeyFields
    }
  }
}

# Idempotent for an already-revoked key; returns the updated key.
mutation RevokeUserApiKey($id: ID!) {
  revokeUserApiKey(id: $id) {
    ...UserApiKeyFields
  }
}

# Hide or unhide one of the caller's OWN revoked keys in the default list.
# Display state only; hiding an active key is refused (KEY_ACTIVE).
mutation SetUserApiKeyHidden($id: ID!, $hidden: Boolean!) {
  setUserApiKeyHidden(id: $id, hidden: $hidden) {
    ...UserApiKeyFields
  }
}

# Delete one of the caller's OWN API keys, live or revoked, hidden or not. A live
# key is revoked first with its live subtree; the keys it minted directly stay,
# revoked, with no parent. Never retried: the key is gone after a success.
mutation DeleteUserApiKey($id: ID!) {
  deleteUserApiKey(id: $id) {
    id
    keyId
    keyPreview
    revokedKeyIds
    mintedKeyIds
    deletedAt
  }
}
