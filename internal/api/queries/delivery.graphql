# Chat delivery — hadron-cli#907 (C1) over hadron-server#2017 (S1). The host
# poller reads its ready-to-deliver batches and acknowledges the ones it
# typed, with the host's App key (attention:deliver and host:operate). A
# batch id is a signed proof: it goes back to the server and nowhere else.
# S5's hold report is #940.

query DeliveryBatches($appRef: String!, $first: Int!,
 # @genqlient(omitempty: true)
 $after: String
) {
  deliveryBatches(appRef: $appRef, first: $first, after: $after) {
    batches {
      id
      worker { id }
      text
      deliverAfter
      busyDeadline
      interrupt
      overflow
      ranges {
        channel { id }
        incarnation
        fromSeq
        throughSeq
        seqs
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}

mutation AcknowledgeDeliveryBatches($batchIds: [String!]!,
 # @genqlient(omitempty: true)
 $through: [BatchThrough!]
) {
  acknowledgeDeliveryBatches(batchIds: $batchIds, through: $through) {
    acknowledged
    unchanged
  }
}
# R57 own-session page: server auth binds this call via X-Hadron-Session.
query SessionInbox($appRef: String!, $workerRefs: [String!]!,
 # @genqlient(omitempty: true)
 $after: String
) {
 deliveryBatches(appRef:$appRef, workerRefs:$workerRefs, first:200, after:$after) {
  batches { id worker { id name } text deliverAfter busyDeadline interrupt overflow
   ranges { channel { id } incarnation fromSeq throughSeq seqs }
  }
  pageInfo { hasNextPage endCursor }
 }
}

# hadron-cli#1178: the host poller's tick and task wakes (cor:agt:080:08,
# :16), with the host key. No accepts, so no STOP notice is offered (this
# deliverer cannot type one); no workerRefs, so the key's host is the lane.
query DueWakes($appRef: String!, $first: Int!,
 # @genqlient(omitempty: true)
 $after: String
) {
  dueWakes(appRef: $appRef, first: $first, after: $after) {
    status
    withheld
    dormant { worker { id } }
    wakes {
      proof
      worker { id }
      deliverAfter
      busyDeadline
      channels { channel { id } }
      reasons {
        kind
        ticker { id name lastTickAt }
        task { eventId chainIndex event id title }
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}

mutation AcknowledgeWakes($proofs: [String!]!) {
  acknowledgeWakes(proofs: $proofs) {
    acknowledged
    unchanged
  }
}

# hadron-cli#1187: `hadron orca terminal status` reads the unanswered ticks of
# the named workers. anchorAt is the OLDEST unacknowledged tick time, which the
# dark rule compares with the fastest subscribed ticker's interval (never
# Ticker.lastTickAt). No accepts and never acknowledged: a read only. A caller
# the server does not let read another worker's wakes is refused, and the
# command fails closed on it.
query DueTickWakes($appRef: String!, $first: Int!, $workerRefs: [String!],
 # @genqlient(omitempty: true)
 $after: String
) {
  dueWakes(appRef: $appRef, first: $first, workerRefs: $workerRefs, after: $after) {
    status
    wakes {
      worker { id }
      anchorAt
      reasons { kind ticker { id name lastTickAt } }
    }
    pageInfo { hasNextPage endCursor }
  }
}
