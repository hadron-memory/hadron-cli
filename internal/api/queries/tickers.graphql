# Ticker commands only; wake transport belongs to #906.
fragment TickerFields on Ticker {
 id urn name slug app { id } cadenceSeconds anchorAt quietHours
 channels { id name } relevance reasons enabled owner { id name urn }
 nextTickAt lastTickAt createdAt updatedAt
 tickCode registerTaskLoc
}
fragment TickerSubscriptionFields on TickerSubscription {
 id worker { id name urn } createdBy { id name urn } viaGrant createdAt endedAt endedReason
}
query ListTickers($appRef: String!) {
 tickers(appRef: $appRef) { ...TickerFields }
}
# cli#1339: tickersPage is the same App gate, rows and order as tickers, with the
# real total. limit 0 is a count only; a limit over 200 is served as 200.
query ListTickersPage(
 $appRef: String!
 # @genqlient(omitempty: true)
 $limit: Int
 # @genqlient(omitempty: true)
 $offset: Int
) {
 tickersPage(appRef: $appRef, limit: $limit, offset: $offset) { total hasMore items { ...TickerFields } }
}
query GetTicker($ref: String!) {
 ticker(ref: $ref) { ...TickerFields }
}
query TickerSubscribers($ref: String!, $first: Int!,
 # @genqlient(omitempty: true)
 $after: String
) { ticker(ref: $ref) { subscribers(first: $first, after: $after) { items { ...TickerSubscriptionFields } hasNextPage endCursor } }
}
# @genqlient(for: "TickerInput.anchorAt", omitempty: true)
# @genqlient(for: "TickerInput.quietHours", omitempty: true)
# @genqlient(for: "TickerInput.channelIds", omitempty: true)
# @genqlient(for: "TickerInput.relevance", omitempty: true)
# @genqlient(for: "TickerInput.reasons", omitempty: true)
# @genqlient(for: "TickerInput.enabled", omitempty: true)
mutation CreateTicker(
 $appRef: String!
 $input: TickerInput!
) {
 createTicker(appRef: $appRef, input: $input) { ...TickerFields }
}
# @genqlient(for: "TickerPatch.name", omitempty: true)
# @genqlient(for: "TickerPatch.cadenceSeconds", omitempty: true)
# @genqlient(for: "TickerPatch.anchorAt", omitempty: true)
# @genqlient(for: "TickerPatch.quietHours", omitempty: true)
# @genqlient(for: "TickerPatch.clearQuietHours", omitempty: true)
# @genqlient(for: "TickerPatch.channelIds", omitempty: true)
# @genqlient(for: "TickerPatch.clearChannels", omitempty: true)
# @genqlient(for: "TickerPatch.relevance", omitempty: true)
# @genqlient(for: "TickerPatch.reasons", omitempty: true)
# @genqlient(for: "TickerPatch.enabled", omitempty: true)
mutation UpdateTicker(
 $ref: String!
 $input: TickerPatch!
) {
 updateTicker(ref: $ref, input: $input) { ...TickerFields }
}
mutation DeleteTicker($ref: String!) {
 deleteTicker(ref: $ref) }
mutation SubscribeTicker($tickerRef: String!, $workerRef: String!) {
 subscribeWorker(tickerRef: $tickerRef, workerRef: $workerRef) { subscription { ...TickerSubscriptionFields } announcement }
}
mutation UnsubscribeTicker($tickerRef: String!, $workerRef: String!) {
 unsubscribeWorker(tickerRef: $tickerRef, workerRef: $workerRef) { subscription { ...TickerSubscriptionFields } announcement }
}
# #2096 repair (cli#1291): create the Agent's template tickers one worker is missing.
mutation ApplyAgentTickerTemplates($workerRef: String!) {
 applyAgentTickerTemplates(workerRef: $workerRef) {
  created { ticker { ...TickerFields } template { id name } effectiveCadenceSeconds }
  alreadyPresent { id name }
 }
}
# The App's cadence floor, read only to label a created ticker made at it.
query TickerAppFloor($appRef: String!) {
 appTickerSettings(appRef: $appRef) { minCadenceSeconds }
}
